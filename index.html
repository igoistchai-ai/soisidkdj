<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
/>

<title>NZX OSINT TOOL</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#f5f5f5;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.92);
  --card:#111;
  --text:#f5f5f5;
  --muted:#777;
  --dim:#444;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
  --good:#d9ffd9;
  --warn:#ffe7a3;
  --bad:#ff9b9b;
}


/* ==========================================================
   APP
========================================================== */

.app{
  width:100%;
  height:100%;
  position:relative;
  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.025),
      transparent 45%
    ),
    #050505;
}


/* ==========================================================
   TOPBAR
========================================================== */

.topbar{
  position:fixed;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:72px;

  display:flex;
  align-items:center;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      rgba(8,8,8,.98),
      rgba(8,8,8,.88)
    );

  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #fff;
  border-radius:11px;

  font-size:19px;
  font-weight:900;

  margin-right:12px;

  box-shadow:
    0 0 25px rgba(255,255,255,.08);
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:210px;
}

.brand b{
  font-size:14px;
  letter-spacing:.15em;
}

.brand small{
  color:#666;
  font-size:8px;
  letter-spacing:.24em;
}

.top-tools{
  display:flex;
  align-items:center;
  gap:7px;
  margin-left:auto;
}

.top-btn{
  height:34px;

  padding:0 13px;

  color:#bbb;

  background:#0c0c0c;

  border:1px solid var(--line2);

  border-radius:8px;

  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;

  transition:
    .2s ease;
}

.top-btn:hover{
  color:#fff;
  background:#161616;
  border-color:#666;
  transform:translateY(-1px);
}

.profile-mini{
  width:38px;
  height:38px;

  border-radius:50%;

  border:1px solid #333;

  background:#111;

  overflow:hidden;

  margin-left:10px;

  padding:0;
}

.profile-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* ==========================================================
   SIDEBAR
========================================================== */

.sidebar{
  position:fixed;

  left:0;
  top:72px;
  bottom:0;

  width:66px;

  z-index:90;

  display:flex;
  align-items:center;
  flex-direction:column;

  padding-top:18px;

  background:
    rgba(6,6,6,.94);

  border-right:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.side-btn{
  width:42px;
  height:42px;

  margin-bottom:8px;

  border:1px solid transparent;

  border-radius:10px;

  color:#555;

  background:transparent;

  font-size:19px;

  transition:.2s ease;
}

.side-btn:hover,
.side-btn.active{
  color:#fff;
  background:#111;
  border-color:#292929;
}


/* ==========================================================
   PAGES
========================================================== */

.page{
  display:none;

  position:absolute;

  top:72px;
  left:66px;
  right:0;
  bottom:0;
}

.page.active{
  display:block;
}


/* ==========================================================
   CHAIN
========================================================== */

.chain-page{
  width:100%;
  height:100%;
  position:relative;
}

.chain-toolbar{
  position:absolute;

  top:17px;
  left:18px;
  right:18px;

  z-index:30;

  display:flex;
  gap:8px;
  align-items:center;
}

.chain-search{
  width:240px;
  height:37px;

  padding:0 12px;

  border-radius:9px;

  border:1px solid var(--line2);

  background:
    rgba(10,10,10,.86);

  color:#fff;

  outline:none;

  font-size:11px;
}

.chain-search:focus{
  border-color:#666;
}

.chain-search::placeholder{
  color:#555;
}

.btn{
  height:37px;

  padding:0 13px;

  border-radius:9px;

  border:1px solid var(--line2);

  color:#aaa;

  background:#0c0c0c;

  font-size:10px;
  font-weight:800;

  transition:.2s ease;
}

.btn:hover{
  color:#fff;
  background:#151515;
  border-color:#777;
}

.btn.primary{
  color:#050505;
  background:#fff;
  border-color:#fff;
}

.btn.primary:hover{
  background:#ddd;
}


/* ==========================================================
   GRAPH
========================================================== */

.graph{
  width:100%;
  height:100%;

  position:relative;

  overflow:hidden;

  background-color:#050505;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:40px 40px;
}


/*
  ВАЖНО:
  Теперь world — полноценная координатная плоскость.
  SVG и nodes находятся в одной системе координат.
  Поэтому линии больше не "пропадают".
*/

.world{
  position:absolute;

  left:50%;
  top:50%;

  width:10000px;
  height:10000px;

  transform:
    translate(-50%,-50%)
    scale(1);

  transform-origin:center;

  z-index:5;
}

.lines{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  overflow:visible;

  pointer-events:none;

  z-index:1;
}

.node{
  position:absolute;

  width:170px;
  min-height:72px;

  transform:
    translate(-50%,-50%);

  padding:12px 13px;

  border:1px solid rgba(255,255,255,.13);

  background:
    linear-gradient(
      145deg,
      rgba(20,20,20,.97),
      rgba(9,9,9,.97)
    );

  border-radius:12px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

  user-select:none;

  cursor:grab;

  transition:
    border-color .2s,
    box-shadow .2s,
    transform .2s;

  z-index:5;
}

.node:hover{
  border-color:#555;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

.node.dragging{
  cursor:grabbing;

  border-color:#888;

  box-shadow:
    0 30px 90px rgba(0,0,0,.8);
}

.node.highlight{
  border-color:#fff;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.2),
    0 0 40px rgba(255,255,255,.1);
}

.node-type{
  color:#555;

  font-size:8px;

  font-weight:900;

  letter-spacing:.15em;

  margin-bottom:6px;
}

.node-title{
  color:#eee;

  font-size:11px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.node-content{
  margin-top:5px;

  color:#777;

  font-size:9px;

  line-height:1.4;

  max-height:28px;

  overflow:hidden;

  word-break:break-word;
}

.node-delete{
  position:absolute;

  right:7px;
  top:6px;

  width:20px;
  height:20px;

  border:0;

  border-radius:5px;

  color:#555;

  background:transparent;

  font-size:12px;
}

.node-delete:hover{
  color:#fff;
  background:#222;
}

.node-dot{
  position:absolute;

  width:10px;
  height:10px;

  right:-5px;
  top:50%;

  transform:translateY(-50%);

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 14px rgba(255,255,255,.45);

  cursor:crosshair;
}


/* ==========================================================
   CONNECTIONS
========================================================== */

.graph-line{
  fill:none;

  stroke:
    rgba(255,255,255,.24);

  stroke-width:1.4;

  stroke-linecap:round;

  stroke-dasharray:
    5 8;

  filter:
    drop-shadow(
      0 0 3px rgba(255,255,255,.08)
    );

  animation:
    graphDash 4s linear infinite;
}

.graph-line-glow{
  fill:none;

  stroke:
    rgba(255,255,255,.045);

  stroke-width:5;

  stroke-linecap:round;

  pointer-events:none;
}

.connection-point{
  fill:#fff;

  opacity:.7;

  filter:
    drop-shadow(
      0 0 5px rgba(255,255,255,.5)
    );
}

@keyframes graphDash{

  to{
    stroke-dashoffset:-52;
  }

}


/* ==========================================================
   SATURN
========================================================== */

.saturn{
  position:absolute;

  left:50%;
  top:50%;

  width:470px;
  height:470px;

  transform:
    translate(-50%,-50%);

  opacity:.62;

  pointer-events:none;

  filter:
    drop-shadow(
      0 0 35px rgba(255,255,255,.08)
    );

  z-index:2;
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:360px;
  height:105px;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 0 20px rgba(255,255,255,.05);

  transform:
    translate(-50%,-50%)
    rotateX(67deg);

  transform-style:preserve-3d;

  opacity:.65;
}


/* ==========================================================
   PROFILE
========================================================== */

.profile{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;
}

.profile-card{
  width:min(600px,100%);

  border:1px solid var(--line);

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(20,20,20,.95),
      rgba(7,7,7,.96)
    );

  box-shadow:
    0 30px 100px rgba(0,0,0,.5);

  padding:28px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
}

.profile-avatar{
  width:84px;
  height:84px;

  border-radius:50%;

  object-fit:cover;

  background:#111;

  border:1px solid #333;
}

.profile-info h1{
  font-size:24px;
}

.profile-info p{
  color:#666;

  margin-top:5px;

  font-size:12px;
}

.profile-actions{
  display:flex;
  gap:8px;
  margin-top:25px;
  flex-wrap:wrap;
}

.profile-button{
  height:38px;

  padding:0 14px;

  border-radius:8px;

  border:1px solid #333;

  background:#111;

  color:#aaa;

  font-size:10px;
  font-weight:800;
}

.profile-button:hover{
  color:#fff;
  border-color:#666;
}

.profile-button.primary{
  color:#000;
  background:#fff;
  border-color:#fff;
}


/* ==========================================================
   MODALS
========================================================== */

.tool-modal,
#nodeModal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(12px);
}

.tool-modal.open,
#nodeModal.open{
  display:flex;
}

.modal-box,
.node-modal-box{
  width:min(520px,100%);

  max-height:
    calc(100vh - 40px);

  overflow:auto;

  border:
    1px solid rgba(255,255,255,.14);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #151515,
      #090909
    );

  box-shadow:
    0 40px 120px rgba(0,0,0,.75);

  padding:22px;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.modal-top h2{
  font-size:17px;
  letter-spacing:.04em;
}

.close{
  width:32px;
  height:32px;

  border:0;

  border-radius:8px;

  background:#111;

  color:#777;

  font-size:20px;
}

.close:hover{
  color:#fff;
}

.modal-description{
  color:#666;

  font-size:10px;

  line-height:1.5;

  margin-bottom:16px;
}

.modal-input{
  width:100%;
  height:45px;

  padding:0 13px;

  color:#fff;

  background:#080808;

  border:1px solid #2b2b2b;

  border-radius:9px;

  outline:none;
}

.modal-input:focus{
  border-color:#777;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;

  margin-top:12px;
}

.modal-actions button{
  height:36px;

  padding:0 14px;

  border-radius:8px;

  border:1px solid #333;

  color:#aaa;

  background:#111;

  font-size:9px;
  font-weight:900;
}

.modal-actions button:hover{
  color:#fff;
  border-color:#777;
}

.modal-actions button.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.results{
  display:flex;
  flex-direction:column;

  gap:7px;

  margin-top:18px;
}

.result{
  padding:11px 12px;

  border-radius:9px;

  border:1px solid #202020;

  background:#0c0c0c;
}

.result-head{
  display:flex;
  align-items:center;
  gap:7px;

  color:#777;

  font-size:8px;
  font-weight:900;

  letter-spacing:.12em;
}

.result-value{
  margin-top:5px;

  color:#ddd;

  font-size:11px;

  line-height:1.45;

  white-space:pre-wrap;

  word-break:break-word;
}

.result.good{
  border-color:
    rgba(170,255,170,.18);
}

.result.warn{
  border-color:
    rgba(255,220,100,.18);
}

.result.bad{
  border-color:
    rgba(255,100,100,.18);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;

  color:#555;

  font-size:8px;
  font-weight:900;

  letter-spacing:.13em;

  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;

  color:#fff;

  background:#080808;

  border:1px solid #292929;

  border-radius:8px;

  outline:none;

  padding:10px;

  font-size:11px;
}

.field input{
  height:40px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#666;
}


/* ==========================================================
   TOAST
========================================================== */

.toast{
  position:fixed;

  z-index:900;

  left:50%;
  bottom:22px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:10px 15px;

  border:1px solid #333;

  border-radius:9px;

  background:#111;

  color:#ddd;

  font-size:10px;

  transition:.25s ease;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:760px){

  .topbar{
    height:62px;
    padding:0 10px;
  }

  .brand{
    min-width:0;
  }

  .brand b{
    font-size:11px;
  }

  .brand small{
    display:none;
  }

  .top-tools{
    margin-left:auto;
  }

  .top-btn{
    width:35px;
    padding:0;
    overflow:hidden;
    font-size:0;
  }

  .top-btn:first-child::after{
    content:"☎";
    font-size:14px;
  }

  .top-btn:nth-child(2)::after{
    content:"✉";
    font-size:14px;
  }

  .sidebar{
    top:62px;
    width:54px;
  }

  .page{
    top:62px;
    left:54px;
  }

  .chain-toolbar{
    left:10px;
    right:10px;
  }

  .chain-search{
    width:100%;
  }

  .node{
    width:150px;
  }

  .saturn{
    width:330px;
    height:330px;
  }

  .saturn-ring{
    width:270px;
  }

}

</style>
</head>


<body>

<div class="app">

<header class="topbar">

  <div class="logo">
    N
  </div>

  <div class="brand">
    <b>NZX OSINT TOOL</b>
    <small>INTELLIGENCE WORKSPACE</small>
  </div>

  <div class="top-tools">

    <button
      class="top-btn"
      onclick="openTool('phone')"
    >
      CHECK NUMBER
    </button>

    <button
      class="top-btn"
      onclick="openTool('address')"
    >
      CHECK ADDRESS
    </button>

  </div>

  <button
    class="profile-mini"
    onclick="openProfile()"
  >
    <img id="miniAvatar" alt="">
  </button>

</header>


<aside class="sidebar">

  <button
    class="side-btn active"
    data-page="chain"
    onclick="showPage('chain')"
  >
    ⌘
  </button>

  <button
    class="side-btn"
    data-page="profile"
    onclick="openProfile()"
  >
    ◎
  </button>

</aside>


<section
  class="page active"
  id="page-chain"
>

  <div class="chain-page">

    <div class="chain-toolbar">

      <input
        class="chain-search"
        id="chainSearch"
        placeholder="Search chain or node..."
      >

      <button
        class="btn"
        onclick="openNodeModal()"
      >
        ＋ Node
      </button>

      <button
        class="btn"
        onclick="centerGraph()"
      >
        ⌂
      </button>

    </div>


    <div
      class="graph"
      id="graph"
    >

      <div class="saturn">

        <canvas
          id="saturn"
        ></canvas>

        <div
          class="saturn-ring"
          id="saturnRing"
        ></div>

      </div>


      <div
        class="world"
        id="world"
      >

        <svg
          class="lines"
          id="lines"
          viewBox="0 0 10000 10000"
          preserveAspectRatio="none"
        ></svg>

      </div>

    </div>

  </div>

</section>


<section
  class="page"
  id="page-profile"
>

  <div class="profile">

    <div class="profile-card">

      <div class="profile-head">

        <img
          class="profile-avatar"
          id="profileAvatar"
          alt=""
        >

        <div class="profile-info">

          <h1 id="profileName">
            NZX User
          </h1>

          <p id="profileUsername">
            @nzx_user
          </p>

        </div>

      </div>


      <div class="profile-actions">

        <button
          class="profile-button primary"
          onclick="chooseAvatar()"
        >
          Choose avatar
        </button>

        <button
          class="profile-button"
          onclick="editProfileName()"
        >
          Edit name
        </button>

        <button
          class="profile-button"
          onclick="showPage('chain')"
        >
          Back to Chain
        </button>

      </div>


      <input
        id="avatarFile"
        type="file"
        accept="image/*"
        style="display:none"
      >

    </div>

  </div>

</section>


<div
  class="tool-modal"
  id="toolModal"
  onclick="outsideToolModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-top">

      <h2 id="toolTitle">
        Check
      </h2>

      <button
        class="close"
        onclick="closeTool()"
      >
        ×
      </button>

    </div>


    <div
      class="modal-description"
      id="toolDescription"
    ></div>


    <input
      class="modal-input"
      id="toolInput"
      autocomplete="off"
    >


    <div class="modal-actions">

      <button onclick="closeTool()">
        CLOSE
      </button>

      <button
        class="primary"
        id="toolRun"
        onclick="runTool()"
      >
        CHECK
      </button>

    </div>


    <div
      class="results"
      id="toolResults"
    ></div>

  </div>

</div>


<div id="nodeModal">

  <div class="node-modal-box">

    <h2
      id="nodeModalTitle"
      style="margin:0 0 18px"
    >
      New Node
    </h2>


    <div class="field">

      <label>NAME</label>

      <input
        id="nodeTitle"
        placeholder="Username"
      >

    </div>


    <div class="field">

      <label>TYPE</label>

      <input
        id="nodeType"
        placeholder="PHONE / USERNAME / LOCATION"
      >

    </div>


    <div class="field">

      <label>CONTENT</label>

      <textarea
        id="nodeContent"
        placeholder="Information..."
      ></textarea>

    </div>


    <div
      style="
        display:flex;
        gap:8px;
        margin-top:17px;
      "
    >

      <button
        class="btn"
        style="margin-left:auto"
        onclick="closeNodeModal()"
      >
        Cancel
      </button>

      <button
        class="btn primary"
        onclick="saveNode()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>

</div>


<script>

/* ==========================================================
   STORAGE
========================================================== */

const STORAGE_KEY =
  "nzx-osint-real-v4";


let db = {

  nodes:{},

  links:[],

  profile:{

    name:"NZX User",

    username:"nzx_user",

    avatar:""
  },

  searches:0
};


try{

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(saved){

    const parsed =
      JSON.parse(saved);

    db = {

      ...db,

      ...parsed,

      nodes:
        parsed.nodes || {},

      links:
        Array.isArray(parsed.links)
          ? parsed.links
          : [],

      profile:{
        ...db.profile,
        ...(parsed.profile || {})
      }

    };
  }

}catch(error){

  console.warn(
    "Storage error",
    error
  );
}


/* ==========================================================
   HELPERS
========================================================== */

function saveDB(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.warn(
      "Could not save database",
      error
    );
  }
}


function $(id){

  return document.getElementById(id);
}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function objectToText(value){

  if(value === null ||
     value === undefined){

    return "UNKNOWN";
  }

  if(
    typeof value === "string" ||
    typeof value === "number" ||
    typeof value === "boolean"
  ){

    return String(value);
  }

  try{

    return JSON.stringify(
      value,
      null,
      2
    );

  }catch{

    return String(value);
  }
}


function uid(){

  return (
    "node_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}


function hasLink(a,b){

  return db.links.some(
    link =>
      (
        link.a === a &&
        link.b === b
      ) ||
      (
        link.a === b &&
        link.b === a
      )
  );
}


function addLink(a,b){

  if(!a || !b || a === b)
    return;

  if(hasLink(a,b))
    return;

  db.links.push({
    a,
    b
  });
}


function normalizePhone(value){

  return String(
    value || ""
  )
  .replace(
    /[^\d+]/g,
    ""
  );
}


let toastTimer=null;

function toast(message){

  const el =
    $("toast");

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      2200
    );
}

function openTool(type){

  const config =

  if(!config)
    return;

  currentTool =
    type;

  $("toolTitle").textContent =
    config.title;

  $("toolDescription").textContent =
    config.description;

  $("toolInput").placeholder =
    config.placeholder;

  $("toolInput").value =
    "";

function closeTool(){

  $("toolModal")
    .classList.remove(
      "open"
    );

  currentTool =
    null;
}


function outsideToolModal(event){

  if(
    event.target ===
    $("toolModal")
  ){

    closeTool();
  }
}


$("toolInput")
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      runTool();
    }
  }
);


async function runTool(){

  if(!currentTool)
    return;

  const value =
    $("toolInput")
      .value
      .trim();

  if(!value){

    toast(
      "Введите значение"
    );

    return;
  }

  $("toolRun").disabled =
    true;

  $("toolRun").textContent =
    "CHECKING...";

  $("toolResults")
    .innerHTML =
      "";

  try{

    if(
      currentTool === "phone"
    ){

      await checkPhoneReal(
        value
      );

    }else if(
      currentTool === "address"
    ){

      await checkAddressReal(
        value
      );
    }

  }finally{

    $("toolRun").disabled =
      false;

    $("toolRun").textContent =
      "CHECK";
  }
}

function addResult(
  title,
  value,
  status="INFO",
  icon="•"
){

  const box =
    document.createElement(
      "div"
    );

  let cls =
    "result";

  if(status === "OK")
    cls += " good";

  if(status === "WARNING")
    cls += " warn";

  if(status === "ERROR")
    cls += " bad";

  box.className =
    cls;

  box.innerHTML = `

    <div class="result-head">

      <span>
        ${escapeHTML(icon)}
      </span>

      <span>
        ${escapeHTML(title)}
      </span>

    </div>

    <div class="result-value">
      ${escapeHTML(
        objectToText(value)
      )}
    </div>

  `;

  $("toolResults")
    .appendChild(
      box
    );
}


/* ==========================================================
   PHONE
========================================================== */

async function checkPhoneReal(
  value
){

  addResult(
    "REQUEST",
    "Проверка номера...",
    "INFO",
    "•"
  );

  try{

    const form =
      new URLSearchParams();

    form.append(
      "phone",
      value
    );

    const response =
      await fetch(
        "/api/osint/phone",
        {
          method:"POST",

          headers:{
            "Accept":
              "application/json"
          },

          body:form
        }
      );

    let data=null;

    try{

      data =
        await response.json();

    }catch{

      data=null;
    }

    $("toolResults")
      .innerHTML =
      "";

    if(!response.ok){

      addResult(
        "BACKEND ERROR",
        data || (
          "HTTP " +
          response.status
        ),
        "ERROR",
        "!"
      );

      return;
    }

    if(!data){

      addResult(
        "RESPONSE",
        "Backend не вернул JSON.",
        "ERROR",
        "!"
      );

      return;
    }

    renderPhoneResult(
      data
    );

    createPhoneGraph(
      data
    );

    db.searches++;

    saveDB();

  }catch(error){

    $("toolResults")
      .innerHTML =
      "";

    addResult(
      "CONNECTION",
      error?.message ||
        "Не удалось связаться с backend.",
      "ERROR",
      "!"
    );
  }
}


function renderPhoneResult(
  data
){

  addResult(
    "PHONE",
    data.phone ||
      "UNKNOWN",
    "OK",
    "☎"
  );

  addResult(
    "VALID",
    data.valid === null ||
    data.valid === undefined
      ? "UNKNOWN"
      : data.valid
        ? "YES"
        : "NO",
    data.valid === true
      ? "OK"
      : data.valid === false
        ? "ERROR"
        : "WARNING",
    "✓"
  );

  addResult(
    "POSSIBLE",
    data.possible === null ||
    data.possible === undefined
      ? "UNKNOWN"
      : data.possible
        ? "YES"
        : "NO",
    data.possible === true
      ? "OK"
      : data.possible === false
        ? "WARNING"
        : "WARNING",
    "?"
  );

  addResult(
    "CONFIDENCE",
    data.confidence ||
      "UNKNOWN",
    data.confidence === "verified"
      ? "OK"
      : "WARNING",
    "◆"
  );

  if(
    data.score !== null &&
    data.score !== undefined
  ){

    addResult(
      "SCORE",
      data.score,
      "INFO",
      "◈"
    );
  }

  addResult(
    "COUNTRY",
    data.country ||
      "UNKNOWN",
    "INFO",
    "◎"
  );

  addResult(
    "COUNTRY CODE",
    data.country_code ||
      "UNKNOWN",
    "INFO",
    "+"
  );

  addResult(
    "REGION",
    data.region ||
      "UNKNOWN",
    "INFO",
    "⌖"
  );

  addResult(
    "CARRIER",
    data.carrier ||
      "UNKNOWN",
    "INFO",
    "◉"
  );

  addResult(
    "LINE TYPE",
    data.line_type ||
      "UNKNOWN",
    "INFO",
    "▣"
  );

  addResult(
    "DISPOSABLE / VOIP",
    data.disposable ||
      "UNKNOWN",
    data.disposable === "YES"
      ? "WARNING"
      : "INFO",
    "!"
  );

  addResult(
    "NATIONAL",
    data.national ||
      "UNKNOWN",
    "INFO",
    "N"
  );

  addResult(
    "INTERNATIONAL",
    data.international ||
      "UNKNOWN",
    "INFO",
    "I"
  );

  addResult(
    "E.164",
    data.e164 ||
      "UNKNOWN",
    "INFO",
    "E"
  );

  addResult(
    "PROVIDER",
    data.source ||
      "UNKNOWN",
    "INFO",
    "S"
  );

  const providerStatus =
    data.provider_status ||
    "UNKNOWN";

  const providerStatusType =
    providerStatus === "OK"
      ? "OK"
      : providerStatus === "API_KEY_REJECTED"
        ? "ERROR"
        : providerStatus === "QUOTA_EXCEEDED"
          ? "WARNING"
          : "INFO";

  addResult(
    "PROVIDER STATUS",
    providerStatus,
    providerStatusType,
    providerStatus === "OK"
      ? "✓"
      : "!"
  );

  if(
    data.credits_remaining !==
      null &&
    data.credits_remaining !==
      undefined
  ){

    addResult(
      "CREDITS REMAINING",
      data.credits_remaining,
      "INFO",
      "C"
    );
  }

  if(
    data.provider_error
  ){

    addResult(
      "PROVIDER RESPONSE",
      data.provider_error,
      "WARNING",
      "!"
    );
  }

  if(
    data.diagnostics &&
    Object.keys(
      data.diagnostics
    ).length
  ){

    addResult(
      "DIAGNOSTICS",
      data.diagnostics,
      "INFO",
      "D"
    );
  }

  if(
    data.city &&
    data.city !== "UNKNOWN"
  ){

    addResult(
      "CITY",
      data.city,
      "INFO",
      "⌂"
    );
  }
}


/* ==========================================================
   GRAPH NODE CREATION
========================================================== */

function createNode(
  title,
  type,
  content,
  x,
  y,
  extra={}
){

  const id =
    uid();

  db.nodes[id] = {

    id,

    title,

    type,

    content,

    x,

    y,

    ...extra
  };

  return id;
}


/* ==========================================================
   PHONE GRAPH LAYOUT
========================================================== */

/*
   Схема:

   PHONE
      │
      ├── COUNTRY
      ├── REGION
      ├── CARRIER
      ├── LINE TYPE
      ├── VALID
      │
      ├──────────────>
      │
      ├── CONFIDENCE
      ├── POSSIBLE
      ├── DISPOSABLE
      ├── COUNTRY CODE
      ├── SCORE
      │
      └──────────────>

   То есть граф идет слева направо,
   а внутри каждой колонки ноды стоят
   сверху / по центру / снизу.
*/


const PHONE_COLUMN_GAP =
  430;

const PHONE_ROW_GAP =
  125;

const PHONE_MAX_ROWS =
  5;


function arrangeColumn(
  nodes,
  x,
  centerY
){

  if(!nodes.length)
    return;

  const totalHeight =
    (
      nodes.length - 1
    ) *
    PHONE_ROW_GAP;

  const startY =
    centerY -
    totalHeight / 2;

  nodes.forEach(
    (node,index)=>{

      node.x =
        x;

      node.y =
        startY +
        index *
        PHONE_ROW_GAP;
    }
  );
}


function nearestNode(
  source,
  nodes
){

  if(!nodes.length)
    return null;

  let best =
    null;

  let bestDistance =
    Infinity;

  nodes.forEach(
    node=>{

      const dx =
        node.x -
        source.x;

      const dy =
        node.y -
        source.y;

      const distance =
        dx*dx +
        dy*dy;

      if(
        distance <
        bestDistance
      ){

        bestDistance =
          distance;

        best =
          node;
      }
    }
  );

  return best;
}


function createPhoneGraph(
  data
){

  const phone =
    data.e164 ||
    data.phone;

  if(!phone)
    return;

  const normalized =
    normalizePhone(phone);

  let phoneNode =
    Object.values(
      db.nodes
    ).find(
      n =>
        n.type === "PHONE" &&
        (
          normalizePhone(
            n.content
          ) === normalized
        )
    );

  if(!phoneNode){

    const center =
      getGraphCenter();

    const id =
      createNode(
        "Phone Number",
        "PHONE",
        phone,
        center.x,
        center.y,
        {
          group:
            "phone:" +
            normalized
        }
      );

    phoneNode =
      db.nodes[id];

  }else{

    phoneNode.group =
      "phone:" +
      normalized;
  }


  /*
    Все реальные поля, которые может вернуть backend.
  */

  const rawValues = [

    [
      "Country",
      "COUNTRY",
      data.country
    ],

    [
      "Country Code",
      "COUNTRY CODE",
      data.country_code
    ],

    [
      "Region",
      "REGION",
      data.region
    ],

    [
      "Carrier",
      "CARRIER",
      data.carrier
    ],

    [
      "Line Type",
      "LINE TYPE",
      data.line_type
    ],

    [
      "Confidence",
      "CONFIDENCE",
      data.confidence
    ],

    [
      "Valid",
      "VALID",
      data.valid
    ],

    [
      "Possible",
      "POSSIBLE",
      data.possible
    ],

    [
      "Disposable",
      "DISPOSABLE",
      data.disposable
    ],

    [
      "Score",
      "SCORE",
      data.score
    ],

    [
      "National",
      "NATIONAL",
      data.national
    ],

    [
      "International",
      "INTERNATIONAL",
      data.international
    ],

    [
      "E.164",
      "E164",
      data.e164
    ],

    [
      "Provider",
      "PROVIDER",
      data.source
    ],

    [
      "Provider Status",
      "PROVIDER STATUS",
      data.provider_status
    ]

  ];


  /*
    Оставляем только реальные значения.
  */

  const values =
    rawValues.filter(
      item=>{

        const value =
          item[2];

        return !(
          value === null ||
          value === undefined ||
          value === "" ||
          value === "UNKNOWN"
        );

      }
    );


  /*
    Разбиваем на колонки.
  */

  const columns=[];

  for(
    let i=0;
    i<values.length;
    i+=PHONE_MAX_ROWS
  ){

    columns.push(
      values.slice(
        i,
        i + PHONE_MAX_ROWS
      )
    );
  }


  const group =
    "phone:" +
    normalized;


  /*
    Собираем старые ноды этой телефонной цепочки.
  */

  const existingGroupNodes =
    Object.values(
      db.nodes
    ).filter(
      n =>
        n.group === group
    );


  const columnNodes=[];


  /*
    PHONE — первая колонка.
  */

  phoneNode.x =
    phoneNode.x;

  phoneNode.y =
    phoneNode.y;

  columnNodes.push([
    phoneNode
  ]);


  /*
    Создаем / переиспользуем
    остальные ноды.
  */

  columns.forEach(
    (column,index)=>{

      const nodes=[];

      column.forEach(
        item=>{

          const title =
            item[0];

          const type =
            item[1];

          const raw =
            item[2];

          const content =
            typeof raw === "boolean"
              ? (
                  raw
                    ? "YES"
                    : "NO"
                )
              : String(raw);


          let target =
            existingGroupNodes.find(
              n =>
                n.id !== phoneNode.id &&
                n.type === type &&
                String(
                  n.content
                ) === content
            );


          if(!target){

            const id =
              createNode(
                title,
                type,
                content,
                0,
                0,
                {
                  group
                }
              );

            target =
              db.nodes[id];

          }


          target.group =
            group;

          target.title =
            title;

          target.type =
            type;

          target.content =
            content;

          nodes.push(
            target
          );
        }
      );

      columnNodes.push(
        nodes
      );
    }
  );


  /*
    Расставляем PHONE.
  */

  const rootX =
    phoneNode.x;

  const rootY =
    phoneNode.y;


  /*
    Каждая следующая колонка
    находится справа.
  */

  columnNodes
    .slice(1)
    .forEach(
      (nodes,index)=>{

        arrangeColumn(
          nodes,
          rootX +
            PHONE_COLUMN_GAP *
            (index + 1),
          rootY
        );
      }
    );


  /*
    Старые связи этой телефонной цепочки
    удаляем, чтобы при повторной проверке
    не появлялись кривые старые соединения.
  */

  const groupIds =
    new Set(
      Object.values(
        db.nodes
      )
      .filter(
        n =>
          n.group === group
      )
      .map(
        n =>
          n.id
      )
    );


  db.links =
    db.links.filter(
      link =>
        !(
          groupIds.has(link.a) &&
          groupIds.has(link.b)
        )
    );


  /*
    ROOT -> первая колонка.
  */

  const firstColumn =
    columnNodes[1] ||
    [];

  firstColumn.forEach(
    node=>{

      addLink(
        phoneNode.id,
        node.id
      );
    }
  );


  /*
    Каждая следующая колонка
    соединяется с ближайшей
    нодой предыдущей колонки.
  */

  for(
    let columnIndex=2;
    columnIndex<
      columnNodes.length;
    columnIndex++
  ){

    const previous =
      columnNodes[
        columnIndex - 1
      ] || [];

    const current =
      columnNodes[
        columnIndex
      ] || [];

    current.forEach(
      node=>{

        const parent =
          nearestNode(
            node,
            previous
          );

        if(parent){

          addLink(
            parent.id,
            node.id
          );
        }

      }
    );
  }


  saveDB();

  renderNodes();

  renderLines();

  /*
    Плавно показываем созданную
    телефонную цепочку.
  */

  focusGraphNode(
    phoneNode,
    1
  );
}


/* ==========================================================
   ADDRESS
========================================================== */

async function checkAddressReal(
  value
){

  addResult(
    "SEARCH",
    "Ищем адрес...",
    "INFO",
    "•"
  );

  try{

    const url =
      "/api/map/search?q=" +
      encodeURIComponent(
        value
      );

    const response =
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );

    const data =
      await response.json();

    $("toolResults")
      .innerHTML =
      "";

    if(
      !response.ok ||
      !data.success
    ){

      addResult(
        "ADDRESS ERROR",
        data.error ||
          "Адрес не найден.",
        "ERROR",
        "!"
      );

      return;
    }

    const results =
      data.results || [];

    if(!results.length){

      addResult(
        "RESULT",
        "Ничего не найдено.",
        "WARNING",
        "?"
      );

      return;
    }

    results
      .slice(0,10)
      .forEach(
        (item,index)=>{

          addResult(
            "RESULT " +
              (index+1),
            item.display_name,
            "OK",
            "⌖"
          );

          addResult(
            "COORDINATES",
            `${item.lat}, ${item.lon}`,
            "INFO",
            "◉"
          );

          addResult(
            "CITY",
            item.city ||
              "UNKNOWN",
            "INFO",
            "⌂"
          );

          addResult(
            "COUNTRY",
            item.country ||
              "UNKNOWN",
            "INFO",
            "◎"
          );

          addResult(
            "ROAD",
            item.road ||
              "UNKNOWN",
            "INFO",
            "R"
          );

          addResult(
            "HOUSE",
            item.house_number ||
              "UNKNOWN",
            "INFO",
            "#"
          );
        }
      );

    createAddressGraph(
      results[0]
    );

  }catch(error){

    $("toolResults")
      .innerHTML =
      "";

    addResult(
      "CONNECTION",
      error?.message ||
        "Ошибка соединения.",
      "ERROR",
      "!"
    );
  }
}


function createAddressGraph(
  data
){

  if(!data)
    return;

  const center =
    getGraphCenter();

  let addressNode =
    Object.values(
      db.nodes
    ).find(
      n =>
        n.type === "ADDRESS" &&
        n.content ===
          data.display_name
    );

  if(!addressNode){

    const id =
      createNode(
        "Address",
        "ADDRESS",
        data.display_name,
        center.x,
        center.y,
        {
          group:
            "address:" +
            data.display_name
        }
      );

    addressNode =
      db.nodes[id];

  }else{

    addressNode.group =
      "address:" +
      data.display_name;
  }


  const values = [

    [
      "City",
      "CITY",
      data.city
    ],

    [
      "Country",
      "COUNTRY",
      data.country
    ],

    [
      "Coordinates",
      "COORDINATES",
      `${data.lat}, ${data.lon}`
    ],

    [
      "Postcode",
      "POSTCODE",
      data.postcode
    ],

    [
      "State",
      "STATE",
      data.state
    ],

    [
      "Road",
      "ROAD",
      data.road
    ],

    [
      "House",
      "HOUSE",
      data.house_number
    ]

  ];


  const valid =
    values.filter(
      item =>
        item[2] &&
        item[2] !==
          "UNKNOWN"
    );


  const columns=[];

  for(
    let i=0;
    i<valid.length;
    i+=4
  ){

    columns.push(
      valid.slice(
        i,
        i+4
      )
    );
  }


  const group =
    "address:" +
    data.display_name;


  const groupNodes =
    Object.values(
      db.nodes
    ).filter(
      n =>
        n.group === group
    );


  const allColumns=[
    [addressNode]
  ];


  columns.forEach(
    (column,columnIndex)=>{

      const nodes=[];

      column.forEach(
        item=>{

          const title =
            item[0];

          const type =
            item[1];

          const content =
            String(item[2]);


          let target =
            groupNodes.find(
              n =>
                n.type === type &&
                String(
                  n.content
                ) === content
            );


          if(!target){

            const id =
              createNode(
                title,
                type,
                content,
                0,
                0,
                {
                  group
                }
              );

            target =
              db.nodes[id];
          }


          target.group =
            group;

          target.title =
            title;

          target.type =
            type;

          target.content =
            content;

          nodes.push(
            target
          );
        }
      );

      allColumns.push(
        nodes
      );
    }
  );


  allColumns
    .slice(1)
    .forEach(
      (nodes,index)=>{

        arrangeColumn(
          nodes,
          addressNode.x +
            PHONE_COLUMN_GAP *
            (index+1),
          addressNode.y
        );
      }
    );


  const groupIds =
    new Set(
      Object.values(
        db.nodes
      )
      .filter(
        n =>
          n.group === group
      )
      .map(
        n =>
          n.id
      )
    );


  db.links =
    db.links.filter(
      link =>
        !(
          groupIds.has(link.a) &&
          groupIds.has(link.b)
        )
    );


  const first =
    allColumns[1] || [];

  first.forEach(
    node=>{
      addLink(
        addressNode.id,
        node.id
      );
    }
  );


  for(
    let i=2;
    i<allColumns.length;
    i++
  ){

    const previous =
      allColumns[i-1] || [];

    const current =
      allColumns[i] || [];

    current.forEach(
      node=>{

        const parent =
          nearestNode(
            node,
            previous
          );

        if(parent){

          addLink(
            parent.id,
            node.id
          );
        }
      }
    );
  }


  saveDB();

  renderNodes();

  renderLines();

  focusGraphNode(
    addressNode,
    1
  );
}

   NODE MODAL
========================================================== */

let editingNode =
  null;


function openNodeModal(
  nodeId=null
){

  editingNode =
    nodeId;

  $("nodeModalTitle")
    .textContent =
      nodeId
        ? "Edit Node"
        : "New Node";

  if(nodeId){

    const node =
      db.nodes[nodeId];

    if(!node)
      return;

    $("nodeTitle").value =
      node.title || "";

    $("nodeType").value =
      node.type || "";

    $("nodeContent").value =
      node.content || "";

  }else{

    $("nodeTitle").value =
      "";

    $("nodeType").value =
      "";

    $("nodeContent").value =
      "";
  }

  $("nodeModal")
    .classList.add(
      "open"
    );
}


function closeNodeModal(){

  $("nodeModal")
    .classList.remove(
      "open"
    );

  editingNode =
    null;
}


function saveNode(){

  const title =
    $("nodeTitle")
      .value
      .trim();

  const type =
    $("nodeType")
      .value
      .trim()
      .toUpperCase();

  const content =
    $("nodeContent")
      .value
      .trim();

  if(!title){

    toast(
      "Введите название"
    );

    return;
  }


  if(editingNode){

    const node =
      db.nodes[
        editingNode
      ];

    if(node){

      node.title =
        title;

      node.type =
        type ||
        "UNKNOWN";

      node.content =
        content;
    }

  }else{

    const center =
      getGraphCenter();

    const id =
      createNode(

        title,

        type ||
          "UNKNOWN",

        content,

        center.x +
          (
            Math.random() -
            .5
          ) * 260,

        center.y +
          (
            Math.random() -
            .5
          ) * 180
    );


    /*
      Если это вторая нода,
      автоматически соединяем
      её с ближайшей существующей.
    */

    const newNode =
      db.nodes[id];

    const others =
      Object.values(
        db.nodes
      ).filter(
        n =>
          n.id !== id
      );

    if(others.length === 1){

      addLink(
        others[0].id,
        newNode.id
      );

    }else if(others.length > 1){

      const nearest =
        nearestNode(
          newNode,
          others
        );

      if(nearest){

        const distance =
          Math.hypot(
            nearest.x -
              newNode.x,
            nearest.y -
              newNode.y
          );

        if(
          distance <
          700
        ){

          addLink(
            nearest.id,
            newNode.id
          );
        }
      }
    }
  }


  saveDB();

  renderNodes();

  renderLines();

  closeNodeModal();

  toast(
    "Node saved"
  );
}


/* ==========================================================
   GRAPH STATE
========================================================== */

const graph =
  $("graph");

const world =
  $("world");

let zoom =
  1;

let panX =
  0;

let panY =
  0;

let draggingNode =
  null;

let dragOffsetX =
  0;

let dragOffsetY =
  0;

let panning =
  false;

let panStartX =
  0;

let panStartY =
  0;

let linkSource =
  null;


/* ==========================================================
   WORLD
========================================================== */

function applyWorld(){

  world.style.transform =
    `
      translate(
        calc(-50% + ${panX}px),
        calc(-50% + ${panY}px)
      )
      scale(${zoom})
    `;

  renderLines();
}


function getGraphCenter(){

  return {

    x:
      -panX / zoom,

    y:
      -panY / zoom
  };
}


/*
  Перевод из нашей системы:
  
  0,0 = центр world
  
  в SVG:
  
  5000,5000 = центр SVG
*/

function worldToSVG(
  x,
  y
){

  return {

    x:
      5000 + x,

    y:
      5000 + y
  };
}


/* ==========================================================
   RENDER NODES
========================================================== */

function renderNodes(){

  world
    .querySelectorAll(
      ".node"
    )
    .forEach(
      el =>
        el.remove()
    );


  Object.values(
    db.nodes
  ).forEach(
    node=>{

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "node";

      el.dataset.id =
        node.id;

      /*
        Node coordinates остаются
        относительно центра world.
      */

      el.style.left =
        (
          5000 +
          Number(node.x || 0)
        ) +
        "px";

      el.style.top =
        (
          5000 +
          Number(node.y || 0)
        ) +
        "px";


      el.innerHTML = `

        <button
          class="node-delete"
          title="Delete"
        >
          ×
        </button>

        <div class="node-type">
          ${escapeHTML(
            node.type ||
            "UNKNOWN"
          )}
        </div>

        <div class="node-title">
          ${escapeHTML(
            node.title
          )}
        </div>

        <div class="node-content">
          ${escapeHTML(
            node.content
          )}
        </div>

        <div
          class="node-dot"
          title="Link"
        ></div>

      `;


      world.appendChild(
        el
      );


      const deleteBtn =
        el.querySelector(
          ".node-delete"
        );


      deleteBtn.onclick =
        event=>{

          event.stopPropagation();

          deleteNode(
            node.id
          );
        };


      const dot =
        el.querySelector(
          ".node-dot"
        );


      dot.onclick =
        event=>{

          event.stopPropagation();

          handleLinkDot(
            node.id
          );
        };


      el.addEventListener(
        "dblclick",
        event=>{

          if(
            event.target.closest(
              ".node-delete"
            ) ||
            event.target.closest(
              ".node-dot"
            )
          )
            return;

          openNodeModal(
            node.id
          );
        }
      );


      el.addEventListener(
        "pointerdown",
        event=>{

          if(
            event.target.closest(
              ".node-delete"
            ) ||
            event.target.closest(
              ".node-dot"
            )
          )
            return;

          startNodeDrag(
            event,
            node
          );
        }
      );

    }
  );


  renderLines();
}


/* ==========================================================
   NODE DRAG
========================================================== */

function startNodeDrag(
  event,
  node
){

  event.preventDefault();

  draggingNode =
    node;

  node._dragging =
    true;


  const rect =
    graph.getBoundingClientRect();


  const graphX =
    (
      event.clientX -
      rect.left -
      rect.width / 2 -
      panX
    ) / zoom;


  const graphY =
    (
      event.clientY -
      rect.top -
      rect.height / 2 -
      panY
    ) / zoom;


  dragOffsetX =
    node.x -
    graphX;

  dragOffsetY =
    node.y -
    graphY;


  const el =
    world.querySelector(
      `[data-id="${node.id}"]`
    );


  if(el)
    el.classList.add(
      "dragging"
    );


  window.addEventListener(
    "pointermove",
    moveNode
  );


  window.addEventListener(
    "pointerup",
    stopNodeDrag,
    {
      once:true
    }
  );
}


function moveNode(
  event
){

  if(!draggingNode)
    return;


  const rect =
    graph.getBoundingClientRect();


  const graphX =
    (
      event.clientX -
      rect.left -
      rect.width / 2 -
      panX
    ) / zoom;


  const graphY =
    (
      event.clientY -
      rect.top -
      rect.height / 2 -
      panY
    ) / zoom;


  draggingNode.x =
    graphX +
    dragOffsetX;

  draggingNode.y =
    graphY +
    dragOffsetY;


  const el =
    world.querySelector(
      `[data-id="${draggingNode.id}"]`
    );


  if(el){

    el.style.left =
      (
        5000 +
        draggingNode.x
      ) +
      "px";

    el.style.top =
      (
        5000 +
        draggingNode.y
      ) +
      "px";
  }


  /*
    Самое главное:
    линии обновляются непосредственно
    во время движения.
  */

  renderLines();
}


function stopNodeDrag(){

  if(!draggingNode)
    return;


  const el =
    world.querySelector(
      `[data-id="${draggingNode.id}"]`
    );


  if(el)
    el.classList.remove(
      "dragging"
    );


  draggingNode._dragging =
    false;

  draggingNode =
    null;


  window.removeEventListener(
    "pointermove",
    moveNode
  );


  saveDB();

  renderLines();
}


/* ==========================================================
   DELETE
========================================================== */

function deleteNode(
  id
){

  const node =
    db.nodes[id];

  if(!node)
    return;


  if(
    !confirm(
      `Delete node "${node.title}"?`
    )
  )
    return;


  delete db.nodes[id];


  db.links =
    db.links.filter(
      link =>
        link.a !== id &&
        link.b !== id
    );


  saveDB();

  renderNodes();

  renderLines();

  toast(
    "Node deleted"
  );
}


/* ==========================================================
   LINKING
========================================================== */

function handleLinkDot(
  id
){

  if(!linkSource){

    linkSource =
      id;

    highlightNode(
      id
    );

    toast(
      "Select another node"
    );

    return;
  }


  if(
    linkSource === id
  ){

    linkSource =
      null;

    clearHighlights();

    return;
  }


  const exists =
    hasLink(
      linkSource,
      id
    );


  if(!exists){

    addLink(
      linkSource,
      id
    );

    saveDB();

    renderLines();

    toast(
      "Nodes linked"
    );
  }


  linkSource =
    null;

  clearHighlights();
}


function highlightNode(
  id
){

  clearHighlights();


  const el =
    world.querySelector(
      `[data-id="${id}"]`
    );


  if(el)
    el.classList.add(
      "highlight"
    );
}


function clearHighlights(){

  world
    .querySelectorAll(
      ".node.highlight"
    )
    .forEach(
      el =>
        el.classList.remove(
          "highlight"
        )
    );
}


/* ==========================================================
   GRAPH LINES — FIXED
========================================================== */

function renderLines(){

  const svg =
    $("lines");

  if(!svg)
    return;


  /*
    Полностью очищаем старые линии.
  */

  svg.innerHTML =
    "";


  db.links.forEach(
    link=>{

      const a =
        db.nodes[
          link.a
        ];

      const b =
        db.nodes[
          link.b
        ];


      if(!a || !b)
        return;


      /*
        Координаты SVG.
      */

      const A =
        worldToSVG(
          Number(a.x || 0),
          Number(a.y || 0)
        );


      const B =
        worldToSVG(
          Number(b.x || 0),
          Number(b.y || 0)
        );


      const dx =
        B.x - A.x;

      const dy =
        B.y - A.y;


      const length =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      if(!length)
        return;


      /*
        Красивый изгиб линии.
      */

      const nx =
        -dy / length;

      const ny =
        dx / length;


      const bend =
        Math.min(
          70,
          Math.max(
            30,
            length * .10
          )
        );


      const mx =
        (
          A.x +
          B.x
        ) / 2;


      const my =
        (
          A.y +
          B.y
        ) / 2;


      const cx =
        mx +
        nx *
        bend;


      const cy =
        my +
        ny *
        bend;


      const ns =
        "http://www.w3.org/2000/svg";


      /*
        Glow.
      */

      const glow =
        document.createElementNS(
          ns,
          "path"
        );


      glow.setAttribute(
        "d",
        `
          M ${A.x} ${A.y}
          Q ${cx} ${cy}
            ${B.x} ${B.y}
        `
      );


      glow.setAttribute(
        "class",
        "graph-line-glow"
      );


      svg.appendChild(
        glow
      );


      /*
        Основная линия.
      */

      const path =
        document.createElementNS(
          ns,
          "path"
        );


      path.setAttribute(
        "d",
        `
          M ${A.x} ${A.y}
          Q ${cx} ${cy}
            ${B.x} ${B.y}
        `
      );


      path.setAttribute(
        "class",
        "graph-line"
      );


      svg.appendChild(
        path
      );


      /*
        Маленькие точки на концах.
      */

      const pointA =
        document.createElementNS(
          ns,
          "circle"
        );

      pointA.setAttribute(
        "cx",
        A.x
      );

      pointA.setAttribute(
        "cy",
        A.y
      );

      pointA.setAttribute(
        "r",
        "2"
      );

      pointA.setAttribute(
        "class",
        "connection-point"
      );


      const pointB =
        document.createElementNS(
          ns,
          "circle"
        );

      pointB.setAttribute(
        "cx",
        B.x
      );

      pointB.setAttribute(
        "cy",
        B.y
      );

      pointB.setAttribute(
        "r",
        "2"
      );

      pointB.setAttribute(
        "class",
        "connection-point"
      );


      svg.appendChild(
        pointA
      );

      svg.appendChild(
        pointB
      );

    }
  );
}


/* ==========================================================
   FOCUS NODE
========================================================== */

function focusGraphNode(
  node,
  targetZoom=1
){

  if(!node)
    return;


  /*
    Центрируем выбранный node
    в центре экрана.
  */

  zoom =
    targetZoom;


  panX =
    -node.x *
    zoom;

  panY =
    -node.y *
    zoom;


  applyWorld();
}


/* ==========================================================
   PAN
========================================================== */

graph.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest(
        ".node"
      )
    )
      return;


    panning =
      true;


    panStartX =
      event.clientX -
      panX;


    panStartY =
      event.clientY -
      panY;


    graph.setPointerCapture(
      event.pointerId
    );
  }
);


graph.addEventListener(
  "pointermove",
  event=>{

    if(!panning)
      return;


    panX =
      event.clientX -
      panStartX;


    panY =
      event.clientY -
      panStartY;


    applyWorld();
  }
);


graph.addEventListener(
  "pointerup",
  ()=>{
    panning =
      false;

    saveDB();
  }
);


graph.addEventListener(
  "pointercancel",
  ()=>{
    panning =
      false;
  }
);


/* ==========================================================
   ZOOM
========================================================== */

graph.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();


    const oldZoom =
      zoom;


    zoom +=
      event.deltaY < 0
        ? .08
        : -.08;


    zoom =
      Math.max(
        .35,
        Math.min(
          2.5,
          zoom
        )
      );


    if(
      oldZoom !== zoom
    ){

      applyWorld();
    }

  },
  {
    passive:false
  }
);


function centerGraph(){

  zoom =
    1;

  panX =
    0;

  panY =
    0;

  applyWorld();

  toast(
    "Graph centered"
  );
}

/* ==========================================================
   SATURN PARTICLES
========================================================== */

const canvas =
  $("saturn");

const ctx =
  canvas.getContext(
    "2d"
  );

let particles=[];

let rotation=0;


function resizeSaturn(){

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    rect.width*dpr;

  canvas.height =
    rect.height*dpr;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  createParticles(
    rect.width,
    rect.height
  );
}


function createParticles(
  width,
  height
){

  particles=[];


  const count =
    1100;


  const radius =
    Math.min(
      width,
      height
    )*.28;


  for(
    let i=0;
    i<count;
    i++
  ){

    const u =
      Math.random()*2-1;


    const angle =
      Math.random()*
      Math.PI*2;


    const r =
      Math.sqrt(
        1-u*u
      );


    const x =
      r*
      Math.cos(angle);


    const y =
      u;


    const z =
      r*
      Math.sin(angle);


    particles.push({

      x,
      y,
      z,

      size:
        .45 +
        Math.random()*1.15,

      alpha:
        .15 +
        Math.random()*.65
    });
  }
}


function drawSaturn(){

  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const cx =
    width/2;

  const cy =
    height/2;


  const radius =
    Math.min(
      width,
      height
    )*.28;


  rotation +=
    .00065;


  for(
    const p of particles
  ){

    const c =
      Math.cos(
        rotation
      );


    const s =
      Math.sin(
        rotation
      );


    const x =
      p.x*c -
      p.z*s;


    const z =
      p.x*s +
      p.z*c;


    const scale =
      .55 +
      (
        z+1
      )*.23;


    const px =
      cx +
      x*
      radius*
      scale;


    const py =
      cy +
      p.y*
      radius*
      scale;


    const alpha =
      Math.max(
        .04,
        p.alpha*
        (
          .45 +
          (z+1)*.28
        )
      );


    ctx.beginPath();


    ctx.arc(
      px,
      py,
      p.size*
      scale,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      `rgba(255,255,255,${alpha})`;


    ctx.fill();

  }


  requestAnimationFrame(
    drawSaturn
  );
}


window.addEventListener(
  "resize",
  resizeSaturn
);


/* ==========================================================
   RING
========================================================== */

let ringTime=0;


function animateRing(){

  ringTime +=
    .016;


  const degrees =
    (
      ringTime*
      .75
    ) %
    360;


  $("saturnRing")
    .style.transform =
      `
        translate(-50%,-50%)
        rotateX(67deg)
        rotateZ(
          ${-15+degrees}deg
        )
      `;


  requestAnimationFrame(
    animateRing
  );
}


/* ==========================================================
   INIT
========================================================== */

function init(){

  updateProfileUI();

  applyWorld();

  renderNodes();

  renderLines();

  resizeSaturn();

  drawSaturn();

  animateRing();
}


init();

</script>
