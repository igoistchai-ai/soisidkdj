<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NZX OSINT TOOL</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#f4f4f4;
    font-family:Inter,Arial,Helvetica,sans-serif;
}

button,input,textarea{
    font:inherit;
}

button{
    color:inherit;
}

#bootScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.boot-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.14;
    filter:grayscale(1) contrast(1.25);
}

.boot-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.boot-title{
    font-size:clamp(35px,7vw,85px);
    font-weight:900;
    letter-spacing:-4px;
    text-transform:uppercase;
    animation:bootTitle 1.2s ease forwards;
}

.boot-sub{
    margin-top:14px;
    font-size:12px;
    letter-spacing:5px;
    color:#888;
    opacity:0;
    animation:fadeUp .8s 1s forwards;
}

.boot-line{
    width:0;
    height:1px;
    background:#fff;
    margin:25px auto 0;
    animation:bootLine 1.3s 1.2s forwards;
}

@keyframes bootTitle{
    0%{opacity:0;transform:translateY(35px);filter:blur(12px)}
    100%{opacity:1;transform:none;filter:none}
}

@keyframes bootLine{
    to{width:min(420px,70vw)}
}

@keyframes fadeUp{
    to{opacity:1;transform:none}
}

#app{
    width:100%;
    height:100%;
    opacity:0;
    visibility:hidden;
}

#app.app-ready{
    visibility:visible;
    animation:appAppear .8s ease-out forwards;
}

@keyframes appAppear{
    from{
        opacity:0;
        transform:scale(.985);
        filter:blur(8px);
    }
    to{
        opacity:1;
        transform:none;
        filter:none;
    }
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:500;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid #1d1d1d;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
}

.logo{
    min-width:180px;
    height:38px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border:1px solid #282828;
    border-radius:10px;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    background:#0a0a0a;
}

.top-spacer{
    flex:1;
}

.top-btn,
.btn{
    min-height:36px;
    padding:0 13px;
    border:1px solid #292929;
    background:#0c0c0c;
    border-radius:10px;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    letter-spacing:.8px;
    transition:.18s;
}

.top-btn:hover,
.btn:hover{
    background:#171717;
    border-color:#555;
    transform:translateY(-1px);
}

.top-btn:active,
.btn:active{
    transform:scale(.97);
}

.btn.danger{
    border-color:#572323;
    color:#ff8585;
}

.btn.danger:hover{
    background:#1d0b0b;
    border-color:#9d3838;
}

.btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    transform:none;
}

.profile-mini{
    height:38px;
    padding:0 12px;
    border:1px solid #292929;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#0a0a0a;
    cursor:pointer;
}

.profile-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
}

.layout{
    position:absolute;
    inset:62px 0 0;
    display:flex;
}

.sidebar{
    width:220px;
    flex-shrink:0;
    border-right:1px solid #1d1d1d;
    background:#070707;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:7px;
    z-index:300;
}

.side-title{
    color:#555;
    font-size:9px;
    letter-spacing:2px;
    margin:6px 5px 8px;
}

.side-btn{
    height:42px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    text-align:left;
    padding:0 12px;
    color:#888;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
    transition:.18s;
}

.side-btn:hover{
    color:#fff;
    background:#101010;
}

.side-btn.active{
    color:#fff;
    border-color:#292929;
    background:#111;
}

.main{
    position:relative;
    flex:1;
    min-width:0;
    overflow:hidden;
    background:#050505;
}

.page{
    position:absolute;
    inset:0;
    display:none;
}

.page.active{
    display:block;
}

#graphPage{
    overflow:hidden;
}

.graph-toolbar{
    position:absolute;
    left:16px;
    right:16px;
    top:16px;
    height:48px;
    z-index:200;
    display:flex;
    align-items:center;
    gap:8px;
    pointer-events:none;
}

.graph-toolbar>*{
    pointer-events:auto;
}

.chain-search{
    width:220px;
    height:38px;
    border:1px solid #292929;
    background:#0b0b0b;
    border-radius:10px;
    color:#fff;
    padding:0 12px;
    outline:none;
}

.chain-search:focus{
    border-color:#666;
}

.toolbar-space{
    flex:1;
}

#graph{
    position:absolute;
    inset:0;
    overflow:hidden;
    cursor:grab;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 38%),
        #050505;
    touch-action:none;
}

#graph.dragging{
    cursor:grabbing;
}

#graphGrid{
    position:absolute;
    width:100%;
    height:100%;
    opacity:.32;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

#edges{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
}

.edge{
    stroke:#777;
    stroke-width:1.2;
    opacity:.7;
    fill:none;
    stroke-dasharray:7 7;
    animation:edgeMove 1.8s linear infinite;
}

@keyframes edgeMove{
    to{stroke-dashoffset:-28}
}

.node{
    position:absolute;
    min-width:155px;
    max-width:240px;
    min-height:68px;
    padding:11px 34px 11px 12px;
    border:1px solid #333;
    border-radius:12px;
    background:rgba(12,12,12,.96);
    box-shadow:0 12px 40px rgba(0,0,0,.45);
    cursor:grab;
    user-select:none;
    touch-action:none;
    transition:border-color .15s,box-shadow .15s;
    z-index:20;
}

.node:hover{
    border-color:#666;
}

.node.dragging{
    cursor:grabbing;
    border-color:#fff;
    box-shadow:0 18px 55px rgba(0,0,0,.7);
    z-index:1000;
}

.node.selected{
    border-color:#fff;
    box-shadow:0 0 0 1px #fff,0 15px 55px rgba(0,0,0,.65);
}

.node-type{
    font-size:8px;
    color:#666;
    letter-spacing:1.5px;
    font-weight:900;
    margin-bottom:7px;
}

.node-value{
    font-size:12px;
    font-weight:800;
    line-height:1.35;
    word-break:break-word;
}

.node-remove{
    position:absolute;
    top:6px;
    right:6px;
    width:22px;
    height:22px;
    border:1px solid #333;
    border-radius:7px;
    background:#111;
    color:#777;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:15px;
    line-height:1;
    z-index:5;
    transition:.15s;
}

.node-remove:hover{
    background:#260c0c;
    color:#ff8b8b;
    border-color:#7d3535;
}

.node-meta{
    margin-top:7px;
    font-size:9px;
    color:#777;
    line-height:1.4;
}

.saturn-wrap{
    position:absolute;
    left:50%;
    top:50%;
    width:470px;
    height:470px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:.4;
}

.saturn{
    position:absolute;
    left:50%;
    top:50%;
    width:125px;
    height:125px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 30%,#777,#333 40%,#090909 78%);
    box-shadow:
        0 0 50px rgba(255,255,255,.06),
        inset -20px -15px 30px #000;
}

.saturn-ring{
    position:absolute;
    left:50%;
    top:50%;
    width:390px;
    height:110px;
    border:1px dotted rgba(255,255,255,.5);
    border-radius:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    animation:ringRotate 16s linear infinite;
}

.saturn-ring:before,
.saturn-ring:after{
    content:"";
    position:absolute;
    inset:14px 35px;
    border:1px dotted rgba(255,255,255,.25);
    border-radius:50%;
}

.saturn-points{
    position:absolute;
    inset:0;
    border-radius:50%;
    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px);
    background-size:27px 27px;
    opacity:.15;
    animation:starsMove 30s linear infinite;
}

@keyframes ringRotate{
    from{transform:translate(-50%,-50%) rotate(-18deg)}
    to{transform:translate(-50%,-50%) rotate(342deg)}
}

@keyframes starsMove{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
}

.empty-state{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    color:#444;
    z-index:10;
}

.empty-state b{
    display:block;
    color:#777;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.empty-state span{
    font-size:10px;
}

.profile-page{
    overflow:auto;
    padding:35px;
}

.profile-card{
    max-width:700px;
    border:1px solid #252525;
    border-radius:14px;
    background:#090909;
    padding:25px;
}

.profile-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:8px;
}

.profile-sub{
    color:#666;
    font-size:11px;
    margin-bottom:25px;
}

.info-box{
    border:1px solid #222;
    border-radius:10px;
    padding:15px;
    background:#070707;
    margin-top:10px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:9px 0;
    border-bottom:1px solid #181818;
    font-size:11px;
}

.info-row:last-child{
    border-bottom:0;
}

.info-row span:first-child{
    color:#666;
}

.info-row span:last-child{
    text-align:right;
    font-weight:800;
}

.modal-bg{
    position:fixed;
    inset:0;
    z-index:9000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
}

.modal-bg.open{
    display:flex;
}

.modal{
    width:min(540px,100%);
    border:1px solid #303030;
    border-radius:16px;
    background:#090909;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
    overflow:hidden;
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{opacity:0;transform:translateY(12px) scale(.98)}
    to{opacity:1;transform:none}
}

.modal-head{
    height:58px;
    display:flex;
    align-items:center;
    padding:0 16px;
    border-bottom:1px solid #202020;
}

.modal-title{
    flex:1;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.close-btn{
    width:32px;
    height:32px;
    border:1px solid #2c2c2c;
    border-radius:9px;
    background:#0c0c0c;
    color:#888;
    cursor:pointer;
    font-size:18px;
}

.close-btn:hover{
    color:#fff;
}

.modal-body{
    padding:18px;
}

.form-label{
    display:block;
    font-size:9px;
    letter-spacing:1.5px;
    color:#666;
    margin:0 0 7px;
}

.form-input,
.form-textarea{
    width:100%;
    border:1px solid #292929;
    border-radius:10px;
    background:#050505;
    color:#fff;
    outline:none;
    padding:12px;
    margin-bottom:14px;
}

.form-input:focus,
.form-textarea:focus{
    border-color:#666;
}

.form-textarea{
    min-height:110px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:5px;
}

.tool-result{
    max-height:310px;
    overflow:auto;
    border:1px solid #252525;
    border-radius:10px;
    background:#050505;
    padding:13px;
    margin-top:14px;
}

.result-row{
    display:grid;
    grid-template-columns:115px 1fr;
    gap:12px;
    padding:9px 0;
    border-bottom:1px solid #171717;
    font-size:11px;
}

.result-row:last-child{
    border-bottom:0;
}

.result-key{
    color:#666;
    font-size:9px;
    letter-spacing:1.2px;
}

.result-value{
    color:#eee;
    font-weight:800;
    word-break:break-word;
}

.result-empty{
    color:#555;
    font-size:10px;
}

#toast{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:99999;
    border:1px solid #303030;
    border-radius:10px;
    background:#0b0b0b;
    color:#fff;
    padding:11px 14px;
    font-size:11px;
    box-shadow:0 15px 50px #000;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

#toast.show{
    opacity:1;
    transform:none;
}

.projects-list{
    max-height:300px;
    overflow:auto;
    margin-top:12px;
}

.project-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border:1px solid #222;
    border-radius:9px;
    margin-bottom:7px;
    background:#070707;
}

.project-name{
    flex:1;
    font-size:11px;
    font-weight:800;
}

.zoom-box{
    position:absolute;
    right:18px;
    bottom:18px;
    z-index:200;
    display:flex;
    gap:5px;
}

.zoom-box button{
    width:35px;
    height:35px;
    border:1px solid #292929;
    border-radius:9px;
    background:#0b0b0b;
    cursor:pointer;
}

.zoom-box button:hover{
    background:#181818;
}

@media(max-width:800px){
    .sidebar{
        width:65px;
        padding:8px;
    }

    .side-title{
        display:none;
    }

    .side-btn{
        font-size:0;
        text-align:center;
        padding:0;
    }

    .side-btn:before{
        content:"•";
        font-size:18px;
    }

    .logo{
        min-width:auto;
        width:auto;
        font-size:10px;
    }

    .chain-search{
        width:145px;
    }

    .graph-toolbar{
        left:8px;
        right:8px;
    }

    .profile-page{
        padding:18px;
    }
}
</style>
</head>

<body>

<div id="bootScreen">
    <img class="boot-image" src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=80">
    <div class="boot-content">
        <div class="boot-title">NZX OSINT TOOL</div>
        <div class="boot-sub">INTELLIGENCE GRAPH SYSTEM</div>
        <div class="boot-line"></div>
    </div>
</div>

<div id="app">

<header class="topbar">
    <div class="logo">NZX / OSINT TOOL</div>

    <button class="top-btn" onclick="openTool('phone')">PHONE SCAN</button>
    <button class="top-btn" onclick="openTool('address')">ADDRESS</button>

    <div class="top-spacer"></div>

    <button class="top-btn" onclick="createProject()">＋ PROJECT</button>
    <button class="top-btn" onclick="showProjects()">PROJECTS</button>

    <div class="profile-mini" onclick="showPage('profile')">
        <span class="profile-dot"></span>
        <span>PROFILE</span>
    </div>
</header>

<div class="layout">

<aside class="sidebar">
    <div class="side-title">WORKSPACE</div>

    <button class="side-btn active" id="graphNav" onclick="showPage('graph')">
        GRAPH
    </button>

    <button class="side-btn" onclick="openTool('phone')">
        PHONE
    </button>

    <button class="side-btn" onclick="openTool('address')">
        ADDRESS
    </button>

    <button class="side-btn" onclick="showPage('profile')">
        PROFILE
    </button>

    <div style="flex:1"></div>

    <button class="side-btn" onclick="deleteAllNodes()">
        CLEAR GRAPH
    </button>
</aside>

<main class="main">

<section class="page active" id="graphPage">

    <div class="graph-toolbar">

        <input
            id="graphSearch"
            class="chain-search"
            placeholder="Search nodes..."
            autocomplete="off"
        >

        <div class="toolbar-space"></div>

        <button class="btn" onclick="openNodeModal()">
            ＋ NODE
        </button>

        <button
            class="btn danger"
            id="deleteNodeBtn"
            onclick="deleteSelectedNode()"
            disabled
        >
            DELETE NODE
        </button>

        <button class="btn" onclick="saveCurrentProject()">
            SAVE
        </button>
    </div>

    <div id="graph">

        <div id="graphGrid"></div>

        <div class="saturn-wrap">
            <div class="saturn-points"></div>
            <div class="saturn-ring"></div>
            <div class="saturn"></div>
        </div>

        <svg id="edges"></svg>

        <div class="empty-state" id="emptyState">
            <b>NO NODES</b>
            <span>Create a node or run a scan.</span>
        </div>

    </div>

    <div class="zoom-box">
        <button onclick="zoomGraph(1.12)">+</button>
        <button onclick="zoomGraph(.89)">−</button>
        <button onclick="resetView()">R</button>
    </div>

</section>

<section class="page profile-page" id="profilePage">

    <div class="profile-card">

        <div class="profile-title">NZX PROFILE</div>
        <div class="profile-sub">
            LOCAL WORKSPACE / GRAPH SESSION
        </div>

        <div class="info-box">

            <div class="info-row">
                <span>ENGINE</span>
                <span>NZX OSINT</span>
            </div>

            <div class="info-row">
                <span>NODES</span>
                <span id="profileNodes">0</span>
            </div>

            <div class="info-row">
                <span>EDGES</span>
                <span id="profileEdges">0</span>
            </div>

            <div class="info-row">
                <span>ZOOM</span>
                <span id="profileZoom">100%</span>
            </div>

        </div>

    </div>

</section>

</main>
</div>
</div>

<!-- NODE MODAL -->
<div class="modal-bg" id="nodeModal">

    <div class="modal">

        <div class="modal-head">
            <div class="modal-title">CREATE NODE</div>
            <button class="close-btn" onclick="closeModal('nodeModal')">×</button>
        </div>

        <div class="modal-body">

            <label class="form-label">TYPE</label>

            <select class="form-input" id="nodeType">
                <option value="PERSON">PERSON</option>
                <option value="PHONE">PHONE</option>
                <option value="ADDRESS">ADDRESS</option>
                <option value="EMAIL">EMAIL</option>
                <option value="USERNAME">USERNAME</option>
                <option value="COMPANY">COMPANY</option>
                <option value="CUSTOM">CUSTOM</option>
            </select>

            <label class="form-label">VALUE</label>

            <input
                class="form-input"
                id="nodeValue"
                placeholder="Enter value..."
                autocomplete="off"
            >

            <div class="modal-actions">
                <button class="btn" onclick="closeModal('nodeModal')">
                    CANCEL
                </button>

                <button class="btn" onclick="createNodeFromModal()">
                    CREATE
                </button>
            </div>

        </div>

    </div>

</div>

<!-- TOOL MODAL -->
<div class="modal-bg" id="toolModal">

    <div class="modal">

        <div class="modal-head">

            <div class="modal-title" id="toolTitle">
                PHONE SCAN
            </div>

            <button class="close-btn" onclick="closeModal('toolModal')">
                ×
            </button>

        </div>

        <div class="modal-body">

            <label class="form-label" id="toolLabel">
                PHONE NUMBER
            </label>

            <input
                class="form-input"
                id="toolInput"
                placeholder="+374..."
                autocomplete="off"
            >

            <div class="modal-actions">

                <button class="btn" onclick="closeModal('toolModal')">
                    CANCEL
                </button>

                <button class="btn" id="toolRunBtn" onclick="runTool()">
                    SCAN
                </button>

            </div>

            <div class="tool-result" id="toolResult" style="display:none"></div>

        </div>

    </div>

</div>

<!-- PROJECTS MODAL -->
<div class="modal-bg" id="projectsModal">

    <div class="modal">

        <div class="modal-head">
            <div class="modal-title">PROJECTS</div>
            <button class="close-btn" onclick="closeModal('projectsModal')">
                ×
            </button>
        </div>

        <div class="modal-body">

            <button class="btn" onclick="createProject()">
                ＋ NEW PROJECT
            </button>

            <div class="projects-list" id="projectsList"></div>

        </div>

    </div>

</div>

/* =========================================================
   PHONE NORMALIZATION
========================================================= */

function normalizePhone(value){
    return String(value || "")
        .replace(/[^\d+]/g,"")
        .replace(/^00/,"+");
}

function digitsOnly(value){
    return normalizePhone(value).replace(/\D/g,"");
}

function findPhoneCountry(number){

    const digits = digitsOnly(number);

    let best = null;

    for(const item of PHONE_DB){

        if(digits.startsWith(item.code)){

            if(!best || item.code.length > best.code.length){
                best = item;
            }
        }
    }

    return best;
}

function findPhoneRegion(country,digits){

    if(!country || !country.regions) return null;

    const local = digits.startsWith(country.code)
        ? digits.slice(country.code.length)
        : digits;

    let best = null;

    for(const region of country.regions){

        if(local.startsWith(region.prefix)){

            if(!best || region.prefix.length > best.prefix.length){
                best = region;
            }
        }
    }

    return best;
}

function localPhoneLookup(number){

    const normalized = normalizePhone(number);
    const digits = digitsOnly(number);

    const country = findPhoneCountry(number);

    if(!country){

        return {
            region:"Unknown",
            country:"Unknown",
            timeCode:"Unknown",
            number:normalized || number,
            city:"Unknown"
        };
    }

    const region = findPhoneRegion(country,digits);

    return {
        region:region?.city || "Unknown",
        country:country.country,
        timeCode:country.timezone,
        number:normalized,
        city:region?.city || "Unknown",
        iso:country.iso,
        callingCode:"+"+country.code,
        prefix:region?.prefix || ""
    };
}

/* =========================================================
   GRAPH DATABASE
========================================================= */

let DB = {
    nodes:[],
    edges:[],
    project:"default"
};

let selectedNode = null;
let currentTool = null;

let view = {
    x:0,
    y:0,
    zoom:1
};

let nodeDrag = null;
let graphPan = null;

function loadDB(){

    try{

        const saved = localStorage.getItem("nzx_osint_db");

        if(saved){

            const parsed = JSON.parse(saved);

            if(parsed && Array.isArray(parsed.nodes)){
                DB = parsed;
            }
        }

    }catch(e){
        console.error(e);
    }

    if(!Array.isArray(DB.nodes)) DB.nodes=[];
    if(!Array.isArray(DB.edges)) DB.edges=[];
}

function saveDB(){

    try{
        localStorage.setItem(
            "nzx_osint_db",
            JSON.stringify(DB)
        );
    }catch(e){
        console.error(e);
    }

    updateProfileUI();
}

function makeId(){
    return "node_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,8);
}

function getNode(id){
    return DB.nodes.find(n=>n.id===id);
}

function createNode(type,value,x,y){

    value = String(value || "").trim();

    if(!value){
        toast("Enter node value.");
        return null;
    }

    const node = {
        id:makeId(),
        type:type || "CUSTOM",
        value:value,
        x:Number.isFinite(x) ? x : 500 - view.x,
        y:Number.isFinite(y) ? y : 350 - view.y,
        createdAt:Date.now()
    };

    DB.nodes.push(node);

    renderNodes();
    saveDB();

    return node;
}

function removeNode(id){

    DB.nodes = DB.nodes.filter(n=>n.id!==id);

    DB.edges = DB.edges.filter(
        e=>e.from!==id && e.to!==id
    );

    if(selectedNode===id){
        selectedNode=null;
    }

    renderNodes();
    saveDB();

    toast("Node deleted.");
}

function deleteSelectedNode(){

    if(!selectedNode){
        toast("Select a node first.");
        return;
    }

    const node = getNode(selectedNode);

    if(!node){
        selectedNode=null;
        renderNodes();
        return;
    }

    removeNode(node.id);
}

function deleteAllNodes(){

    if(!DB.nodes.length){
        toast("Graph is already empty.");
        return;
    }

    if(!confirm("Delete all nodes and connections?")){
        return;
    }

    DB.nodes=[];
    DB.edges=[];
    selectedNode=null;

    renderNodes();
    saveDB();

    toast("Graph cleared.");
}

/* =========================================================
   EDGES
========================================================= */

function addLink(a,b){

    if(!a || !b || a===b) return;

    const exists = DB.edges.some(e=>
        (e.from===a && e.to===b) ||
        (e.from===b && e.to===a)
    );

    if(exists) return;

    DB.edges.push({
        id:makeId(),
        from:a,
        to:b
    });

    saveDB();
    renderEdges();
}

function removeLink(id){

    DB.edges = DB.edges.filter(e=>e.id!==id);

    saveDB();
    renderEdges();
}

/* =========================================================
   NODE UI
========================================================= */

function renderNodes(){

    document.querySelectorAll(".node").forEach(n=>n.remove());

    const graph = $("graph");

    DB.nodes.forEach(node=>{

        const el = document.createElement("div");

        el.className =
            "node" +
            (selectedNode===node.id ? " selected" : "");

        el.dataset.id=node.id;

        el.style.left=node.x+"px";
        el.style.top=node.y+"px";

        const remove = document.createElement("button");

        remove.className="node-remove";
        remove.type="button";
        remove.textContent="×";
        remove.title="Delete node";

        remove.addEventListener("pointerdown",e=>{
            e.stopPropagation();
        });

        remove.addEventListener("click",e=>{
            e.stopPropagation();

            removeNode(node.id);
        });

        const type = document.createElement("div");
        type.className="node-type";
        type.textContent=node.type;

        const value = document.createElement("div");
        value.className="node-value";
        value.textContent=node.value;

        el.appendChild(remove);
        el.appendChild(type);
        el.appendChild(value);

        if(node.meta){

            const meta = document.createElement("div");

            meta.className="node-meta";

            meta.textContent=node.meta;

            el.appendChild(meta);
        }

        /*
           ВАЖНО:
           Drag теперь начинается именно на самой ноде.
        */

        el.addEventListener("pointerdown",e=>{

            if(e.button!==0) return;

            if(e.target===remove) return;

            e.stopPropagation();

            selectedNode=node.id;

            document.querySelectorAll(".node")
                .forEach(n=>n.classList.remove("selected"));

            el.classList.add("selected");

            updateDeleteButton();

            const graphRect=graph.getBoundingClientRect();

            nodeDrag={
                id:node.id,
                pointerId:e.pointerId,
                startX:e.clientX,
                startY:e.clientY,
                nodeX:node.x,
                nodeY:node.y
            };

            el.classList.add("dragging");

            try{
                el.setPointerCapture(e.pointerId);
            }catch(_){}

        });

        el.addEventListener("pointermove",e=>{

            if(!nodeDrag) return;

            if(nodeDrag.pointerId!==e.pointerId) return;

            const n=getNode(nodeDrag.id);

            if(!n) return;

            const dx=(e.clientX-nodeDrag.startX)/view.zoom;
            const dy=(e.clientY-nodeDrag.startY)/view.zoom;

            n.x=nodeDrag.nodeX+dx;
            n.y=nodeDrag.nodeY+dy;

            el.style.left=n.x+"px";
            el.style.top=n.y+"px";

            renderEdges();
        });

        const finishDrag=()=>{

            if(!nodeDrag) return;

            el.classList.remove("dragging");

            nodeDrag=null;

            saveDB();
        };

        el.addEventListener("pointerup",finishDrag);
        el.addEventListener("pointercancel",finishDrag);

        el.addEventListener("dblclick",e=>{

            e.stopPropagation();

            const n=getNode(node.id);

            if(!n) return;

            const newValue=prompt(
                "Edit node value:",
                n.value
            );

            if(newValue!==null){

                const clean=newValue.trim();

                if(clean){
                    n.value=clean;
                    renderNodes();
                    saveDB();
                }
            }
        });

        graph.appendChild(el);
    });

    $("emptyState").style.display =
        DB.nodes.length ? "none" : "block";

    updateDeleteButton();
    renderEdges();
    updateProfileUI();
}

function updateDeleteButton(){

    const btn=$("deleteNodeBtn");

    if(!btn) return;

    btn.disabled=!selectedNode;
}

/* =========================================================
   EDGES
========================================================= */

function renderEdges(){

    const svg=$("edges");

    while(svg.firstChild){
        svg.removeChild(svg.firstChild);
    }

    for(const edge of DB.edges){

        const a=getNode(edge.from);
        const b=getNode(edge.to);

        if(!a || !b) continue;

        const line=document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

        line.classList.add("edge");

        const aw=getNodeWidth(a.id);
        const ah=getNodeHeight(a.id);

        const bw=getNodeWidth(b.id);
        const bh=getNodeHeight(b.id);

        line.setAttribute(
            "x1",
            a.x+aw/2
        );

        line.setAttribute(
            "y1",
            a.y+ah/2
        );

        line.setAttribute(
            "x2",
            b.x+bw/2
        );

        line.setAttribute(
            "y2",
            b.y+bh/2
        );

        svg.appendChild(line);
    }
}

function getNodeWidth(id){

    const el=document.querySelector(
        `.node[data-id="${CSS.escape(id)}"]`
    );

    return el?.offsetWidth || 180;
}

function getNodeHeight(id){

    const el=document.querySelector(
        `.node[data-id="${CSS.escape(id)}"]`
    );

    return el?.offsetHeight || 70;
}

function findDeepValue(obj,keys){

    if(!obj || typeof obj!=="object"){
        return "";
    }

    const wanted=new Set(
        keys.map(k=>String(k).toLowerCase())
    );

    let result="";

    function walk(value){

        if(result) return;

        if(!value || typeof value!=="object"){
            return;
        }

        for(const [key,val] of Object.entries(value)){

            const normalizedKey=
                String(key).toLowerCase();

            if(
                wanted.has(normalizedKey) &&
                val!==null &&
                val!==undefined &&
                typeof val!=="object"
            ){

                const str=String(val).trim();

                if(str){
                    result=str;
                    return;
                }
            }

            if(val && typeof val==="object"){
                walk(val);
            }
        }
    }

    walk(obj);

    return result;
}

function makePhoneSummary(phone,data){

    const local=localPhoneLookup(phone);

    const region=
        findDeepValue(data,[
            "region",
            "state",
            "province",
            "area",
            "region_name",
            "state_name"
        ]) ||
        local.region;

    const country=
        findDeepValue(data,[
            "country",
            "country_name",
            "countryName",
            "countryname"
        ]) ||
        local.country;

    const timeCode=
        findDeepValue(data,[
            "time_code",
            "timezone",
            "time_zone",
            "timeZone",
            "utc",
            "utc_offset",
            "utcOffset"
        ]) ||
        local.timeCode;

    const number=
        findDeepValue(data,[
            "number",
            "phone",
            "phone_number",
            "international",
            "international_number",
            "formatted",
            "international_format"
        ]) ||
        local.number;

    const city=
        findDeepValue(data,[
            "city",
            "town",
            "locality",
            "city_name",
            "cityName"
        ]) ||
        local.city;

    const fullName=
        findDeepValue(data,[
            "full_name",
            "fullName",
            "fullname",
            "owner_name",
            "owner",
            "person_name"
        ]);

    return {
        region,
        country,
        timeCode,
        number,
        city,
        fullName
    };
}

function showPhoneSummary(summary){

    const result=$("toolResult");

    result.innerHTML="";

    const rows=[
        ["REGION",summary.region],
        ["COUNTRY",summary.country],
        ["TIME CODE",summary.timeCode],
        ["NUMBER",summary.number],
        ["CITY",summary.city]
    ];

    if(summary.fullName){
        rows.push(["FULL NAME",summary.fullName]);
    }

    for(const [key,value] of rows){

        const row=document.createElement("div");
        row.className="result-row";

        const k=document.createElement("div");
        k.className="result-key";
        k.textContent=key;

        const v=document.createElement("div");
        v.className="result-value";
        v.textContent=value || "Unknown";

        row.appendChild(k);
        row.appendChild(v);

        result.appendChild(row);
    }

    result.style.display="block";
}

/* =========================================================
   ADD PHONE SUMMARY TO GRAPH
========================================================= */

function addPhoneResultToGraph(phone,data){

    const summary=makePhoneSummary(phone,data);

    const centerX=420-view.x;
    const centerY=330-view.y;

    const main=createNode(
        "PHONE",
        summary.number || phone,
        centerX,
        centerY
    );

    if(!main) return;

    const fields=[
        ["REGION",summary.region],
        ["COUNTRY",summary.country],
        ["TIME CODE",summary.timeCode],
        ["CITY",summary.city]
    ];

    if(summary.fullName){
        fields.push(["FULL NAME",summary.fullName]);
    }

    const radius=240;

    fields.forEach((item,index)=>{

        if(
            !item[1] ||
            String(item[1]).toLowerCase()==="unknown"
        ){
            return;
        }

        const angle=
            (-Math.PI/2) +
            (index/(Math.max(fields.length-1,1))) *
            Math.PI*2;

        const x=
            centerX +
            Math.cos(angle)*radius;

        const y=
            centerY +
            Math.sin(angle)*radius;

        const n=createNode(
            item[0],
            item[1],
            x,
            y
        );

        if(n){
            addLink(main.id,n.id);
        }
    });

    renderNodes();
    saveDB();
}

/* =========================================================
   TOOL MODAL
========================================================= */

function openTool(type){

    currentTool=type;

    $("toolResult").style.display="none";
    $("toolResult").innerHTML="";
    $("toolInput").value="";

    if(type==="phone"){

        $("toolTitle").textContent="PHONE SCAN";
        $("toolLabel").textContent="PHONE NUMBER";
        $("toolInput").placeholder="+374...";
        $("toolRunBtn").textContent="SCAN";

    }else{

        $("toolTitle").textContent="ADDRESS SEARCH";
        $("toolLabel").textContent="ADDRESS";
        $("toolInput").placeholder="Yerevan, Armenia...";
        $("toolRunBtn").textContent="SEARCH";
    }

    openModal("toolModal");

    setTimeout(()=>{
        $("toolInput").focus();
    },100);
}

async function runTool(){

    const input=$("toolInput").value.trim();

    if(!input){
        toast("Enter a value.");
        return;
    }

    const result=$("toolResult");

    result.style.display="block";

    result.innerHTML=
        `<div class="result-empty">Scanning...</div>`;

    if(currentTool==="phone"){

        const local=localPhoneLookup(input);

        /*
           Сначала показываем локальный результат.
           Поэтому страна/код определяются даже если API
           временно недоступен.
        */

        showPhoneSummary(local);

        let apiData={};

        try{

            const response=await fetch(
                "/api/osint/phone",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body:
                        "phone="+
                        encodeURIComponent(input)
                }
            );

            if(response.ok){

                apiData=await response.json();

                const summary=
                    makePhoneSummary(input,apiData);

                showPhoneSummary(summary);

                addPhoneResultToGraph(
                    input,
                    apiData
                );

                toast("Phone scan complete.");

            }else{

                /*
                   Даже без backend API локальная база
                   продолжает работать.
                */

                addPhoneResultToGraph(
                    input,
                    local
                );

                toast("Local phone database used.");
            }

        }catch(error){

            console.warn(error);

            addPhoneResultToGraph(
                input,
                local
            );

            toast("API unavailable — local database used.");
        }

        return;
    }

    /* ADDRESS */

    try{

        const response=await fetch(
            "/api/map/search?q="+
            encodeURIComponent(input)
        );

        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }

        const data=await response.json();

        result.innerHTML="";

        let display=data;

        if(Array.isArray(data)){
            display=data.slice(0,8);
        }

        const pre=document.createElement("pre");

        pre.style.whiteSpace="pre-wrap";
        pre.style.wordBreak="break-word";
        pre.style.fontSize="10px";
        pre.style.color="#aaa";

        pre.textContent=
            JSON.stringify(display,null,2);

        result.appendChild(pre);

        addAddressResultToGraph(input,data);

        toast("Address search complete.");

    }catch(error){

        result.innerHTML=
            `<div class="result-empty">
                Address search failed.
             </div>`;

        toast("Address API unavailable.");
    }
}

/* =========================================================
   ADDRESS GRAPH
========================================================= */

function addAddressResultToGraph(address,data){

    const main=createNode(
        "ADDRESS",
        address,
        420-view.x,
        330-view.y
    );

    if(!main) return;

    let items=[];

    if(Array.isArray(data)){
        items=data.slice(0,6);
    }else if(data && typeof data==="object"){
        items=Object.entries(data).slice(0,6);
    }

    items.forEach((item,index)=>{

        let value;

        if(Array.isArray(data)){
            value=
                typeof item==="object"
                ? JSON.stringify(item)
                : String(item);
        }else{
            value=String(item[1]);
        }

        const n=createNode(
            "LOCATION",
            value,
            main.x+220,
            main.y+(index-2)*90
        );

        if(n){
            addLink(main.id,n.id);
        }
    });

    renderNodes();
    saveDB();
}

/* =========================================================
   GRAPH PAN
========================================================= */

function setupGraphPan(){

    const graph=$("graph");

    graph.addEventListener("pointerdown",e=>{

        /*
           Если нажали на node — nodeDrag уже обрабатывает
           событие и останавливает его.
        */

        if(e.target.closest(".node")){
            return;
        }

        graphPan={
            pointerId:e.pointerId,
            startX:e.clientX,
            startY:e.clientY,
            x:view.x,
            y:view.y
        };

        graph.classList.add("dragging");

        try{
            graph.setPointerCapture(e.pointerId);
        }catch(_){}
    });

    graph.addEventListener("pointermove",e=>{

        if(!graphPan) return;

        if(graphPan.pointerId!==e.pointerId) return;

        view.x=
            graphPan.x +
            (e.clientX-graphPan.startX);

        view.y=
            graphPan.y +
            (e.clientY-graphPan.startY);

        applyView();
    });

    const finish=()=>{

        if(!graphPan) return;

        graphPan=null;

        graph.classList.remove("dragging");
    };

    graph.addEventListener("pointerup",finish);
    graph.addEventListener("pointercancel",finish);

    graph.addEventListener(
        "wheel",
        e=>{
            e.preventDefault();

            zoomGraph(
                e.deltaY<0 ? 1.08 : .92
            );
        },
        {passive:false}
    );
}

function applyView(){

    /*
       Ноды хранят реальные координаты.
       Пан/zoom применяется к графическому контейнеру
       через transform.
    */

    document.querySelectorAll(".node").forEach(el=>{

        const node=getNode(el.dataset.id);

        if(!node) return;

        el.style.transform=
            `translate(${view.x}px,${view.y}px) scale(${view.zoom})`;
        el.style.transformOrigin="top left";
    });

    $("edges").style.transform=
        `translate(${view.x}px,${view.y}px) scale(${view.zoom})`;

    $("graphGrid").style.transform=
        `translate(${view.x}px,${view.y}px)`;

    $("saturn-wrap")?.style;
    renderEdges();
    updateProfileUI();
}

function zoomGraph(multiplier){

    const old=view.zoom;

    view.zoom*=multiplier;

    view.zoom=Math.max(
        .35,
        Math.min(2.5,view.zoom)
    );

    if(old!==view.zoom){
        applyView();
    }
}

function resetView(){

    view.x=0;
    view.y=0;
    view.zoom=1;

    document.querySelectorAll(".node").forEach(el=>{
        el.style.transform="none";
    });

    $("edges").style.transform="none";

    applyView();

    toast("View reset.");
}

/* =========================================================
   SEARCH
========================================================= */

function setupSearch(){

    $("graphSearch").addEventListener(
        "input",
        e=>{

            const q=e.target.value
                .trim()
                .toLowerCase();

            document.querySelectorAll(".node")
                .forEach(el=>{

                    const node=getNode(el.dataset.id);

                    if(!node) return;

                    const match=
                        !q ||
                        node.value.toLowerCase().includes(q) ||
                        node.type.toLowerCase().includes(q);

                    el.style.opacity=
                        match ? "1" : ".18";
                });
        }
    );
}

/* =========================================================
   PROJECTS
========================================================= */

function getProjects(){

    try{

        return JSON.parse(
            localStorage.getItem("nzx_projects") ||
            "[]"
        );

    }catch(e){

        return [];
    }
}

function saveProjects(projects){

    localStorage.setItem(
        "nzx_projects",
        JSON.stringify(projects)
    );
}

function saveCurrentProject(){

    const projects=getProjects();

    const name=
        DB.project ||
        "default";

    const existing=
        projects.findIndex(p=>p.name===name);

    const item={
        name,
        db:JSON.parse(JSON.stringify(DB)),
        savedAt:Date.now()
    };

    if(existing>=0){
        projects[existing]=item;
    }else{
        projects.push(item);
    }

    saveProjects(projects);
    saveDB();

    toast("Project saved.");
}

function createProject(){

    const name=prompt(
        "Project name:",
        "project-"+(getProjects().length+1)
    );

    if(!name) return;

    DB={
        nodes:[],
        edges:[],
        project:name.trim()
    };

    selectedNode=null;

    renderNodes();
    saveDB();
    saveCurrentProject();

    closeModal("projectsModal");

    toast("Project created.");
}

function showProjects(){

    const list=$("projectsList");

    list.innerHTML="";

    const projects=getProjects();

    if(!projects.length){

        list.innerHTML=
            `<div class="result-empty">
                No saved projects.
             </div>`;

        openModal("projectsModal");

        return;
    }

    projects.forEach((project,index)=>{

        const item=document.createElement("div");
        item.className="project-item";

        const name=document.createElement("div");
        name.className="project-name";
        name.textContent=project.name;

        const open=document.createElement("button");
        open.className="btn";
        open.textContent="OPEN";

        open.onclick=()=>{

            DB=JSON.parse(
                JSON.stringify(project.db)
            );

            selectedNode=null;

            renderNodes();
            saveDB();

            closeModal("projectsModal");

            toast("Project opened.");
        };

        const del=document.createElement("button");
        del.className="btn danger";
        del.textContent="×";

        del.onclick=()=>{

            if(!confirm(
                "Delete project '"+project.name+"'?"
            )){
                return;
            }

            projects.splice(index,1);
            saveProjects(projects);

            showProjects();
        };

        item.appendChild(name);
        item.appendChild(open);
        item.appendChild(del);

        list.appendChild(item);
    });

    openModal("projectsModal");
}

    $("profileNodes").textContent=

    $("profileEdges").textContent=

========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        document
            .querySelectorAll(".modal-bg.open")
            .forEach(m=>m.classList.remove("open"));
    }

    if(
        e.key==="Delete" &&
        selectedNode &&
        !["INPUT","TEXTAREA","SELECT"].includes(
            document.activeElement?.tagName
        )
    ){

        removeNode(selectedNode);
    }

    if(
        e.key==="Enter" &&
        $("nodeModal").classList.contains("open")
    ){

        createNodeFromModal();
    }
});
