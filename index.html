<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NZX OSINT TOOL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#f5f5f5;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.92);
  --text:#f5f5f5;
  --muted:#777;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
}

/* APP */
.app{
  width:100%;
  height:100%;
  position:relative;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.025),transparent 45%),
    #050505;
}

/* TOPBAR */
.topbar{
  position:fixed;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:72px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:linear-gradient(180deg,rgba(8,8,8,.98),rgba(8,8,8,.88));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.logo{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #fff;
  border-radius:11px;
  font-size:19px;
  font-weight:900;
  margin-right:12px;
  box-shadow:0 0 25px rgba(255,255,255,.08);
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:210px;
}

.brand b{
  font-size:14px;
  letter-spacing:.15em;
}

.brand small{
  color:#666;
  font-size:8px;
  letter-spacing:.24em;
}

.top-tools{
  display:flex;
  align-items:center;
  gap:7px;
  margin-left:auto;
}

.top-btn{
  height:34px;
  padding:0 13px;
  color:#bbb;
  background:#0c0c0c;
  border:1px solid var(--line2);
  border-radius:8px;
  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;
  transition:.2s ease;
}

.top-btn:hover{
  color:#fff;
  background:#161616;
  border-color:#666;
  transform:translateY(-1px);
}

.profile-mini{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #333;
  background:#111;
  overflow:hidden;
  margin-left:10px;
  padding:0;
}

.profile-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:72px;
  bottom:0;
  width:66px;
  z-index:90;
  display:flex;
  align-items:center;
  flex-direction:column;
  padding-top:18px;
  background:rgba(6,6,6,.94);
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.side-btn{
  width:42px;
  height:42px;
  margin-bottom:8px;
  border:1px solid transparent;
  border-radius:10px;
  color:#555;
  background:transparent;
  font-size:19px;
  transition:.2s ease;
}

.side-btn:hover,
.side-btn.active{
  color:#fff;
  background:#111;
  border-color:#292929;
}

/* PAGES */
.page{
  display:none;
  position:absolute;
  top:72px;
  left:66px;
  right:0;
  bottom:0;
}

.page.active{display:block}

/* CHAIN */
.chain-page{
  width:100%;
  height:100%;
  position:relative;
}

.chain-toolbar{
  position:absolute;
  top:17px;
  left:18px;
  right:18px;
  z-index:30;
  display:flex;
  gap:8px;
  align-items:center;
}

.chain-search{
  width:240px;
  height:37px;
  padding:0 12px;
  border-radius:9px;
  border:1px solid var(--line2);
  background:rgba(10,10,10,.86);
  color:#fff;
  outline:none;
  font-size:11px;
}

.chain-search:focus{border-color:#666}
.chain-search::placeholder{color:#555}

.btn{
  height:37px;
  padding:0 13px;
  border-radius:9px;
  border:1px solid var(--line2);
  color:#aaa;
  background:#0c0c0c;
  font-size:10px;
  font-weight:800;
  transition:.2s ease;
}

.btn:hover{
  color:#fff;
  background:#151515;
  border-color:#777;
}

.btn.primary{
  color:#050505;
  background:#fff;
  border-color:#fff;
}

.btn.primary:hover{background:#ddd}

.btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* GRAPH */
.graph{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  touch-action:none;
  background-color:#050505;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
}

.world{
  position:absolute;
  left:50%;
  top:50%;
  width:1px;
  height:1px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:center;
}

.lines{
  position:absolute;
  left:-5000px;
  top:-5000px;
  width:10000px;
  height:10000px;
  overflow:visible;
  pointer-events:none;
}

/* BEAUTIFUL NODES */
.node{
  position:absolute;
  width:170px;
  min-height:72px;
  transform:translate(-50%,-50%);
  padding:12px 13px;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(145deg,rgba(20,20,20,.97),rgba(9,9,9,.97));
  border-radius:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  cursor:grab;
  touch-action:none;
  transition:border-color .2s,box-shadow .2s;
  z-index:5;
}

.node:hover{
  border-color:#555;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.node.dragging{
  cursor:grabbing;
  border-color:#888;
  box-shadow:0 30px 90px rgba(0,0,0,.8);
  z-index:20;
}

.node.highlight{
  border-color:#fff;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.2),
    0 0 40px rgba(255,255,255,.1);
}

/* X BUTTON */
.node-delete{
  position:absolute;
  right:7px;
  top:6px;
  width:21px;
  height:21px;
  border:1px solid transparent;
  border-radius:6px;
  color:#666;
  background:transparent;
  font-size:15px;
  line-height:19px;
  padding:0;
  z-index:20;
  transition:.15s;
}

.node-delete:hover{
  color:#fff;
  background:#252525;
  border-color:#444;
}

.node-type{
  color:#555;
  font-size:8px;
  font-weight:900;
  letter-spacing:.15em;
  margin-bottom:6px;
  padding-right:18px;
}

.node-title{
  color:#eee;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding-right:16px;
}

.node-content{
  margin-top:5px;
  color:#777;
  font-size:9px;
  line-height:1.4;
  max-height:28px;
  overflow:hidden;
  word-break:break-word;
}

.node-photo-wrap{
  width:100%;
  height:108px;
  margin:0 0 9px;
  border-radius:10px;
  overflow:hidden;
  background:#080808;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 0 30px rgba(0,0,0,.45);
}
.node-photo{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.node.geo-node{
  width:190px;
}
.node-photo-only{
  width:210px;
  padding:8px;
}
.node-photo-only .node-photo-wrap{
  height:145px;
  margin:0;
}
.node-photo-only .node-type,
.node-photo-only .node-title,
.node-photo-only .node-content{
  display:none;
}

.node-dot{
  display:none;
  position:absolute;
  width:16px;
  height:16px;
  right:-8px;
  top:50%;
  transform:translateY(-50%);
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 20px rgba(255,255,255,.7);
  cursor:crosshair;
  z-index:30;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

/* SATURN */
.saturn{
  position:absolute;
  left:50%;
  top:50%;
  width:470px;
  height:470px;
  transform:translate(-50%,-50%);
  opacity:.62;
  pointer-events:none;
  filter:drop-shadow(0 0 35px rgba(255,255,255,.08));
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:360px;
  height:105px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 20px rgba(255,255,255,.05);
  transform:translate(-50%,-50%) rotateX(67deg);
  transform-style:preserve-3d;
  opacity:.65;
}

/* PROFILE */
.profile{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.profile-card{
  width:min(600px,100%);
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(20,20,20,.95),rgba(7,7,7,.96));
  box-shadow:0 30px 100px rgba(0,0,0,.5);
  padding:28px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
}

.profile-avatar{
  width:84px;
  height:84px;
  border-radius:50%;
  object-fit:cover;
  background:#111;
  border:1px solid #333;
}

.profile-info h1{font-size:24px}

.profile-info p{
  color:#666;
  margin-top:5px;
  font-size:12px;
}

.profile-actions{
  display:flex;
  gap:8px;
  margin-top:25px;
  flex-wrap:wrap;
}

.profile-button{
  height:38px;
  padding:0 14px;
  border-radius:8px;
  border:1px solid #333;
  background:#111;
  color:#aaa;
  font-size:10px;
  font-weight:800;
}

.profile-button:hover{
  color:#fff;
  border-color:#666;
}

.profile-button.primary{
  color:#000;
  background:#fff;
  border-color:#fff;
}

/* MODALS */
.tool-modal,
#nodeModal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
}

.tool-modal.open,
#nodeModal.open{
  display:flex;
}

.modal-box,
.node-modal-box{
  width:min(520px,100%);
  max-height:calc(100vh - 40px);
  overflow:auto;
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:linear-gradient(145deg,#151515,#090909);
  box-shadow:0 40px 120px rgba(0,0,0,.75);
  padding:22px;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.modal-top h2{
  font-size:17px;
  letter-spacing:.04em;
}

.close{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#777;
  font-size:20px;
}

.close:hover{color:#fff}

.modal-description{
  color:#666;
  font-size:10px;
  line-height:1.5;
  margin-bottom:16px;
}

.modal-input{
  width:100%;
  height:45px;
  padding:0 13px;
  color:#fff;
  background:#080808;
  border:1px solid #2b2b2b;
  border-radius:9px;
  outline:none;
}

.modal-input:focus{border-color:#777}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  height:36px;
  padding:0 14px;
  border-radius:8px;
  border:1px solid #333;
  color:#aaa;
  background:#111;
  font-size:9px;
  font-weight:900;
}

.modal-actions button:hover{
  color:#fff;
  border-color:#777;
}

.modal-actions button.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.results{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:18px;
}

.result{
  padding:11px 12px;
  border-radius:9px;
  border:1px solid #202020;
  background:#0c0c0c;
}

.result-head{
  display:flex;
  align-items:center;
  gap:7px;
  color:#777;
  font-size:8px;
  font-weight:900;
  letter-spacing:.12em;
}

.result-value{
  margin-top:5px;
  color:#ddd;
  font-size:11px;
  line-height:1.45;
  white-space:pre-wrap;
  word-break:break-word;
}

.result.good{border-color:rgba(170,255,170,.18)}
.result.warn{border-color:rgba(255,220,100,.18)}
.result.bad{border-color:rgba(255,100,100,.18)}

.field{margin-bottom:13px}

.field label{
  display:block;
  color:#555;
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  color:#fff;
  background:#080808;
  border:1px solid #292929;
  border-radius:8px;
  outline:none;
  padding:10px;
  font-size:11px;
}

.field input{height:40px}
.field textarea{min-height:100px;resize:vertical}

.field input:focus,
.field textarea:focus{
  border-color:#666;
}

/* GEOSINT UPLOAD */
.geo-upload{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  padding:11px;
  border:1px dashed #303030;
  border-radius:10px;
  background:#090909;
}

.geo-upload-preview{
  width:58px;
  height:58px;
  border-radius:8px;
  object-fit:cover;
  display:none;
  border:1px solid #333;
}

.geo-upload-info{
  min-width:0;
  flex:1;
}

.geo-upload-title{
  font-size:9px;
  font-weight:900;
  letter-spacing:.1em;
}

.geo-upload-name{
  color:#666;
  font-size:9px;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.geo-upload-btn{
  height:31px;
  padding:0 10px;
  border-radius:7px;
  border:1px solid #333;
  color:#aaa;
  background:#111;
  font-size:8px;
  font-weight:900;
}

.geo-upload-btn:hover{
  color:#fff;
  border-color:#666;
}

/* TOAST */
.toast{
  position:fixed;
  z-index:900;
  left:50%;
  bottom:22px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 15px;
  border:1px solid #333;
  border-radius:9px;
  background:#111;
  color:#ddd;
  font-size:10px;
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@keyframes dash{
  to{stroke-dashoffset:-60}
}

/* MOBILE */
@media(max-width:760px){
  .topbar{
    height:62px;
    padding:0 10px;
  }

  .brand{min-width:0}

  .brand b{font-size:11px}
  .brand small{display:none}

  .top-tools{
    margin-left:auto;
  }

  .top-btn{
    width:35px;
    padding:0;
    overflow:hidden;
    font-size:0;
  }

  .top-btn:first-child::after{
    content:"☎";
    font-size:14px;
  }

  .top-btn:nth-child(2)::after{
    content:"⌖";
    font-size:14px;
  }

  .top-btn:nth-child(3)::after{
    content:"◎";
    font-size:14px;
  }

  .sidebar{
    top:62px;
    width:54px;
  }

  .page{
    top:62px;
    left:54px;
  }

  .chain-toolbar{
    left:10px;
    right:10px;
  }

  .chain-search{
    width:100%;
  }

  .node{width:150px}

  .saturn{
    width:330px;
    height:330px;
  }

  .saturn-ring{width:270px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="logo">N</div>

  <div class="brand">
    <b>NZX OSINT TOOL</b>
    <small>INTELLIGENCE WORKSPACE</small>
  </div>

  <div class="top-tools">

    <button class="top-btn" onclick="openTool('phone')">
      CHECK NUMBER
    </button>

    <button class="top-btn" onclick="openTool('address')">
      CHECK ADDRESS
    </button>

    <button class="top-btn" onclick="openTool('geosint')">
      GEOSINT
    </button>

  </div>

  <button class="profile-mini" onclick="openProfile()">
    <img id="miniAvatar" alt="">
  </button>

</header>

<aside class="sidebar">

  <button class="side-btn active" data-page="chain" onclick="showPage('chain')">
    ⌘
  </button>

  <button class="side-btn" data-page="profile" onclick="openProfile()">
    ◎
  </button>

</aside>

<section class="page active" id="page-chain">

  <div class="chain-page">

    <div class="chain-toolbar">

      <input
        class="chain-search"
        id="chainSearch"
        placeholder="Search chain or node..."
      >

      <button class="btn" onclick="openNodeModal()">
        ＋ Node
      </button>

      <button class="btn" onclick="centerGraph()">
        ⌂
      </button>

    </div>

    <div class="graph" id="graph">

      <div class="saturn">
        <canvas id="saturn"></canvas>
        <div class="saturn-ring" id="saturnRing"></div>
      </div>

      <div class="world" id="world">

        <svg
          class="lines"
          id="lines"
          viewBox="-5000 -5000 10000 10000"
        ></svg>

      </div>

    </div>

  </div>

</section>

<section class="page" id="page-profile">

  <div class="profile">

    <div class="profile-card">

      <div class="profile-head">

        <img
          class="profile-avatar"
          id="profileAvatar"
          alt=""
        >

        <div class="profile-info">

          <h1 id="profileName">NZX User</h1>

          <p id="profileUsername">@nzx_user</p>

        </div>

      </div>

      <div class="profile-actions">

        <button
          class="profile-button primary"
          onclick="chooseAvatar()"
        >
          Choose avatar
        </button>

        <button
          class="profile-button"
          onclick="editProfileName()"
        >
          Edit name
        </button>

        <button
          class="profile-button"
          onclick="showPage('chain')"
        >
          Back to Chain
        </button>

      </div>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
        style="display:none"
      >

    </div>

  </div>

</section>

<!-- TOOL MODAL -->
<div
  class="tool-modal"
  id="toolModal"
  onclick="outsideToolModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-top">

      <h2 id="toolTitle">Check</h2>

      <button class="close" onclick="closeTool()">
        ×
      </button>

    </div>

    <div
      class="modal-description"
      id="toolDescription"
    ></div>

    <input
      class="modal-input"
      id="toolInput"
      autocomplete="off"
    >

    <!-- GEOSINT PHOTO -->
    <div
      class="geo-upload"
      id="geoUpload"
      style="display:none"
    >

      <img
        class="geo-upload-preview"
        id="geoPreview"
        alt=""
      >

      <div class="geo-upload-info">

        <div class="geo-upload-title">
          IMAGE FOR GEOSINT
        </div>

        <div
          class="geo-upload-name"
          id="geoFileName"
        >
          Фото не выбрано
        </div>

      </div>

      <button
        class="geo-upload-btn"
        onclick="chooseGeoPhoto()"
      >
        ATTACH
      </button>

    </div>

    <input
      id="geoPhoto"
      type="file"
      accept="image/*"
      style="display:none"
    >

    <div class="modal-actions">

      <button onclick="closeTool()">
        CLOSE
      </button>

      <button
        class="primary"
        id="toolRun"
        onclick="runTool()"
      >
        CHECK
      </button>

    </div>

    <div
      class="results"
      id="toolResults"
    ></div>

  </div>

</div>

<!-- NODE MODAL -->
<div id="nodeModal">

  <div class="node-modal-box">

    <h2 id="nodeModalTitle" style="margin:0 0 18px">
      New Node
    </h2>

    <div class="field">

      <label>NAME</label>

      <input
        id="nodeTitle"
        placeholder="Username"
      >

    </div>

    <div class="field">

      <label>TYPE</label>

      <input
        id="nodeType"
        placeholder="PHONE / USERNAME / LOCATION"
      >

    </div>

    <div class="field">

      <label>CONTENT</label>

      <textarea
        id="nodeContent"
        placeholder="Information..."
      ></textarea>

    </div>

    <div style="display:flex;gap:8px;margin-top:17px">

      <button
        class="btn"
        style="margin-left:auto"

</div>

<div class="toast" id="toast"></div>

</div>

<script>
/* ==========================================================
   DATABASE
========================================================== */

const STORAGE_KEY="nzx-osint-real-v5";

let db={
  nodes:{},
  links:[],
  profile:{
    name:"NZX User",
    username:"nzx_user",
    avatar:""
  },
  searches:0
};

try{
  const saved=localStorage.getItem(STORAGE_KEY);

  if(saved){
    const parsed=JSON.parse(saved);

    db={
      ...db,
      ...parsed,
      nodes:parsed.nodes||{},
      links:Array.isArray(parsed.links)?parsed.links:[],
      profile:{
        ...db.profile,
        ...(parsed.profile||{})
      }
    };
  }
}catch(e){
  console.warn("Storage error",e);
}

function saveDB(){
  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(db)
    );
  }catch(e){
    console.warn("Could not save database",e);
  }
}

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function uid(){
  return "node_"+Date.now()+"_"+Math.random()
    .toString(36)
    .slice(2,8);
}

let toastTimer=null;

function toast(message){

  const el=$("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* ==========================================================
   PAGES
========================================================== */

function openProfile(){

}

/* ==========================================================
   PROFILE

function editProfileName(){

  if(name===null)return;

/* ==========================================================
   TOOLS
========================================================== */

const toolConfig={

  phone:{
    title:"CHECK NUMBER",
    placeholder:"+374 XX XXX XXX",
    description:
      "Проверка номера. Отображаются только основные данные, которые реально вернул backend."

async function runTool(){

    $("toolRun").disabled=false;

/* ==========================================================
   RESULT UI
========================================================== */

function addResult(title,value,status="INFO",icon="•"){

  const box=document.createElement("div");

  let cls="result";

  if(status==="OK")cls+=" good";
  if(status==="WARNING")cls+=" warn";

/* ==========================================================
   PHONE
========================================================== */

async function checkPhoneReal(value){

  addResult(
    "REQUEST",
    "Проверка номера...",
    "INFO",
    "•"
  );

  try{

    const form=new URLSearchParams();

    form.append("phone",value);

    const response=await fetch(
      "/api/osint/phone",
      {
        method:"POST",
        headers:{
          "Accept":"application/json"
        },
        body:form
      }
    );

    let data=null;

    try{
      data=await response.json();
    }catch{
      data=null;
    }

    $("toolResults").innerHTML="";

    if(!response.ok){

      addResult(
        "BACKEND ERROR",
        data?.error||
        ("HTTP "+response.status),
        "ERROR",
        "!"
      );

      return;
    }

    if(!data){

      addResult(
        "RESPONSE",
        "Backend не вернул JSON.",
        "ERROR",
        "!"
      );

      return;
    }

    renderPhoneResult(data);

    createPhoneGraph(data);

    db.searches++;

    saveDB();

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||
      "Не удалось связаться с backend.",
      "ERROR",
      "!"
    );
  }
}

/*
  Backend может возвращать разные названия полей.
  Поэтому ищем только нужные значения.
*/

function findDeep(obj,keys){

  if(!obj||typeof obj!=="object")
    return "";

  const wanted=keys.map(
    x=>String(x).toLowerCase()
  );

  let result="";

  function walk(value){

    if(result)return;

    if(!value||typeof value!=="object")
      return;

    for(const [key,val] of Object.entries(value)){

      const normalized=key.toLowerCase();

      if(
        wanted.includes(normalized) &&
        val!==null &&
        val!==undefined &&
        typeof val!=="object" &&
        String(val).trim()
      ){
        result=String(val).trim();
        return;
      }

      walk(val);
    }
  }

  walk(obj);

  return result;
}

function phoneSummary(data,originalPhone){

  const region=findDeep(
    data,
    ["region","state","province","area"]
  );

  const country=findDeep(
    data,
    ["country","country_name","countryName"]
  );

  const timezone=findDeep(
    data,
    [
      "time_code",
      "timezone",
      "time_zone",
      "timeZone",
      "utc",
      "utc_offset"
    ]
  );

  const number=findDeep(
    data,
    [
      "e164",
      "international",
      "international_number",
      "number",
      "phone",
      "phone_number",
      "formatted"
    ]
  )||originalPhone;

  const city=findDeep(
    data,
    ["city","town","locality"]
  );

  const fullName=findDeep(
    data,
    [
      "full_name",
      "fullName",
      "owner_name",
      "person_name"
    ]
  );

  return {
    region:region||"UNKNOWN",
    country:country||"UNKNOWN",
    timezone:timezone||"UNKNOWN",
    number:number||"UNKNOWN",
    city:city||"UNKNOWN",
    fullName:fullName||""
  };
}

function renderPhoneResult(data){

  const original=
    data.phone||
    data.number||
    data.e164||
    "";

  const s=phoneSummary(
    data,
    original
  );

  addResult(
    "NUMBER",
    s.number,
    "OK",
    "☎"
  );

  addResult(
    "REGION",
    s.region,
    s.region==="UNKNOWN"?"WARNING":"INFO",
    "⌖"
  );

  addResult(
    "COUNTRY",
    s.country,
    s.country==="UNKNOWN"?"WARNING":"INFO",
    "◎"
  );

  addResult(
    "TIME CODE",
    s.timezone,
    s.timezone==="UNKNOWN"?"WARNING":"INFO",
    "◷"
  );

  addResult(
    "CITY",
    s.city,
    s.city==="UNKNOWN"?"WARNING":"INFO",
    "⌂"
  );

  if(s.fullName){

    addResult(
      "FULL NAME",
      s.fullName,
      "INFO",
      "◆"
    );
  }
}

/* ==========================================================
   PHONE GRAPH
========================================================== */

function createNode(
  title,
  type,
  content,
  x,
  y,
  meta={}
){

  const id=uid();

  db.nodes[id]={
    id,
    title,
    type,
    content,
    x,
    y,
    ...meta
  };

  return id;
}

function createPhoneGraph(data){

  const phone=
    data.e164||
    data.phone||
    data.number;

  if(!phone)return;

  let phoneNode=Object.values(db.nodes)
    .find(n=>
      n.type==="PHONE" &&
      n.content===String(phone)
    );

  if(!phoneNode){

    const center=getGraphCenter();

    const id=createNode(
      "Phone Number",
      "PHONE",
      String(phone),
      center.x,
      center.y
    );

    phoneNode=db.nodes[id];
  }

  const summary=phoneSummary(
    data,
    phone
  );

  const values=[
    ["Region","REGION",summary.region],
    ["Country","COUNTRY",summary.country],
    ["Time Code","TIME CODE",summary.timezone],
    ["Number","NUMBER",summary.number],
    ["City","CITY",summary.city],
    ["Full Name","FULL NAME",summary.fullName]
  ];

  let index=0;

  for(const item of values){

    const content=item[2];

    if(
      !content||
      content==="UNKNOWN"
    )continue;

    const duplicate=Object.values(db.nodes)
      .find(n=>
        n.type===item[1] &&
        n.content===String(content)
      );

    let target=duplicate;

    if(!target){

      const angle=
        index*
        (Math.PI*2/values.length);

      const radius=
        240+
        (index%3)*70;

      const id=createNode(
        item[0],
        item[1],
        String(content),
        phoneNode.x+
          Math.cos(angle)*radius,
        phoneNode.y+
          Math.sin(angle)*radius
      );

      target=db.nodes[id];
    }

    const exists=db.links.some(link=>
      (link.a===phoneNode.id&&link.b===target.id)||
      (link.a===target.id&&link.b===phoneNode.id)
    );

    if(!exists){

      db.links.push({
        a:phoneNode.id,
        b:target.id
      });
    }

    index++;
  }

  saveDB();
  renderNodes();
  renderLines();
}

/* ==========================================================
   ADDRESS
========================================================== */

async function checkAddressReal(value){

  addResult(
    "SEARCH",
    "Ищем адрес...",
    "INFO",
    "•"
  );

  try{

    const response=await fetch(
      "/api/map/search?q="+
      encodeURIComponent(value),
      {
        headers:{
          "Accept":"application/json"
        }
      }
    );

    const data=await response.json();

    $("toolResults").innerHTML="";

    if(!response.ok||!data.success){

      addResult(
        "ADDRESS ERROR",
        data.error||"Адрес не найден.",
        "ERROR",
        "!"
      );

      return;
    }

    const results=data.results||[];

    if(!results.length){

      addResult(
        "RESULT",
        "Ничего не найдено.",
        "WARNING",
        "?"
      );

      return;
    }

    results.slice(0,5).forEach((item,index)=>{

      addResult(
        "RESULT "+(index+1),
        item.display_name||"UNKNOWN",
        "OK",
        "⌖"
      );

      addResult(
        "CITY",
        item.city||"UNKNOWN",
        "INFO",
        "⌂"
      );

      addResult(
        "COUNTRY",
        item.country||"UNKNOWN",
        "INFO",
        "◎"
      );

      addResult(
        "COORDINATES",
        `${item.lat}, ${item.lon}`,
        "INFO",
        "◉"
      );
    });

    createAddressGraph(results[0]);

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||"Ошибка соединения.",
      "ERROR",
      "!"
    );
  }
}

function createAddressGraph(data){

  if(!data)return;

  const center=getGraphCenter();

  let addressNode=Object.values(db.nodes)
    .find(n=>
      n.type==="ADDRESS" &&
      n.content===data.display_name
    );

  if(!addressNode){

    const id=createNode(
      "Address",
      "ADDRESS",
      data.display_name,
      center.x,
      center.y
    );

    addressNode=db.nodes[id];
  }

  const values=[
    ["City","CITY",data.city],
    ["Country","COUNTRY",data.country],
    ["Coordinates","COORDINATES",
      `${data.lat}, ${data.lon}`],
    ["Postcode","POSTCODE",data.postcode]
  ];

  let index=0;

  values.forEach(item=>{

    if(!item[2]||item[2]==="UNKNOWN")
      return;

    const angle=
      index*
      (Math.PI*2/values.length);

    const id=createNode(
      item[0],
      item[1],
      item[2],
      addressNode.x+
        Math.cos(angle)*230,
      addressNode.y+
        Math.sin(angle)*230
    );

    db.links.push({
      a:addressNode.id,
      b:id
    });

    index++;
  });

  saveDB();
  renderNodes();
  renderLines();
}

/* ==========================================================
   GEOSINT
========================================================== */

async function runGeoSINT(){

  if(!geoSelectedFile){

    toast("Сначала прикрепите фото");

    return;
  }

  $("toolRun").disabled=true;
  $("toolRun").textContent="ANALYZING...";
  $("toolResults").innerHTML="";

  addResult(
    "AI ANALYSIS",
    "Анализируем визуальные признаки изображения...",
    "INFO",
    "◆"
  );

  try{

    const form=new FormData();

    form.append(
      "photo",
      geoSelectedFile
    );

    /*
      Специальный промпт отправляется вместе
      с фотографией.

      AI должен оценивать только видимые признаки:
      архитектуру, дорожные знаки, ландшафт,
      язык вывесок, номера дорог, климат и т.д.

      Не запрашиваем личность человека
      или точный адрес частного объекта.
    */

    form.append(
      "prompt",
      `
You are the GeoSINT visual analysis module of NZX OSINT TOOL.

Analyze the attached image using ONLY visible evidence.

Return JSON with:
{
  "country": "",
  "city_estimate": "",
  "region_estimate": "",
  "environment": "",
  "visible_clues": [],
  "confidence": "low|medium|high"
}

Estimate the BROAD geographic area only.
Do not identify private people.
Do not infer a person's identity.
Do not claim an exact private address.
If the image does not contain enough evidence, return UNKNOWN.

Use visible clues such as:
- road signs
- public landmarks
- architecture
- terrain
- vegetation
- road markings
- public language/signage
- utility infrastructure
- climate
- public transport
- recognizable public places

Never invent clues that are not visible.
      `.trim()
    );

    const response=await fetch(
      "/api/geosint",
      {
        method:"POST",
        body:form
      }
    );

    let data=null;

    try{
      data=await response.json();
    }catch{
      data=null;
    }

    $("toolResults").innerHTML="";

    if(!response.ok){

      addResult(
        "GEOSINT ERROR",
        data?.error||
        ("HTTP "+response.status),
        "ERROR",
        "!"
      );

      return;
    }

    if(!data){

      addResult(
        "RESPONSE",
        "Backend не вернул результат.",
        "ERROR",
        "!"
      );

      return;
    }

    /*
      Поддержка как:
      {
        country,
        city_estimate,
        region_estimate...
      }

      так и:
      {
        result:{...}
      }
    */

    const r=data.result||data;

    addResult(
      "COUNTRY",
      r.country||"UNKNOWN",
      r.country&&r.country!=="UNKNOWN"
        ?"OK":"WARNING",
      "◎"
    );

    addResult(
      "CITY ESTIMATE",
      r.city_estimate||
      r.city||
      "UNKNOWN",
      r.city_estimate||r.city
        ?"INFO":"WARNING",
      "⌂"
    );

    addResult(
      "REGION",
      r.region_estimate||
      r.region||
      "UNKNOWN",
      "INFO",
      "⌖"
    );

    addResult(
      "ENVIRONMENT",
      r.environment||
      "UNKNOWN",
      "INFO",
      "◌"
    );

    if(
      Array.isArray(r.visible_clues) &&
      r.visible_clues.length
    ){

      addResult(
        "VISIBLE CLUES",
        r.visible_clues.join("\\n"),
        "INFO",
        "◆"
      );
    }

    if(r.latitude!==null && r.latitude!==undefined &&
       r.longitude!==null && r.longitude!==undefined &&
       !Number.isNaN(Number(r.latitude)) &&
       !Number.isNaN(Number(r.longitude))){

      addResult(
        "COORDINATES ESTIMATE",
        `${Number(r.latitude).toFixed(5)}, ${Number(r.longitude).toFixed(5)}`,
        "INFO",
        "◉"
      );
    }

    if(r.reasoning){
      addResult(
        "AI REASONING",
        r.reasoning,
        "INFO",
        "◇"
      );
    }

    addResult(
      "CONFIDENCE",
      r.confidence||"low",
      r.confidence==="high"
        ?"OK"
        :r.confidence==="medium"
          ?"WARNING"
          :"WARNING",
      "◈"
    );

    createGeoSINTGraph(geoSelectedFile,data);

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||
      "Не удалось связаться с GeoSINT backend.",
      "ERROR",
      "!"
    );

  }finally{

    $("toolRun").disabled=false;
    $("toolRun").textContent="ANALYZE";
  }
}

/* ==========================================================
   GEOSINT -> GRAPH
========================================================== */

function createGeoSINTGraph(file,data){
  if(!file || !data) return;

  const center=getGraphCenter();
  const r=data.result||data;
  const photoURL=$("geoPreview")?.src || "";

  const photoId=createNode(
    "GEOSINT PHOTO",
    "IMAGE",
    file.name||"Uploaded image",
    center.x-230,
    center.y,
    {photo:photoURL,photoOnly:true,geo:true}
  );

  const info=[
    ["COUNTRY",r.country],
    ["CITY ESTIMATE",r.city_estimate||r.city],
    ["REGION",r.region_estimate||r.region],
    ["ENVIRONMENT",r.environment],
    ["CONFIDENCE",r.confidence],
    ["VISIBLE CLUES",Array.isArray(r.visible_clues)?r.visible_clues.join(" • "):r.visible_clues]
  ].filter(x=>x[1]!==undefined && x[1]!==null && String(x[1]).trim() && String(x[1])!=="UNKNOWN");

  let previous=photoId;
  const radius=220;

  info.forEach((item,i)=>{
    const angle=(-Math.PI/2)+(i-Math.max(0,info.length-1)/2)*0.48;
    const id=createNode(
      item[0],
      item[0],
      String(item[1]),
      center.x+Math.cos(angle)*radius,
      center.y+Math.sin(angle)*radius,
      {geo:true}
    );
    db.links.push({a:previous,b:id});
    previous=id;
  });

  saveDB();
  renderNodes();
  renderLines();
  toast("GeoSINT добавлен на граф");
}

/* ==========================================================
   NODE MODAL
========================================================== */

let editingNode=null;

function openNodeModal(nodeId=null){

  editingNode=nodeId;

  $("nodeModalTitle").textContent=
    nodeId?"Edit Node":"New Node";

  if(nodeId){

    const node=db.nodes[nodeId];

    if(!node)return;

    $("nodeTitle").value=node.title||"";
    $("nodeType").value=node.type||"";
    $("nodeContent").value=node.content||"";

  }else{

    $("nodeTitle").value="";
    $("nodeType").value="";
    $("nodeContent").value="";
  }

  $("nodeModal").classList.add("open");
}

function closeNodeModal(){

  $("nodeModal").classList.remove("open");

  editingNode=null;
}

function saveNode(){

  const title=$("nodeTitle").value.trim();

  const type=$("nodeType")
    .value
    .trim()
    .toUpperCase();

  const content=$("nodeContent")
    .value
    .trim();

  if(!title){

    toast("Введите название");

    return;
  }

  if(editingNode){

    const node=db.nodes[editingNode];

    if(node){

      node.title=title;
      node.type=type||"UNKNOWN";
      node.content=content;
    }

  }else{

    const center=getGraphCenter();

    createNode(
      title,
      type||"UNKNOWN",
      content,
      center.x+(Math.random()-.5)*260,
      center.y+(Math.random()-.5)*180
    );
  }

  saveDB();

  renderNodes();
  renderLines();

  closeNodeModal();

  toast("Node saved");
}

/* ==========================================================
   GRAPH STATE
========================================================== */

const graph=$("graph");
const world=$("world");

let zoom=1;
let panX=0;
let panY=0;

let draggingNode=null;
let dragOffsetX=0;
let dragOffsetY=0;

let panning=false;
let panStartX=0;
let panStartY=0;

let linkSource=null;

function applyWorld(){

  world.style.transform=`
    translate(
      calc(-50% + ${panX}px),
      calc(-50% + ${panY}px)
    )
    scale(${zoom})
  `;
}

function getGraphCenter(){

  return{
    x:-panX/zoom,
    y:-panY/zoom
  };
}

/* ==========================================================
   RENDER NODES
========================================================== */

function renderNodes(){

  world.querySelectorAll(".node")
    .forEach(el=>el.remove());

  Object.values(db.nodes).forEach(node=>{

    const el=document.createElement("div");

    el.className="node";
    el.dataset.id=node.id;

    el.style.left=node.x+"px";
    el.style.top=node.y+"px";

    el.classList.toggle("geo-node", !!node.geo);
    el.classList.toggle("node-photo-only", !!node.photoOnly);

    el.innerHTML=`

      <button
        class="node-delete"
        title="Delete node"
      >×</button>

      ${node.photo ? `
        <div class="node-photo-wrap">
          <img class="node-photo" src="${node.photo}" alt="GeoSINT photo">
        </div>
      ` : ""}

      <div class="node-type">
        ${escapeHTML(node.type||"UNKNOWN")}
      </div>

      <div class="node-title">
        ${escapeHTML(node.title)}
      </div>

      <div class="node-content">
        ${escapeHTML(node.content)}
      </div>

      <div
        class="node-dot"
        title="Link node"
      ></div>
    `;

    world.appendChild(el);

    const deleteBtn=
      el.querySelector(".node-delete");

    deleteBtn.addEventListener(
      "pointerdown",
      event=>{
        event.stopPropagation();
      }
    );

    deleteBtn.addEventListener(
      "click",
      event=>{
        event.stopPropagation();
        deleteNode(node.id);
      }
    );

    const dot=
      el.querySelector(".node-dot");

    dot.addEventListener(
      "pointerdown",
      event=>{
        event.preventDefault();
        event.stopPropagation();
        startLinkDrag(event,node.id);
      },
      {passive:false}
    );

    el.addEventListener(
      "dblclick",
      event=>{

        if(
          event.target.closest(".node-delete")||
          event.target.closest(".node-dot")
        )
          return;

        openNodeModal(node.id);
      }
    );

    el.addEventListener(
      "pointerdown",
      event=>{

        if(
          event.target.closest(".node-delete")||
          event.target.closest(".node-dot")
        )
          return;

        startNodeDrag(
          event,
          node
        );
      }
    );
  });
}

/* ==========================================================
   NODE DRAGGING
========================================================== */

function startNodeDrag(event,node){

  event.preventDefault();
  event.stopPropagation();

  draggingNode=node;

  node._dragging=true;

  const rect=graph.getBoundingClientRect();

  const graphX=(
    event.clientX-
    rect.left-
    rect.width/2-
    panX
  )/zoom;

  const graphY=(
    event.clientY-
    rect.top-
    rect.height/2-
    panY
  )/zoom;

  dragOffsetX=node.x-graphX;
  dragOffsetY=node.y-graphY;

  const el=world.querySelector(
    `[data-id="${node.id}"]`
  );

  if(el)
    el.classList.add("dragging");

  if(event.pointerId!==undefined){

    try{
      graph.setPointerCapture(
        event.pointerId
      );
    }catch{}
  }

  window.addEventListener(
    "pointermove",
    moveNode,
    {passive:false}
  );

  window.addEventListener(
    "pointerup",
    stopNodeDrag,
    {once:true}
  );
}

function moveNode(event){

  if(!draggingNode)return;

  event.preventDefault();

  const rect=graph.getBoundingClientRect();

  const graphX=(
    event.clientX-
    rect.left-
    rect.width/2-
    panX
  )/zoom;

  const graphY=(
    event.clientY-
    rect.top-
    rect.height/2-
    panY
  )/zoom;

  draggingNode.x=
    graphX+dragOffsetX;

  draggingNode.y=
    graphY+dragOffsetY;

  const el=world.querySelector(
    `[data-id="${draggingNode.id}"]`
  );

  if(el){

    el.style.left=
      draggingNode.x+"px";

    el.style.top=
      draggingNode.y+"px";
  }

  renderLines();
}

function stopNodeDrag(){

  if(!draggingNode)return;

  const el=world.querySelector(
    `[data-id="${draggingNode.id}"]`
  );

  if(el)
    el.classList.remove("dragging");

  draggingNode._dragging=false;

  draggingNode=null;

  window.removeEventListener(
    "pointermove",
    moveNode
  );

  saveDB();

  renderLines();
}

/* ==========================================================
   DELETE NODE
========================================================== */

function deleteNode(id){

  const node=db.nodes[id];

  if(!node)return;

  if(!confirm(
    `Delete node "${node.title}"?`
  ))
    return;

  delete db.nodes[id];

  db.links=db.links.filter(
    link=>
      link.a!==id &&
      link.b!==id
  );

  if(linkSource===id)
    linkSource=null;

  saveDB();

  renderNodes();
  renderLines();

  toast("Node deleted");
}

/* ==========================================================
   LINKING
========================================================== */

let linkDrag=null;

function getGraphPoint(event){
  const rect=graph.getBoundingClientRect();
  return {
    x:(event.clientX-rect.left-rect.width/2-panX)/zoom,
    y:(event.clientY-rect.top-rect.height/2-panY)/zoom
  };
}

function getNodeElement(id){
  return world.querySelector(`[data-id="${CSS.escape(id)}"]`);
}

function startLinkDrag(event,id){
  const node=db.nodes[id];
  if(!node)return;

  linkDrag={
    source:id,
    pointerId:event.pointerId,
    x:node.x,
    y:node.y
  };

  linkSource=id;
  highlightNode(id);
  drawTemporaryLink(node.x,node.y,node.x,node.y);

  try{ graph.setPointerCapture(event.pointerId); }catch{}

  window.addEventListener("pointermove",moveLinkDrag,{passive:false});
  window.addEventListener("pointerup",finishLinkDrag,{once:true,passive:false});
  window.addEventListener("pointercancel",cancelLinkDrag,{once:true,passive:false});
}

function moveLinkDrag(event){
  if(!linkDrag)return;
  event.preventDefault();
  const point=getGraphPoint(event);
  linkDrag.x=point.x;
  linkDrag.y=point.y;
  const source=db.nodes[linkDrag.source];
  if(source)drawTemporaryLink(source.x,source.y,point.x,point.y);
}

function findNodeAtPoint(point){
  let closest=null;
  let best=Infinity;
  Object.values(db.nodes).forEach(node=>{
    if(node.id===linkDrag?.source)return;
    const dx=point.x-node.x;
    const dy=point.y-node.y;
    const distance=Math.hypot(dx,dy);
    if(distance<95 && distance<best){ closest=node; best=distance; }
  });
  return closest;
}

function finishLinkDrag(event){
  if(!linkDrag)return;
  event.preventDefault();
  const point=getGraphPoint(event);
  const target=findNodeAtPoint(point);
  const sourceId=linkDrag.source;

  if(target && target.id!==sourceId){
    const exists=db.links.some(link=>
      (link.a===sourceId&&link.b===target.id)||
      (link.a===target.id&&link.b===sourceId)
    );
    if(!exists){
      db.links.push({a:sourceId,b:target.id});
      saveDB();
      toast("Nodes linked");
    }else{
      toast("Link already exists");
    }
  }else{
    toast("Перетащи точку на другой узел");
  }

  cleanupLinkDrag();
  renderLines();
}

function cancelLinkDrag(){
  cleanupLinkDrag();
  renderLines();
}

function cleanupLinkDrag(){
  linkDrag=null;
  linkSource=null;
  clearHighlights();
  window.removeEventListener("pointermove",moveLinkDrag);
}

function drawTemporaryLink(x1,y1,x2,y2){
  const svg=$("lines");
  renderLines();

  const dx=x2-x1, dy=y2-y1;
  const length=Math.hypot(dx,dy)||1;
  const nx=-dy/length, ny=dx/length;
  const bend=Math.min(55,Math.max(20,length*.12));
  const cx=(x1+x2)/2+nx*bend;
  const cy=(y1+y2)/2+ny*bend;

  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("d",`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","rgba(255,255,255,.75)");
  path.setAttribute("stroke-width","2");
  path.setAttribute("stroke-dasharray","5 6");
  path.setAttribute("stroke-linecap","round");
  path.setAttribute("marker-end","url(#nzxArrowBright)");
  path.style.filter="drop-shadow(0 0 7px rgba(255,255,255,.35))";
  svg.appendChild(path);
}


function handleLinkDot(id){

  /* Legacy fallback: linking is now drag-to-node. */
  if(!linkSource){

    linkSource=id;

    highlightNode(id);

    toast("Select another node");

    return;
  }

  if(linkSource===id){

    linkSource=null;
    clearHighlights();

    return;
  }

  const exists=db.links.some(
    link=>
      (link.a===linkSource&&link.b===id)||
      (link.a===id&&link.b===linkSource)
  );

  if(!exists){

    db.links.push({
      a:linkSource,
      b:id
    });

    saveDB();

    renderLines();

    toast("Nodes linked");
  }

  linkSource=null;

  clearHighlights();
}

function highlightNode(id){

  clearHighlights();

  const el=world.querySelector(
    `[data-id="${id}"]`
  );

  if(el)
    el.classList.add("highlight");
}

function clearHighlights(){

  world.querySelectorAll(
    ".node.highlight"
  ).forEach(
    el=>el.classList.remove("highlight")
  );
}

/* ==========================================================
   BEAUTIFUL ANIMATED LINES
========================================================== */

function renderLines(){

  const svg=$("lines");

  svg.innerHTML="";

  const defs=document.createElementNS(
    "http://www.w3.org/2000/svg",
    "defs"
  );
  defs.innerHTML=`
    <marker id="nzxArrow" markerWidth="10" markerHeight="10"
      refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="rgba(255,255,255,.72)"></path>
    </marker>
    <marker id="nzxArrowBright" markerWidth="11" markerHeight="11"
      refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="rgba(255,255,255,.92)"></path>
    </marker>
  `;
  svg.appendChild(defs);

  db.links.forEach(link=>{

    const a=db.nodes[link.a];
    const b=db.nodes[link.b];

    if(!a||!b)return;

    const dx=b.x-a.x;
    const dy=b.y-a.y;

    const length=Math.sqrt(
      dx*dx+dy*dy
    );

    if(!length)return;

    const nx=-dy/length;
    const ny=dx/length;

    const bend=Math.min(
      55,
      Math.max(
        20,
        length*.12
      )
    );

    const mx=(a.x+b.x)/2;
    const my=(a.y+b.y)/2;

    const cx=mx+nx*bend;
    const cy=my+ny*bend;

    /*
      Glow under-line
    */

    const glow=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    glow.setAttribute(
      "d",
      `M ${a.x} ${a.y}
       Q ${cx} ${cy}
       ${b.x} ${b.y}`
    );

    glow.setAttribute(
      "fill",
      "none"
    );

    glow.setAttribute(
      "stroke",
      "rgba(255,255,255,.045)"
    );

    glow.setAttribute(
      "stroke-width",
      "5"
    );

    svg.appendChild(glow);

    /*
      Main animated line
    */

    const path=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );

    path.setAttribute(
      "d",
      `M ${a.x} ${a.y}
       Q ${cx} ${cy}
       ${b.x} ${b.y}`
    );

    path.setAttribute(
      "fill",
      "none"
    );

    path.setAttribute(
      "stroke",
      "rgba(255,255,255,.20)"
    );

    path.setAttribute(
      "stroke-width",
      "1.25"
    );

    path.setAttribute(
      "stroke-linecap",
      "round"
    );

    path.setAttribute(
      "marker-end",
      "url(#nzxArrow)"
    );

    path.setAttribute(
      "stroke-dasharray",
      "3 7"
    );

    path.style.animation=
      "dash 4.5s linear infinite";

    svg.appendChild(path);

    /*
      Tiny moving point
    */

    const dot=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "circle"
    );

    dot.setAttribute(
      "r",
      "1.8"
    );

    dot.setAttribute(
      "fill",
      "rgba(255,255,255,.65)"
    );

    const animate=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "animateMotion"
    );

    animate.setAttribute(
      "dur",
      `${2.8+Math.random()*2}s`
    );

    animate.setAttribute(
      "repeatCount",
      "indefinite"
    );

    const motionPath=document.createElementNS(
      "http://www.w3.org/2000/svg",
      "mpath"
    );

    const lineId=
      "line_"+Math.random()
        .toString(36)
        .slice(2);

    path.setAttribute(
      "id",
      lineId
    );

    motionPath.setAttribute(
      "href",
      "#"+lineId
    );

    animate.appendChild(
      motionPath
    );

    dot.appendChild(
      animate
    );

    svg.appendChild(dot);
  });
}

/* ==========================================================
   PAN / ZOOM
========================================================== */

graph.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest(".node")
    )
      return;

    panning=true;

    panStartX=
      event.clientX-panX;

    panStartY=
      event.clientY-panY;

    try{
      graph.setPointerCapture(
        event.pointerId
      );
    }catch{}
  }
);

graph.addEventListener(
  "pointermove",
  event=>{

    if(!panning)return;

    event.preventDefault();

    panX=
      event.clientX-panStartX;

    panY=
      event.clientY-panStartY;

    applyWorld();
  },
  {passive:false}
);

graph.addEventListener(
  "pointerup",
  ()=>{
    panning=false;
    saveDB();
  }
);

graph.addEventListener(
  "pointercancel",
  ()=>{
    panning=false;
  }
);

graph.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();

    zoom+=
      event.deltaY<0
        ? .08
        : -.08;

    zoom=Math.max(
      .35,
      Math.min(2.5,zoom)
    );

    applyWorld();

  },
  {passive:false}
);

function centerGraph(){

  zoom=1;
  panX=0;
  panY=0;

  applyWorld();

  toast("Graph centered");
}

/* ==========================================================
   SEARCH
========================================================== */

$("chainSearch").addEventListener(
  "input",
  event=>{

    const query=event.target.value
      .trim()
      .toLowerCase();

    world.querySelectorAll(".node")
      .forEach(el=>{

        const node=db.nodes[
          el.dataset.id
        ];

        if(!query){

          el.classList.remove(
            "highlight"
          );

          return;
        }

        const text=(
          node.title+
          " "+
          node.type+
          " "+
          node.content
        ).toLowerCase();

        el.classList.toggle(
          "highlight",
          text.includes(query)
        );
      });
  }
);

/* ==========================================================
   SATURN PARTICLES
========================================================== */

const canvas=$("saturn");
const ctx=canvas.getContext("2d");

let particles=[];
let rotation=0;

function resizeSaturn(){

  const rect=canvas.getBoundingClientRect();

  const dpr=window.devicePixelRatio||1;

  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  createParticles(
    rect.width,
    rect.height
  );
}

function createParticles(width,height){

  particles=[];

  const count=1100;

  const radius=Math.min(
    width,
    height
  )*.28;

  for(let i=0;i<count;i++){

    const u=Math.random()*2-1;

    const angle=
      Math.random()*Math.PI*2;

    const r=Math.sqrt(
      1-u*u
    );

    particles.push({

      x:r*Math.cos(angle),
      y:u,
      z:r*Math.sin(angle),

      size:.45+
        Math.random()*1.15,

      alpha:.15+
        Math.random()*.65
    });
  }
}

function drawSaturn(){

  const width=canvas.clientWidth;
  const height=canvas.clientHeight;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  const cx=width/2;
  const cy=height/2;

  const radius=Math.min(
    width,
    height
  )*.28;

  rotation+=.00065;

  const c=Math.cos(rotation);
  const s=Math.sin(rotation);

  for(const p of particles){

    const x=
      p.x*c-
      p.z*s;

    const z=
      p.x*s+
      p.z*c;

    const scale=
      .55+
      (z+1)*.23;

    const px=
      cx+
      x*radius*scale;

    const py=
      cy+
      p.y*radius*scale;

    const alpha=Math.max(
      .04,
      p.alpha*
      (.45+(z+1)*.28)
    );

    ctx.beginPath();

    ctx.arc(
      px,
      py,
      p.size*scale,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      `rgba(255,255,255,${alpha})`;

    ctx.fill();
  }

  requestAnimationFrame(
    drawSaturn
  );
}

window.addEventListener(
  "resize",
  resizeSaturn
);

/* ==========================================================
   SATURN RING
========================================================== */

let ringTime=0;

function animateRing(){

  ringTime+=.016;

  const degrees=
    (ringTime*.75)%360;

  $("saturnRing").style.transform=`
    translate(-50%,-50%)
    rotateX(67deg)
    rotateZ(${-15+degrees}deg)
  `;

  requestAnimationFrame(
    animateRing
  );
}

/* ==========================================================
   INIT
========================================================== */

function init(){

  updateProfileUI();

  applyWorld();

  renderNodes();

  renderLines();

  resizeSaturn();

  drawSaturn();

  animateRing();
}

init();
