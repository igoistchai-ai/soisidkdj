<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NZX OSINT TOOL</title>

<style>
:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.92);
  --card:#111;
  --text:#f5f5f5;
  --muted:#777;
  --dim:#444;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
  --good:#d9ffd9;
  --warn:#ffe7a3;
  --bad:#ff9b9b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{font:inherit}
button{color:inherit;border:0}

.app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:70px;
  flex:none;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  border-bottom:1px solid var(--line);
  background:rgba(5,5,5,.88);
  backdrop-filter:blur(25px);
  z-index:100;
}

.logo{
  width:43px;
  height:43px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#050505;
  font-weight:1000;
  font-size:20px;
}

.brand b{
  display:block;
  font-size:14px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  margin-top:2px;
  color:#555;
  font-size:8px;
  letter-spacing:2px;
}

.top-tools{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.top-btn{
  height:38px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0e0e0e;
  color:#aaa;
  cursor:pointer;
  font-size:10px;
  font-weight:800;
  letter-spacing:.8px;
  transition:.2s;
}

.top-btn:hover{
  color:#fff;
  border-color:var(--line2);
  background:#151515;
}

.profile-mini{
  width:40px;
  height:40px;
  margin-left:8px;
  padding:0;
  border:1px solid var(--line2);
  border-radius:50%;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}

.profile-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.body{
  flex:1;
  min-height:0;
  display:flex;
}

.sidebar{
  width:70px;
  flex:none;
  border-right:1px solid var(--line);
  background:#070707;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:13px 8px;
  z-index:80;
}

.side-btn{
  width:48px;
  height:48px;
  margin-bottom:7px;
  border-radius:12px;
  border:1px solid transparent;
  background:transparent;
  color:#555;
  cursor:pointer;
  font-size:17px;
  transition:.2s;
}

.side-btn:hover{
  color:#fff;
  background:#111;
}

.side-btn.active{
  color:#fff;
  border-color:var(--line);
  background:#111;
}

.main{
  position:relative;
  flex:1;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

.page{
  position:absolute;
  inset:0;
  display:none;
}

.page.active{
  display:block;
  animation:pageIn .25s ease;
}

@keyframes pageIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

/* SATURN */

.saturn{
  position:absolute;
  width:720px;
  height:720px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.48;
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:74%;
  height:24%;
  transform:translate(-50%,-50%) rotateX(67deg) rotateZ(-15deg);
  border:1px solid rgba(220,220,220,.15);
  border-radius:50%;
  box-shadow:
    0 0 0 8px rgba(255,255,255,.012),
    0 0 35px rgba(255,255,255,.04);
}

/* GRAPH */

.chain-page{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.chain-toolbar{
  position:absolute;
  left:16px;
  right:16px;
  top:15px;
  height:52px;
  z-index:30;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(8,8,8,.82);
  backdrop-filter:blur(20px);
}

.chain-search{
  flex:1;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:0 10px;
}

.chain-search::placeholder{color:#555}

.graph{
  position:absolute;
  inset:0;
  overflow:hidden;
  cursor:grab;
  background-image:
    linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,30px 30px;
}

.graph.dragging{cursor:grabbing}

.world{
  position:absolute;
  width:1px;
  height:1px;
  left:0;
  top:0;
  transform-origin:0 0;
}

.lines{
  position:absolute;
  left:-5000px;
  top:-5000px;
  width:10000px;
  height:10000px;
  overflow:visible;
  pointer-events:none;
}

.edge{
  fill:none;
  stroke:rgba(220,220,220,.32);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;
}

.edge-glow{
  fill:none;
  stroke:rgba(255,255,255,.035);
  stroke-width:9;
  vector-effect:non-scaling-stroke;
}

.node{
  position:absolute;
  width:225px;
  min-height:106px;
  transform:translate(-50%,-50%);
  user-select:none;
  animation:nodeIn .4s cubic-bezier(.16,1,.3,1);
}

@keyframes nodeIn{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
    filter:blur(4px);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:none;
  }
}

.node-card{
  position:relative;
  min-height:106px;
  padding:16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(24,24,24,.98),rgba(9,9,9,.98));
  box-shadow:
    0 22px 60px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.04);
  cursor:grab;
  transition:.2s;
}

.node-card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.28);
}

.node.moving .node-card{
  transform:scale(1.04);
  border-color:#fff;
}

.node-title{
  font-weight:850;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.node-type{
  display:inline-flex;
  margin-top:7px;
  padding:3px 7px;
  border-radius:6px;
  background:#1b1b1b;
  color:#888;
  font-size:8px;
  letter-spacing:1px;
}

.node-content{
  margin-top:8px;
  color:#777;
  font-size:12px;
  line-height:1.45;
  max-height:45px;
  overflow:hidden;
  white-space:pre-line;
  word-break:break-word;
}

.node-dot{
  position:absolute;
  right:-7px;
  top:50%;
  width:13px;
  height:13px;
  transform:translateY(-50%);
  border-radius:50%;
  background:#111;
  border:2px solid #888;
  box-shadow:0 0 0 5px #070707;
  z-index:5;
}

.node.near .node-dot{
  background:#fff;
  border-color:#fff;
  box-shadow:
    0 0 0 5px #070707,
    0 0 22px rgba(255,255,255,.7);
}

.node-found .node-card{
  animation:foundPulse 1s ease 3;
  border-color:#fff;
}

@keyframes foundPulse{
  50%{
    box-shadow:
      0 0 0 3px rgba(255,255,255,.12),
      0 0 50px rgba(255,255,255,.12);
  }
}

.node-delete{
  position:absolute;
  right:8px;
  top:8px;
  width:23px;
  height:23px;
  border-radius:7px;
  background:#000;
  color:#777;
  cursor:pointer;
  opacity:0;
}

.node-card:hover .node-delete{opacity:1}

/* MODAL */

.tool-modal{
  position:fixed;
  inset:0;
  z-index:450;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(14px);
  padding:20px;
}

.tool-modal.show{display:grid}

.modal-box{
  width:min(510px,100%);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;
  background:linear-gradient(145deg,#151515,#090909);
  box-shadow:0 35px 120px rgba(0,0,0,.75);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:translateY(15px) scale(.97)}
  to{opacity:1;transform:none}
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-top h2{
  margin:0;
  font-size:19px;
}

.close{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#111;
  color:#777;
  cursor:pointer;
}

.modal-description{
  color:#666;
  font-size:11px;
  line-height:1.5;
  margin-bottom:15px;
}

.modal-input{
  width:100%;
  height:50px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:#070707;
  color:#fff;
}

.modal-input:focus{border-color:var(--line2)}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  height:43px;
  flex:1;
  border-radius:10px;
  cursor:pointer;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
}

.modal-actions button.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
}

.results{
  margin-top:17px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.result{
  min-height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d0d0d;
  animation:resultIn .25s ease;
}

@keyframes resultIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.result-icon{
  width:34px;
  height:34px;
  flex:none;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#181818;
  color:#aaa;
  font-size:11px;
  font-weight:900;
}

.result-main{
  flex:1;
  min-width:0;
}

.result-main b{
  display:block;
  font-size:12px;
}

.result-main small{
  display:block;
  margin-top:3px;
  color:#777;
  font-size:10px;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.45;
}

.result-status{
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  flex:none;
}

.status-found{color:var(--good)}
.status-unknown{color:var(--warn)}
.status-error{color:var(--bad)}
.status-info{color:#aaa}

/* PROFILE */

.profile{
  position:absolute;
  inset:0;
  overflow:auto;
  padding:40px;
}

.profile-card{
  width:min(720px,100%);
  margin:auto;
  padding:25px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#0c0c0c;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
}

.profile-avatar{
  width:88px;
  height:88px;
  flex:none;
  object-fit:cover;
  border-radius:50%;
  border:1px solid var(--line2);
  background:#151515;
}

.profile-info h1{
  margin:0;
  font-size:23px;
}

.profile-info p{
  margin:5px 0 0;
  color:#666;
}

.profile-actions{
  margin-top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.profile-button{
  height:40px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
  cursor:pointer;
}

.profile-button.primary{
  background:#fff;
  color:#000;
}

/* NODE MODAL */

#nodeModal{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(10px);
  padding:20px;
}

.node-modal-box{
  width:min(450px,100%);
  padding:23px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(145deg,#151515,#0b0b0b);
  box-shadow:0 35px 100px #000;
}

.field{margin-top:13px}

.field label{
  display:block;
  margin-bottom:7px;
  color:#666;
  font-size:9px;
  letter-spacing:1px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#080808;
  color:#fff;
  border-radius:11px;
  padding:12px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  height:39px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
  cursor:pointer;
}

.btn:hover{
  color:#fff;
  border-color:var(--line2);
}

.btn.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
  font-weight:850;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:700;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 16px;
  border-radius:999px;
  background:#fff;
  color:#050505;
  font-size:10px;
  font-weight:850;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:760px){

  .topbar{height:62px}

  .brand small{display:none}

  .brand b{font-size:11px}

  .top-tools{display:none}

  .sidebar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:57px;
    flex-direction:row;
    justify-content:space-around;
    padding:4px;
    border-right:0;
    border-top:1px solid var(--line);
    z-index:300;
  }

  .side-btn{
    margin:0;
    height:48px;
  }

  .main{padding-bottom:57px}

  .saturn{
    width:520px;
    height:520px;
  }

  .chain-toolbar{
    left:9px;
    right:9px;
    top:9px;
  }

  .profile{padding:20px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="logo">N</div>

  <div class="brand">
    <b>NZX OSINT TOOL</b>
    <small>INTELLIGENCE WORKSPACE</small>
  </div>

  <div class="top-tools">

    <button class="top-btn" onclick="openTool('phone')">
      CHECK NUMBER
    </button>

    <button class="top-btn" onclick="openTool('email')">
      CHECK GMAIL
    </button>

    <button class="top-btn" onclick="openTool('address')">
      CHECK ADDRESS
    </button>

  </div>

  <button class="profile-mini" onclick="openProfile()">
    <img id="miniAvatar" alt="">
  </button>

</header>

<div class="body">

<aside class="sidebar">

  <button
    class="side-btn active"
    data-page="chain"
    onclick="showPage('chain')">
    ⌘
  </button>

  <button
    class="side-btn"
    data-page="profile"
    onclick="openProfile()">
    ◎
  </button>

</aside>

<main class="main">

<section class="page active" id="page-chain">

  <div class="chain-page">

    <div class="chain-toolbar">

      <input
        class="chain-search"
        id="chainSearch"
        placeholder="Search chain or node...">

      <button class="btn" onclick="openNodeModal()">
        ＋ Node
      </button>

      <button class="btn" onclick="centerGraph()">
        ⌂
      </button>

    </div>

    <div class="graph" id="graph">

      <div class="saturn">
        <canvas id="saturn"></canvas>
        <div class="saturn-ring" id="saturnRing"></div>
      </div>

      <div class="world" id="world">

        <svg
          class="lines"
          id="lines"
          viewBox="-5000 -5000 10000 10000">
        </svg>

      </div>

    </div>

  </div>

</section>

<section class="page" id="page-profile">

  <div class="profile">

    <div class="profile-card">

      <div class="profile-head">

        <img
          class="profile-avatar"
          id="profileAvatar"
          alt="">

        <div class="profile-info">

          <h1 id="profileName">
            NZX User
          </h1>

          <p id="profileUsername">
            @nzx_user
          </p>

        </div>

      </div>

      <div class="profile-actions">

        <button
          class="profile-button primary"
          onclick="chooseAvatar()">
          Choose avatar
        </button>

        <button
          class="profile-button"
          onclick="editProfileName()">
          Edit name
        </button>

        <button
          class="profile-button"
          onclick="showPage('chain')">
          Back to Chain
        </button>

      </div>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
        style="display:none">

    </div>

  </div>

</section>

</main>
</div>
</div>

<!-- TOOL MODAL -->

<div
  class="tool-modal"
  id="toolModal"
  onclick="outsideToolModal(event)">

  <div
    class="modal-box"
    onclick="event.stopPropagation()">

    <div class="modal-top">

      <h2 id="toolTitle">
        Check
      </h2>

      <button
        class="close"
        onclick="closeTool()">
        ×
      </button>

    </div>

    <div
      class="modal-description"
      id="toolDescription">
    </div>

    <input
      class="modal-input"
      id="toolInput"
      autocomplete="off">

    <div class="modal-actions">

      <button onclick="closeTool()">
        CLOSE
      </button>

      <button
        class="primary"
        id="toolRun"
        onclick="runTool()">
        CHECK
      </button>

    </div>

    <div
      class="results"
      id="toolResults">
    </div>

  </div>
</div>

<!-- NODE MODAL -->

<div id="nodeModal">

  <div class="node-modal-box">

    <h2
      id="nodeModalTitle"
      style="margin:0 0 18px">
      New Node
    </h2>

    <div class="field">
      <label>NAME</label>
      <input
        id="nodeTitle"
        placeholder="Username">
    </div>

    <div class="field">
      <label>TYPE</label>
      <input
        id="nodeType"
        placeholder="EMAIL / USERNAME / LOCATION">
    </div>

    <div class="field">
      <label>CONTENT</label>
      <textarea
        id="nodeContent"
        placeholder="Information..."></textarea>
    </div>

    <div
      style="display:flex;gap:8px;margin-top:17px">

      <button
        class="btn"
        style="margin-left:auto"
        onclick="closeNodeModal()">
        Cancel
      </button>

      <button
        class="btn primary"
        onclick="saveNode()">
        Save
      </button>

    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   DATABASE
========================================================= */

const STORAGE_KEY="nzx-osint-real-v3";

let db={
  nodes:{},
  links:[],
  profile:{
    name:"NZX User",
    username:"nzx_user",
    avatar:""
  },
  searches:0
};

try{

  const saved=
    localStorage.getItem(STORAGE_KEY);

  if(saved){

    const parsed=
      JSON.parse(saved);

    if(parsed){

      db=Object.assign(
        db,
        parsed
      );

      if(!db.nodes) db.nodes={};
      if(!db.links) db.links=[];
      if(!db.profile) db.profile={
        name:"NZX User",
        username:"nzx_user",
        avatar:""
      };
    }
  }

}catch(e){
  console.warn(e);
}

function saveDB(){

  try{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(db)
    );
  }catch(e){
    console.warn(e);
  }
}

const $=id=>
  document.getElementById(id);

function escapeHTML(value){

  const div=
    document.createElement("div");

  div.textContent=
    value==null
    ?""
    :String(value);

  return div.innerHTML;
}

function objectToText(value){

  if(value===null)
    return "null";

  if(value===undefined)
    return "undefined";

  if(typeof value==="string")
    return value;

  if(
    typeof value==="number"||
    typeof value==="boolean"
  )
    return String(value);

  try{
    return JSON.stringify(
      value,
      null,
      2
    );
  }catch(e){
    return String(value);
  }
}

function uid(){

  return "node_"+
    Date.now().toString(36)+
    "_"+
    Math.random()
      .toString(36)
      .slice(2,8);
}

function toast(message){

  const el=$("toast");

  el.textContent=
    String(message);

  el.classList.add("show");

  clearTimeout(
    toast.timer
  );

  toast.timer=
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      1800
    );
}

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(
      p=>p.classList.remove("active")
    );

  const target=
    $("page-"+page);

  if(target)
    target.classList.add("active");

  document
    .querySelectorAll(".side-btn")
    .forEach(
      btn=>{
        btn.classList.toggle(
          "active",
          btn.dataset.page===page
        );
      }
    );
}

    placeholder:"+374 XX XXX XXX",

    50

  $("toolModal")
    .classList.remove("show");

  currentTool=null;
}

function outsideToolModal(e){

  if(e.target.id==="toolModal")
    closeTool();
}

/* =========================================================
   RESULT
========================================================= */

function addResult(
  title,
  value,
  status="UNKNOWN",
  icon="?"
){

  const el=
    document.createElement("div");

  el.className="result";

  let cls="status-unknown";

  if(status==="FOUND")
    cls="status-found";

  if(status==="ERROR")
    cls="status-error";

  if(status==="INFO")
    cls="status-info";

  el.innerHTML=`
    <div class="result-icon">
      ${escapeHTML(icon)}
    </div>

    <div class="result-main">
      <b>${escapeHTML(title)}</b>
      <small>${escapeHTML(value)}</small>
    </div>

    <span class="result-status ${cls}">
      ${escapeHTML(status)}
    </span>
  `;

  $("toolResults")
    .appendChild(el);
}

async function runTool(){

  if(!currentTool)
    return;

  const value=
    $("toolInput")
      .value
      .trim();

  $("toolResults").innerHTML="";

  if(!value){

    addResult(
      "INPUT",
      "Введите значение.",
      "ERROR",
      "!"
    );

    return;
  }

  db.searches++;
  saveDB();

  if(currentTool==="phone"){
    await checkPhoneReal(value);
    return;
  }

  if(currentTool==="email"){
    await checkEmailReal(value);
    return;
  }

  if(currentTool==="address"){
    await checkAddressReal(value);
    return;
  }
}

window.runTool=runTool;

/* =========================================================
   PHONE
   JSON -> FORM FALLBACK
========================================================= */

async function checkPhoneReal(value){

  addResult(
    "REQUEST",
    "Проверка номера...",
    "INFO",
    "•"
  );

  let response=null;
  let data=null;

  try{

    /* FIRST: JSON */

    response=
      await fetch(
        "/api/osint/phone",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },
          body:JSON.stringify({
            phone:value
          })
        }
      );

    try{
      data=await response.json();
    }catch(e){
      data=null;
    }

    /*
      Если backend отвечает 422,
      пробуем form-urlencoded.
      Это закрывает случай, когда
      main.py использует Form(...).
    */

    if(response.status===422){

      response=
        await fetch(
          "/api/osint/phone",
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded",
              "Accept":
                "application/json"
            },
            body:
              "phone="+
              encodeURIComponent(value)
          }
        );

      try{
        data=await response.json();
      }catch(e){
        data=null;
      }
    }

    $("toolResults").innerHTML="";

    /* ERROR */

    if(!response.ok){

      let errorText=
        `HTTP ${response.status}`;

      if(data){

        if(Array.isArray(data)){

          errorText=
            data
              .map(item=>{

                if(
                  !item||
                  typeof item!=="object"
                ){
                  return String(item);
                }

                const loc=
                  Array.isArray(item.loc)
                  ?item.loc.join(" → ")
                  :"";

                const msg=
                  item.msg||
                  "";

                return loc
                  ?`${loc}: ${msg}`
                  :msg;

              })
              .join("\n");

        }else if(
          typeof data.detail==="string"
        ){

          errorText=
            data.detail;

        }else if(
          data.detail!==undefined
        ){

          errorText=
            objectToText(
              data.detail
            );

        }else if(
          data.message!==undefined
        ){

          errorText=
            objectToText(
              data.message
            );

        }else{

          errorText=
            objectToText(data);
        }
      }

      addResult(
        "BACKEND ERROR",
        errorText,
        "ERROR",
        "!"
      );

      return;
    }

    /* SUCCESS */

    if(!data){

      addResult(
        "RESPONSE",
        "Backend не вернул JSON.",
        "ERROR",
        "!"
      );

      return;
    }

    renderBackendObject(data);

    createPhoneGraph(data);

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||
      "Не удалось связаться с backend.",
      "ERROR",
      "!"
    );
  }
}

/* =========================================================
   PHONE GRAPH
========================================================= */

function createPhoneGraph(data){

  if(
    !data||
    typeof data!=="object"
  )
    return;

  if(
    data.ok===false||
    data.success===false
  )
    return;

  const phone=
    data.phone||
    data.international||
    data.national;

  if(!phone)
    return;

  const center=
    screenToWorld(
      graph.clientWidth/2,
      graph.clientHeight/2
    );

  const created=[];

  function findExisting(
    type,
    content
  ){

    if(
      content===null||
      content===undefined
    )
      return null;

    const wanted=
      String(content)
        .trim()
        .toLowerCase();

    if(!wanted)
      return null;

    const found=
      Object.values(db.nodes)
      .find(
        n=>
          String(n.type||"")
            .trim()
            .toLowerCase()===
          String(type)
            .trim()
            .toLowerCase()
          &&
          String(n.content||"")
            .trim()
            .toLowerCase()===
          wanted
      );

    return found||null;
  }

  function makeNode(
    title,
    type,
    content,
    index
  ){

    if(
      content===null||
      content===undefined
    )
      return null;

    const text=
      String(content).trim();

    if(!text)
      return null;

    const existing=
      findExisting(
        type,
        text
      );

    if(existing)
      return existing.id;

    const id=uid();

    let x=center.x;
    let y=center.y;

    if(index>0){

      const angle=
        (index-1)*
        (Math.PI*2/8);

      const radius=
        280+
        Math.min(index*18,120);

      x+=Math.cos(angle)*radius;
      y+=Math.sin(angle)*radius;
    }

    db.nodes[id]={
      id:id,
      title:String(title),
      type:String(type),
      content:text,
      x:x,
      y:y
    };

    created.push(id);

    return id;
  }

  const phoneId=
    makeNode(
      "Phone Number",
      "PHONE",
      phone,
      0
    );

  let i=1;

  const countryId=
    makeNode(
      "Country",
      "COUNTRY",
      data.country,
      i++
    );

  const regionId=
    makeNode(
      "Region",
      "REGION",
      data.region,
      i++
    );

  const cityId=
    makeNode(
      "Approx. City",
      "CITY",
      data.approx_city,
      i++
    );

  const validId=
    data.valid!==undefined
    ?makeNode(
      "Number Valid",
      "VALID",
      String(data.valid),
      i++
    )
    :null;

  const possibleId=
    data.possible!==undefined
    ?makeNode(
      "Number Possible",
      "POSSIBLE",
      String(data.possible),
      i++
    )
    :null;

  const carrierId=
    makeNode(
      "Carrier",
      "CARRIER",
      data.carrier,
      i++
    );

  const nationalId=
    makeNode(
      "National Format",
      "NATIONAL",
      data.national,
      i++
    );

  const internationalId=
    makeNode(
      "International Format",
      "INTERNATIONAL",
      data.international,
      i++
    );

  const codeId=
    data.country_code!==undefined
    ?makeNode(
      "Country Code",
      "COUNTRY CODE",
      "+"+String(data.country_code),
      i++
    )
    :null;

  if(phoneId){

    [
      countryId,
      regionId,
      cityId,
      validId,
      possibleId,
      carrierId,
      nationalId,
      internationalId,
      codeId
    ].forEach(
      id=>{
        if(
          id&&
          !linked(
            phoneId,
            id
          )
        ){
          connect(
            phoneId,
            id
          );
        }
      }
    );
  }

  saveDB();

  renderAll();

  created.forEach(
    id=>{

      const el=
        document.querySelector(
          `.node[data-id="${id}"]`
        );

      if(el){

        el.classList.add(
          "node-found"
        );

        setTimeout(
          ()=>{
            el.classList.remove(
              "node-found"
            );
          },
          3000
        );
      }
    }
  );

  if(created.length)
    toast("Phone data added to graph");
}

/* =========================================================
   BACKEND RENDER
========================================================= */

function renderBackendObject(data){

  if(
    data===null||
    data===undefined
  ){

    addResult(
      "BACKEND RESPONSE",
      "Пустой ответ.",
      "UNKNOWN",
      "?"
    );

    return;
  }

  if(typeof data!=="object"){

    addResult(
      "BACKEND RESPONSE",
      String(data),
      "INFO",
      "{"
    );

    return;
  }

  let rendered=false;

  Object.entries(data)
    .forEach(
      ([key,value])=>{

        if(
          value===null||
          value===undefined
        )
          return;

        if(
          key==="services"&&
          Array.isArray(value)
        ){

          value.forEach(
            service=>{

              if(
                !service||
                typeof service!=="object"
              )
                return;

              const name=
                service.service||
                service.name||
                "SERVICE";

              const raw=
                String(
                  service.status||
                  "UNKNOWN"
                ).toUpperCase();

              let status="UNKNOWN";

              if(raw==="FOUND")
                status="FOUND";

              if(raw==="ERROR")
                status="ERROR";

              if(raw==="INFO")
                status="INFO";

              const detail=
                service.detail??
                service.message??
                service.url??
                "No additional data";

              addResult(
                name,
                objectToText(detail),
                status,
                String(name)[0]||"?"
              );

              rendered=true;
            }
          );

          return;
        }

        let valueText=
          objectToText(value);

        let status="INFO";

        const upper=
          String(value).toUpperCase();

        if(
          upper==="TRUE"||
          upper==="FOUND"
        )
          status="FOUND";

        if(upper==="UNKNOWN")
          status="UNKNOWN";

        addResult(
          key
            .replace(/_/g," ")
            .toUpperCase(),
          valueText,
          status,
          key[0]||"?"
        );

        rendered=true;
      }
    );

  if(!rendered){

    addResult(
      "BACKEND RESPONSE",
      objectToText(data),
      "INFO",
      "{"
    );
  }
}

async function checkEmailReal(value){

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)
  ){

    addResult(
      "EMAIL",
      "Неверный формат email.",
      "ERROR",
      "!"
    );

    return;
  }

  addResult(
    "REQUEST",
    "Проверка email...",
    "INFO",
    "•"
  );

  try{

    const response=
      await fetch(
        "/api/osint/email",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Accept":"application/json"
          },
          body:JSON.stringify({
            email:value
          })
        }
      );

    let data=null;

    try{
      data=await response.json();
    }catch(e){}

    $("toolResults").innerHTML="";

    if(!response.ok){

      let msg=
        `HTTP ${response.status}`;

      if(data){

        if(
          typeof data.detail==="string"
        ){
          msg=data.detail;
        }else if(
          data.detail!==undefined
        ){
          msg=objectToText(
            data.detail
          );
        }else{
          msg=objectToText(data);
        }
      }

      addResult(
        "BACKEND ERROR",
        msg,
        "ERROR",
        "!"
      );

      return;
    }

    renderBackendObject(data);

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||
      "Не удалось связаться с backend.",
      "ERROR",
      "!"
    );
  }
}

/* =========================================================
   ADDRESS
========================================================= */

async function checkAddressReal(value){

  addResult(
    "REQUEST",
    "Поиск координат...",
    "INFO",
    "•"
  );

  try{

    const coords=
      value.match(
        /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/
      );

    let url;

    if(coords){

      const lat=
        parseFloat(coords[1]);

      const lon=
        parseFloat(coords[2]);

      if(
        lat<-90||
        lat>90||
        lon<-180||
        lon>180
      ){

        $("toolResults").innerHTML="";

        addResult(
          "COORDINATES",
          "Неверные координаты.",
          "ERROR",
          "!"
        );

        return;
      }

      url=
        "https://nominatim.openstreetmap.org/reverse"+
        "?format=jsonv2"+
        "&lat="+encodeURIComponent(lat)+
        "&lon="+encodeURIComponent(lon)+
        "&addressdetails=1";

    }else{

      url=
        "https://nominatim.openstreetmap.org/search"+
        "?format=jsonv2"+
        "&limit=1"+
        "&addressdetails=1"+
        "&q="+encodeURIComponent(value);
    }

    const response=
      await fetch(
        url,
        {
          headers:{
            "Accept":"application/json"
          }
        }
      );

    if(!response.ok){

      $("toolResults").innerHTML="";

      addResult(
        "GEOCODING ERROR",
        `HTTP ${response.status}`,
        "ERROR",
        "!"
      );

      return;
    }

    const data=
      await response.json();

    $("toolResults").innerHTML="";

    const place=
      Array.isArray(data)
      ?data[0]
      :data;

    if(!place){

      addResult(
        "LOCATION",
        "Адрес не найден.",
        "UNKNOWN",
        "?"
      );

      return;
    }

    addResult(
      "DISPLAY NAME",
      place.display_name||
      place.name||
      "UNKNOWN",
      "FOUND",
      "⌖"
    );

    if(place.lat!=null){

      addResult(
        "LATITUDE",
        String(place.lat),
        "FOUND",
        "N"
      );
    }

    if(place.lon!=null){

      addResult(
        "LONGITUDE",
        String(place.lon),
        "FOUND",
        "E"
      );
    }

    if(place.type){

      addResult(
        "TYPE",
        String(place.type),
        "FOUND",
        "T"
      );
    }

    if(place.address){

      const details=
        Object.entries(place.address)
        .map(
          ([key,val])=>
            `${key}: ${val}`
        )
        .join(" · ");

      if(details){

        addResult(
          "ADDRESS DETAILS",
          details,
          "FOUND",
          "A"
        );
      }
    }

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      error?.message||
      "Не удалось выполнить геопоиск.",
      "ERROR",
      "!"
    );
  }
}

/* =========================================================
   GRAPH
========================================================= */

const graph=$("graph");
const world=$("world");
const lines=$("lines");

let scale=1;
let panX=0;
let panY=0;

let draggingNode=null;
let draggingCanvas=null;
let linking=null;
let nearest=null;

function screenToWorld(x,y){

  const r=
    graph.getBoundingClientRect();

  return {
    x:(x-r.left-panX)/scale,
    y:(y-r.top-panY)/scale
  };
}

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function linked(a,b){

  return db.links.some(
    l=>
      (l.a===a&&l.b===b)||
      (l.a===b&&l.b===a)
  );
}

function connect(a,b){

  if(!a||!b||a===b)
    return;

  if(linked(a,b))
    return;

  db.links.push({
    a:a,
    b:b
  });

  saveDB();
}

function closestNode(x,y,ignore){

  let result=null;
  let min=Infinity;

  Object.values(db.nodes)
    .forEach(
      n=>{

        if(n.id===ignore)
          return;

        const d=
          distance(
            {x:x,y:y},
            n
          );

        if(d<min){

          min=d;
          result=n;
        }
      }
    );

  if(!result)
    return null;

  return {
    node:result,
    dist:min
  };
}

function renderNodes(){

  document
    .querySelectorAll(".node")
    .forEach(
      el=>el.remove()
    );

  Object.values(db.nodes)
    .forEach(
      n=>{

        const el=
          document.createElement("div");

        el.className="node";
        el.dataset.id=n.id;

        el.style.left=
          n.x+"px";

        el.style.top=
          n.y+"px";

        el.innerHTML=`

          <div class="node-card">

            <button class="node-delete">
              ×
            </button>

            <div class="node-title">
              ${escapeHTML(n.title)}
            </div>

            <div class="node-type">
              ${escapeHTML(n.type||"NODE")}
            </div>

            <div class="node-content">
              ${escapeHTML(n.content||"No data")}
            </div>

          </div>

          <div class="node-dot"></div>
        `;

        world.appendChild(el);

        const card=
          el.querySelector(".node-card");

        const dot=
          el.querySelector(".node-dot");

        const del=
          el.querySelector(".node-delete");

        card.addEventListener(
          "pointerdown",
          e=>
            startNodeDrag(
              e,
              n.id
            )
        );

        card.addEventListener(
          "dblclick",
          e=>{

            if(
              !e.target.closest(
                ".node-delete"
              )
            )
              editNode(n.id);
          }
        );

        dot.addEventListener(
          "pointerdown",
          e=>
            startLink(
              e,
              n.id
            )
        );

        del.addEventListener(
          "pointerdown",
          e=>
            e.stopPropagation()
        );

        del.addEventListener(
          "click",
          e=>{

            e.stopPropagation();

            if(
              confirm(
                "Удалить узел?"
              )
            ){

              delete db.nodes[n.id];

              db.links=
                db.links.filter(
                  l=>
                    l.a!==n.id&&
                    l.b!==n.id
                );

              saveDB();
              renderAll();
            }
          }
        );
      }
    );

  renderLines();
}

function edgePath(a,b){

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const len=
    Math.max(
      1,
      Math.hypot(dx,dy)
    );

  const nx=dx/len;
  const ny=dy/len;

  const x1=a.x+nx*105;
  const y1=a.y+ny*40;

  const x2=b.x-nx*105;
  const y2=b.y-ny*40;

  const bend=
    Math.min(
      180,
      Math.max(
        50,
        len*.3
      )
    );

  return `
    M ${x1} ${y1}
    C
    ${x1+nx*bend} ${y1+ny*bend},
    ${x2-nx*bend} ${y2-ny*bend},
    ${x2} ${y2}
  `;
}

function renderLines(){

  lines.innerHTML="";

  db.links.forEach(
    link=>{

      const a=
        db.nodes[link.a];

      const b=
        db.nodes[link.b];

      if(!a||!b)
        return;

      const path=
        edgePath(a,b);

      const glow=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      glow.setAttribute(
        "d",
        path
      );

      glow.classList.add(
        "edge-glow"
      );

      lines.appendChild(glow);

      const edge=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      edge.setAttribute(
        "d",
        path
      );

      edge.classList.add("edge");

      lines.appendChild(edge);
    }
  );

  if(linking){

    const a=
      db.nodes[linking.id];

    if(a){

      const p=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      p.classList.add("edge");

      p.setAttribute(
        "stroke-dasharray",
        "7 8"
      );

      p.setAttribute(
        "d",
        `
        M ${a.x+105} ${a.y}
        C
        ${(a.x+105+linking.x)/2} ${a.y},
        ${(a.x+105+linking.x)/2} ${linking.y},
        ${linking.x} ${linking.y}
        `
      );

      lines.appendChild(p);
    }
  }
}

function renderAll(){

  renderNodes();
  applyGraph();
}

function applyGraph(){

  world.style.transform=
    `translate(${panX}px,${panY}px) scale(${scale})`;

  renderLines();
}

/* =========================================================
   NODE MODAL
========================================================= */

let editingNode=null;

function openNodeModal(id=null){

  editingNode=id;

  $("nodeModal").style.display="grid";

  if(id){

    const n=db.nodes[id];

    if(!n){
      closeNodeModal();
      return;
    }

    $("nodeModalTitle").textContent=
      "Edit Node";

    $("nodeTitle").value=
      n.title||"";

    $("nodeType").value=
      n.type||"NODE";

    $("nodeContent").value=
      n.content||"";

  }else{

    $("nodeModalTitle").textContent=
      "New Node";

    $("nodeTitle").value="";
    $("nodeType").value="NODE";
    $("nodeContent").value="";
  }

  setTimeout(
    ()=>$("nodeTitle").focus(),
    40
  );
}

window.openNodeModal=
  openNodeModal;

function closeNodeModal(){

  $("nodeModal").style.display="none";
  editingNode=null;
}

window.closeNodeModal=
  closeNodeModal;

function saveNode(){

  const title=
    $("nodeTitle")
      .value
      .trim();

  if(!title){

    toast("Введите название");
    return;
  }

  if(editingNode){

    const n=
      db.nodes[editingNode];

    if(!n){
      closeNodeModal();
      return;
    }

    n.title=title;

    n.type=
      $("nodeType")
        .value
        .trim()||
      "NODE";

    n.content=
      $("nodeContent")
        .value
        .trim();

  }else{

    const center=
      screenToWorld(
        graph.clientWidth/2,
        graph.clientHeight/2
      );

    const count=
      Object.keys(db.nodes).length;

    const angle=
      count*.8;

    const radius=
      Math.min(
        70+count*22,
        250
      );

    const id=uid();

    db.nodes[id]={

      id:id,

      title:title,

      type:
        $("nodeType")
          .value
          .trim()||
        "NODE",

      content:
        $("nodeContent")
          .value
          .trim(),

      x:
        center.x+
        Math.cos(angle)*
        radius,

      y:
        center.y+
        Math.sin(angle)*
        radius
    };
  }

  saveDB();
  closeNodeModal();
  renderAll();

  toast("Node saved");
}

window.saveNode=saveNode;

function editNode(id){
  openNodeModal(id);
}

/* =========================================================
   DRAG
========================================================= */

function startNodeDrag(e,id){

  if(
    e.button!==undefined&&
    e.button!==0
  )
    return;

  e.preventDefault();
  e.stopPropagation();

  const n=db.nodes[id];

  if(!n)
    return;

  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  draggingNode={
    id:id,
    dx:n.x-p.x,
    dy:n.y-p.y
  };

  const el=
    document.querySelector(
      `.node[data-id="${id}"]`
    );

  if(el)
    el.classList.add("moving");
}

function startLink(e,id){

  e.preventDefault();
  e.stopPropagation();

  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  linking={
    id:id,
    x:p.x,
    y:p.y
  };

  renderLines();
}

window.addEventListener(
  "pointermove",
  e=>{

    if(draggingNode){

      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      const n=
        db.nodes[
          draggingNode.id
        ];

      if(!n)
        return;

      n.x=
        p.x+
        draggingNode.dx;

      n.y=
        p.y+
        draggingNode.dy;

      const el=
        document.querySelector(
          `.node[data-id="${n.id}"]`
        );

      if(el){

        el.style.left=
          n.x+"px";

        el.style.top=
          n.y+"px";
      }

      const near=
        closestNode(
          n.x,
          n.y,
          n.id
        );

      document
        .querySelectorAll(".node.near")
        .forEach(
          x=>x.classList.remove("near")
        );

      nearest=null;

      if(
        near&&
        near.dist<160
      ){

        nearest=
          near.node.id;

        const target=
          document.querySelector(
            `.node[data-id="${nearest}"]`
          );

        if(target)
          target.classList.add("near");
      }

      renderLines();
    }

    if(linking){

      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      linking.x=p.x;
      linking.y=p.y;

      const near=
        closestNode(
          p.x,
          p.y,
          linking.id
        );

      document
        .querySelectorAll(".node.near")
        .forEach(
          x=>x.classList.remove("near")
        );

      nearest=null;

      if(
        near&&
        near.dist<150
      ){

        nearest=
          near.node.id;

        const target=
          document.querySelector(
            `.node[data-id="${nearest}"]`
          );

        if(target)
          target.classList.add("near");
      }

      renderLines();
    }

    if(draggingCanvas){

      panX=
        draggingCanvas.ox+
        e.clientX-
        draggingCanvas.sx;

      panY=
        draggingCanvas.oy+
        e.clientY-
        draggingCanvas.sy;

      applyGraph();
    }
  }
);

window.addEventListener(
  "pointerup",
  ()=>{

    if(draggingNode){

      const n=
        db.nodes[
          draggingNode.id
        ];

      if(n){

        const near=
          closestNode(
            n.x,
            n.y,
            n.id
          );

        if(
          near&&
          near.dist<160
        ){

          connect(
            n.id,
            near.node.id
          );
        }
      }

      document
        .querySelectorAll(".node.moving")
        .forEach(
          x=>x.classList.remove("moving")
        );

      document
        .querySelectorAll(".node.near")
        .forEach(
          x=>x.classList.remove("near")
        );

      draggingNode=null;
      nearest=null;

      saveDB();
      renderAll();
    }

    if(linking){

      if(
        nearest&&
        !linked(
          linking.id,
          nearest
        )
      ){

        connect(
          linking.id,
          nearest
        );

        toast("Connection created");
      }

      linking=null;
      nearest=null;

      document
        .querySelectorAll(".node.near")
        .forEach(
          x=>x.classList.remove("near")
        );

      renderLines();
    }

    if(draggingCanvas){

      draggingCanvas=null;

      graph.classList.remove(
        "dragging"
      );
    }
  }
);

/* =========================================================
   CANVAS PAN
========================================================= */

graph.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.target.closest(".node")
    )
      return;

    if(
      e.button!==undefined&&
      e.button!==0
    )
      return;

    draggingCanvas={
      sx:e.clientX,
      sy:e.clientY,
      ox:panX,
      oy:panY
    };

    graph.classList.add("dragging");
  }
);

/* =========================================================
   ZOOM
========================================================= */

graph.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    const before=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    scale*=
      e.deltaY<0
      ?1.1
      :.9;

    scale=
      Math.max(
        .35,
        Math.min(
          2.5,
          scale
        )
      );

    const after=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    panX+=
      (after.x-before.x)*
      scale;

    panY+=
      (after.y-before.y)*
      scale;

    applyGraph();

  },
  {passive:false}
);

/* =========================================================
   CENTER
========================================================= */

function centerGraph(){

  scale=1;

  panX=
    graph.clientWidth/2;

  panY=
    graph.clientHeight/2;

  applyGraph();
}

window.centerGraph=
  centerGraph;

/* =========================================================
   SEARCH
========================================================= */

$("chainSearch")
  .addEventListener(
    "input",
    function(){

      const q=
        this.value
          .trim()
          .toLowerCase();

      document
        .querySelectorAll(".node")
        .forEach(
          el=>{

            el.classList.remove(
              "node-found"
            );

            if(!q){

              el.style.opacity="1";
              return;
            }

            const n=
              db.nodes[
                el.dataset.id
              ];

            if(!n)
              return;

            const text=
              (
                n.title+" "+
                n.type+" "+
                n.content
              ).toLowerCase();

            if(text.includes(q)){

              el.style.opacity="1";
              el.classList.add(
                "node-found"
              );

            }else{

              el.style.opacity=".13";
            }
          }
        );
    }
  );

/* =========================================================
   PROFILE
========================================================= */

function updateProfile(){

  $("profileName").textContent=
    db.profile.name||
    "NZX User";

  $("profileUsername").textContent=
    "@"+
    (
      db.profile.username||
      "nzx_user"
    );

  if(db.profile.avatar){

    $("profileAvatar").src=
      db.profile.avatar;

    $("miniAvatar").src=
      db.profile.avatar;

  }else{

    $("profileAvatar")
      .removeAttribute("src");

    $("miniAvatar")
      .removeAttribute("src");
  }
}

function chooseAvatar(){
  $("avatarFile").click();
}

window.chooseAvatar=
  chooseAvatar;

$("avatarFile")
  .addEventListener(
    "change",
    e=>{

      const file=
        e.target.files[0];

      if(!file)
        return;

      if(
        !file.type.startsWith("image/")
      ){

        toast("Выберите изображение");
        return;
      }

      const reader=
        new FileReader();

      reader.onload=()=>{

        db.profile.avatar=
          reader.result;

        saveDB();
        updateProfile();

        toast("Avatar updated");
      };

      reader.readAsDataURL(file);
    }
  );

function editProfileName(){

  const name=
    prompt(
      "Имя:",
      db.profile.name||
      "NZX User"
    );

  if(name===null)
    return;

  const username=
    prompt(
      "Username:",
      db.profile.username||
      "nzx_user"
    );

  if(username===null)
    return;

  db.profile.name=
    name.trim()||
    "NZX User";

  db.profile.username=
    username
      .trim()
      .replace(/\s+/g,"")
      .replace(/^@/,"")||
    "nzx_user";

  saveDB();
  updateProfile();

  toast("Profile updated");
}

/* =========================================================
   SATURN
========================================================= */

(function(){

  const canvas=$("saturn");
  const ctx=canvas.getContext("2d");

  let W=0;
  let H=0;
  let dpr=1;

  const points=[];
  const count=1100;
  let rotation=0;

  function resize(){

    const r=
      canvas.getBoundingClientRect();

    dpr=
      Math.min(
        window.devicePixelRatio||1,
        2
      );

    W=r.width;
    H=r.height;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    ctx.setTransform(
      dpr,0,0,dpr,0,0
    );
  }

  function seed(){

    points.length=0;

    const golden=
      Math.PI*
      (3-Math.sqrt(5));

    for(
      let i=0;
      i<count;
      i++
    ){

      const y=
        1-
        (i/(count-1))*2;

      const radius=
        Math.sqrt(
          Math.max(
            0,
            1-y*y
          )
        );

      const a=i*golden;

      points.push({

        x:
          Math.cos(a)*radius,

        y:y,

        z:
          Math.sin(a)*radius,

        size:
          .35+
          Math.random()*1.1
      });
    }
  }

  function draw(time){

    ctx.clearRect(
      0,0,W,H
    );

    rotation+=.00065;

    const cx=W/2;
    const cy=H/2;

    const R=
      Math.min(W,H)*.235;

    const projected=[];

    for(const p of points){

      const c=Math.cos(rotation);
      const s=Math.sin(rotation);

      const x=
        p.x*c-
        p.z*s;

      const z=
        p.x*s+
        p.z*c;

      if(z<-.62)
        continue;

      const perspective=
        2.2/
        (2.2-z*.55);

      projected.push({

        x:
          cx+
          x*
          R*
          perspective,

        y:
          cy+
          p.y*
          R*
          perspective,

        z:z,

        size:
          p.size*
          perspective,

        alpha:
          .13+
          ((z+1)/2)*.57
      });
    }

    projected.sort(
      (a,b)=>a.z-b.z
    );

    for(const p of projected){

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        Math.max(.35,p.size),
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        `rgba(220,220,220,${p.alpha})`;

      ctx.fill();
    }

    const ring=$("saturnRing");

    const degrees=
      (time*.012)%360;

    ring.style.transform=
      `
      translate(-50%,-50%)
      rotateX(67deg)
      rotateZ(${-15+degrees}deg)
      `;

    requestAnimationFrame(draw);
  }

  resize();
  seed();

  requestAnimationFrame(draw);

  addEventListener(
    "resize",
    resize
  );

})();
