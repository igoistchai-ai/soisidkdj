<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NZX OSINT TOOL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#f5f5f5;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.92);
  --card:#111;
  --text:#f5f5f5;
  --muted:#777;
  --dim:#444;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
  --good:#d9ffd9;
  --warn:#ffe7a3;
  --bad:#ff9b9b;
}


/* ==========================================================
   HACK INTRO
========================================================== */

#bootScreen{
  position:fixed;
  inset:0;
  z-index:999999;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

#asciiContainer{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  padding:18px;

  overflow:hidden;

  color:#fff;

  font-family:
    "Courier New",
    Courier,
    monospace;

  font-size:
    clamp(3px,.47vw,7px);

  line-height:.94;

  white-space:pre;

  text-shadow:
    0 0 4px rgba(255,255,255,.65);

  transform:
    scale(1.02);

  transform-origin:center;
}

.hack-line{
  position:absolute;
  left:0;

  width:100%;

  white-space:pre;

  opacity:0;

  transform:
    translateY(-100vh)
    translateX(var(--hack-x))
    skewX(var(--hack-skew));

  animation:
    hackDrop
    .105s
    cubic-bezier(.02,.9,.08,1)
    forwards;

  animation-delay:
    var(--hack-delay);
}

@keyframes hackDrop{

  0%{
    opacity:0;

    transform:
      translateY(-100vh)
      translateX(var(--hack-x))
      skewX(var(--hack-skew));
  }

  25%{
    opacity:1;
  }

  55%{
    transform:
      translateY(8px)
      translateX(0)
      skewX(0);
  }

  72%{
    transform:
      translateY(-3px)
      translateX(0)
      skewX(0);
  }

  100%{
    opacity:1;

    transform:
      translateY(0)
      translateX(0)
      skewX(0);
  }
}

#bootScreen.hack{
  animation:
    screenGlitch
    .075s
    infinite;
}

@keyframes screenGlitch{

  0%{
    transform:translate(0,0);
    filter:none;
  }

  18%{
    transform:translate(-4px,1px);
    filter:contrast(1.9) brightness(1.15);
  }

  31%{
    transform:translate(5px,-2px);
    filter:contrast(2);
  }

  48%{
    transform:translate(-2px,3px);
    filter:brightness(1.5);
  }

  67%{
    transform:translate(3px,-1px);
    filter:contrast(1.6);
  }

  83%{
    transform:translate(-1px,0);
  }

  100%{
    transform:translate(0,0);
    filter:none;
  }
}

#bootScreen::before{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:10;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 2px,
      rgba(255,255,255,.025) 3px
    );
}

#bootScreen::after{
  content:"";

  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:11;

  background:
    radial-gradient(
      ellipse at center,
      transparent 15%,
      rgba(0,0,0,.8) 100%
    );
}

.boot-flash{
  position:absolute;
  inset:0;

  z-index:20;

  pointer-events:none;

  background:#fff;

  opacity:0;
}

#bootScreen.flash .boot-flash{
  animation:
    flash .12s linear;
}

@keyframes flash{

  0%{
    opacity:.8;
  }

  100%{
    opacity:0;
  }
}

#bootScreen.hack-end{
  animation:none;

  opacity:0;

  transform:
    scale(1.12);

  filter:
    blur(14px)
    brightness(2.2);

  transition:
    opacity .15s linear,
    transform .15s linear,
    filter .15s linear;

  pointer-events:none;
}


/* ==========================================================
   APP
========================================================== */

.app{
  width:100%;
  height:100%;
  position:relative;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.025),
      transparent 45%
    ),
    #050505;
}


/* ==========================================================
   TOPBAR
========================================================== */

.topbar{
  position:fixed;
  z-index:100;

  top:0;
  left:0;
  right:0;

  height:72px;

  display:flex;
  align-items:center;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      rgba(8,8,8,.98),
      rgba(8,8,8,.88)
    );

  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #fff;
  border-radius:11px;

  font-size:19px;
  font-weight:900;

  margin-right:12px;

  box-shadow:
    0 0 25px rgba(255,255,255,.08);
}

.brand{
  display:flex;
  flex-direction:column;
  gap:2px;

  min-width:210px;
}

.brand b{
  font-size:14px;
  letter-spacing:.15em;
}

.brand small{
  color:#666;
  font-size:8px;
  letter-spacing:.24em;
}

.top-tools{
  display:flex;
  align-items:center;
  gap:7px;

  margin-left:auto;
}

.top-btn{
  height:34px;

  padding:0 13px;

  color:#bbb;
  background:#0c0c0c;

  border:1px solid var(--line2);
  border-radius:8px;

  font-size:9px;
  font-weight:800;
  letter-spacing:.1em;

  transition:.2s ease;
}

.top-btn:hover{
  color:#fff;
  background:#161616;
  border-color:#666;
  transform:translateY(-1px);
}

.profile-mini{
  width:38px;
  height:38px;

  border-radius:50%;
  border:1px solid #333;

  background:#111;

  overflow:hidden;

  margin-left:10px;
  padding:0;
}

.profile-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}


/* ==========================================================
   SIDEBAR
========================================================== */

.sidebar{
  position:fixed;

  left:0;
  top:72px;
  bottom:0;

  width:66px;

  z-index:90;

  display:flex;
  align-items:center;
  flex-direction:column;

  padding-top:18px;

  background:rgba(6,6,6,.94);

  border-right:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.side-btn{
  width:42px;
  height:42px;

  margin-bottom:8px;

  border:1px solid transparent;
  border-radius:10px;

  color:#555;
  background:transparent;

  font-size:19px;

  transition:.2s ease;
}

.side-btn:hover,
.side-btn.active{
  color:#fff;
  background:#111;
  border-color:#292929;
}


/* ==========================================================
   PAGES
========================================================== */

.page{
  display:none;

  position:absolute;

  top:72px;
  left:66px;
  right:0;
  bottom:0;
}

.page.active{
  display:block;
}


/* ==========================================================
   CHAIN
========================================================== */

.chain-page{
  width:100%;
  height:100%;
  position:relative;
}

.chain-toolbar{
  position:absolute;

  top:17px;
  left:18px;
  right:18px;

  z-index:30;

  display:flex;
  gap:8px;
  align-items:center;

  flex-wrap:wrap;
}

.chain-search{
  width:240px;
  height:37px;

  padding:0 12px;

  border-radius:9px;
  border:1px solid var(--line2);

  background:rgba(10,10,10,.86);
  color:#fff;

  outline:none;
  font-size:11px;
}

.chain-search:focus{
  border-color:#666;
}

.chain-search::placeholder{
  color:#555;
}

.btn{
  height:37px;

  padding:0 13px;

  border-radius:9px;
  border:1px solid var(--line2);

  color:#aaa;
  background:#0c0c0c;

  font-size:9px;
  font-weight:800;

  transition:.2s ease;
}

.btn:hover{
  color:#fff;
  background:#151515;
  border-color:#777;
}

.btn.primary{
  color:#050505;
  background:#fff;
  border-color:#fff;
}

.btn.primary:hover{
  background:#ddd;
}


/* ==========================================================
   GRAPH
========================================================== */

.graph{
  width:100%;
  height:100%;

  position:relative;
  overflow:hidden;

  background-color:#050505;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:40px 40px;
}

.world{
  position:absolute;

  left:50%;
  top:50%;

  width:10000px;
  height:10000px;

  transform:
    translate(-50%,-50%)
    scale(1);

  transform-origin:center;

  pointer-events:none;
}

.lines{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  overflow:visible;

  pointer-events:none;

  z-index:1;
}

.node{
  position:absolute;

  width:170px;
  min-height:72px;

  transform:
    translate(-50%,-50%);

  padding:12px 13px;

  border:1px solid rgba(255,255,255,.13);

  background:
    linear-gradient(
      145deg,
      rgba(20,20,20,.97),
      rgba(9,9,9,.97)
    );

  border-radius:12px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);

  user-select:none;

  cursor:grab;

  z-index:5;

  pointer-events:auto;

  transition:
    border-color .2s,
    box-shadow .2s;
}

.node:hover{
  border-color:#555;

  box-shadow:
    0 25px 70px rgba(0,0,0,.6);
}

.node.dragging{
  cursor:grabbing;

  border-color:#888;

  box-shadow:
    0 30px 90px rgba(0,0,0,.8);
}

.node.highlight{
  border-color:#fff;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.2),
    0 0 40px rgba(255,255,255,.1);
}

.node-type{
  color:#555;

  font-size:8px;
  font-weight:900;

  letter-spacing:.15em;

  margin-bottom:6px;
}

.node-title{
  color:#eee;

  font-size:11px;
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.node-content{
  margin-top:5px;

  color:#777;

  font-size:9px;
  line-height:1.4;

  max-height:28px;
  overflow:hidden;

  word-break:break-word;
}

.node-delete{
  position:absolute;

  right:7px;
  top:6px;

  width:20px;
  height:20px;

  border:0;
  border-radius:5px;

  color:#555;
  background:transparent;

  font-size:12px;
}

.node-delete:hover{
  color:#fff;
  background:#222;
}

.node-dot{
  position:absolute;

  width:10px;
  height:10px;

  right:-5px;
  top:50%;

  transform:translateY(-50%);

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 14px rgba(255,255,255,.45);

  cursor:crosshair;
}


/* ==========================================================
   LINES
========================================================== */

.graph-line{
  opacity:0;

  animation:
    lineAppear .45s ease forwards;
}

.graph-line-flow{
  animation:
    dash 5s linear infinite;
}

@keyframes lineAppear{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes dash{
  to{
    stroke-dashoffset:-60;
  }
}


/* ==========================================================
   SATURN
========================================================== */

.saturn{
  position:absolute;

  left:50%;
  top:50%;

  width:470px;
  height:470px;

  transform:
    translate(-50%,-50%);

  opacity:.62;

  pointer-events:none;

  filter:
    drop-shadow(
      0 0 35px rgba(255,255,255,.08)
    );
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:360px;
  height:105px;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 0 20px rgba(255,255,255,.05);

  transform:
    translate(-50%,-50%)
    rotateX(67deg);

  transform-style:preserve-3d;

  opacity:.65;
}


/* ==========================================================
   PROFILE
========================================================== */

.profile{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:30px;
}

.profile-card{
  width:min(600px,100%);

  border:1px solid var(--line);
  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(20,20,20,.95),
      rgba(7,7,7,.96)
    );

  box-shadow:
    0 30px 100px rgba(0,0,0,.5);

  padding:28px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
}

.profile-avatar{
  width:84px;
  height:84px;

  border-radius:50%;
  object-fit:cover;

  background:#111;
  border:1px solid #333;
}

.profile-info h1{
  font-size:24px;
}

.profile-info p{
  color:#666;

  margin-top:5px;

  font-size:12px;
}

.profile-actions{
  display:flex;
  gap:8px;

  margin-top:25px;

  flex-wrap:wrap;
}

.profile-button{
  height:38px;

  padding:0 14px;

  border-radius:8px;
  border:1px solid #333;

  background:#111;
  color:#aaa;

  font-size:10px;
  font-weight:800;
}

.profile-button:hover{
  color:#fff;
  border-color:#666;
}

.profile-button.primary{
  color:#000;
  background:#fff;
  border-color:#fff;
}


/* ==========================================================
   MODALS
========================================================== */

.tool-modal,
#nodeModal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(12px);
}

.tool-modal.open,
#nodeModal.open{
  display:flex;
}

.modal-box,
.node-modal-box{
  width:min(520px,100%);

  max-height:calc(100vh - 40px);

  overflow:auto;

  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #151515,
      #090909
    );

  box-shadow:
    0 40px 120px rgba(0,0,0,.75);

  padding:22px;
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.modal-top h2{
  font-size:17px;
  letter-spacing:.04em;
}

.close{
  width:32px;
  height:32px;

  border:0;
  border-radius:8px;

  background:#111;
  color:#777;

  font-size:20px;
}

.close:hover{
  color:#fff;
}

.modal-description{
  color:#666;

  font-size:10px;
  line-height:1.5;

  margin-bottom:16px;
}

.modal-input{
  width:100%;
  height:45px;

  padding:0 13px;

  color:#fff;
  background:#080808;

  border:1px solid #2b2b2b;
  border-radius:9px;

  outline:none;
}

.modal-input:focus{
  border-color:#777;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;

  margin-top:12px;
}

.modal-actions button{
  height:36px;

  padding:0 14px;

  border-radius:8px;
  border:1px solid #333;

  color:#aaa;
  background:#111;

  font-size:9px;
  font-weight:900;
}

.modal-actions button:hover{
  color:#fff;
  border-color:#777;
}

.modal-actions button.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.results{
  display:flex;
  flex-direction:column;

  gap:7px;

  margin-top:18px;
}

.result{
  padding:11px 12px;

  border-radius:9px;
  border:1px solid #202020;

  background:#0c0c0c;
}

.result-head{
  display:flex;
  align-items:center;
  gap:7px;

  color:#777;

  font-size:8px;
  font-weight:900;

  letter-spacing:.12em;
}

.result-value{
  margin-top:5px;

  color:#ddd;

  font-size:11px;
  line-height:1.45;

  white-space:pre-wrap;
  word-break:break-word;
}

.result.good{
  border-color:rgba(170,255,170,.18);
}

.result.warn{
  border-color:rgba(255,220,100,.18);
}

.result.bad{
  border-color:rgba(255,100,100,.18);
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;

  color:#555;

  font-size:8px;
  font-weight:900;

  letter-spacing:.13em;

  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;

  color:#fff;
  background:#080808;

  border:1px solid #292929;
  border-radius:8px;

  outline:none;

  padding:10px;

  font-size:11px;
}

.field input{
  height:40px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#666;
}


/* ==========================================================
   TOAST
========================================================== */

.toast{
  position:fixed;

  z-index:900;

  left:50%;
  bottom:22px;

  transform:
    translate(-50%,20px);

  opacity:0;

  pointer-events:none;

  padding:10px 15px;

  border:1px solid #333;
  border-radius:9px;

  background:#111;
  color:#ddd;

  font-size:10px;

  transition:.25s ease;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* ==========================================================
   MOBILE
========================================================== */

@media(max-width:760px){

  .topbar{
    height:62px;
    padding:0 10px;
  }

  .brand{
    min-width:0;
  }

  .brand b{
    font-size:11px;
  }

  .brand small{
    display:none;
  }

  .top-tools{
    margin-left:auto;
  }

  .top-btn{
    width:35px;
    padding:0;
    overflow:hidden;
    font-size:0;
  }

  .top-btn:first-child::after{
    content:"☎";
    font-size:14px;
  }

  .top-btn:nth-child(2)::after{
    content:"⌖";
    font-size:14px;
  }

  .sidebar{
    top:62px;
    width:54px;
  }

  .page{
    top:62px;
    left:54px;
  }

  .chain-toolbar{
    left:8px;
    right:8px;

    gap:5px;
  }

  .chain-search{
    width:100%;
  }

  .btn{
    font-size:7px;
    padding:0 8px;
  }

  .node{
    width:150px;
  }

  .saturn{
    width:330px;
    height:330px;
  }

  .saturn-ring{
    width:270px;
  }

  #asciiContainer{
    font-size:clamp(2px,.42vw,5px);
  }
}
</style>
</head>

<body>


<!-- ==========================================================
     HACK INTRO
========================================================== -->

<div id="bootScreen">

  <div id="asciiContainer"></div>

  <div class="boot-flash"></div>

</div>


<!-- ==========================================================
     MAIN APP
========================================================== -->

<div class="app">


<header class="topbar">

  <div class="logo">
    N
  </div>

  <div class="brand">

    <b>
      NZX OSINT TOOL
    </b>

    <small>
      INTELLIGENCE WORKSPACE
    </small>

  </div>

  <div class="top-tools">

    <button
      class="top-btn"
      onclick="openTool('phone')"
    >
      CHECK NUMBER
    </button>

    <button
      class="top-btn"
      onclick="openTool('address')"
    >
      CHECK ADDRESS
    </button>

  </div>

  <button
    class="profile-mini"
    onclick="openProfile()"
  >
    <img
      id="miniAvatar"
      alt=""
    >
  </button>

</header>


<aside class="sidebar">

  <button
    class="side-btn active"
    data-page="chain"
    onclick="showPage('chain')"
  >
    ⌘
  </button>

  <button
    class="side-btn"
    data-page="profile"
    onclick="openProfile()"
  >
    ◎
  </button>

</aside>


<section
  class="page active"
  id="page-chain"
>

  <div class="chain-page">

    <div class="chain-toolbar">

      <input
        class="chain-search"
        id="chainSearch"
        placeholder="Search chain or node..."
      >

      <button
        class="btn"
        onclick="openNodeModal()"
      >
        ＋ Node
      </button>

      <button
        class="btn"
        onclick="centerGraph()"
      >
        ⌂
      </button>

      <button
        class="btn"
        onclick="createProject()"
      >
        CREATE PROJECT
      </button>

      <button
        class="btn"

/* ==========================================================
   BOOT
========================================================== */

function initBoot(){

  const screen =
    document.getElementById(
      "bootScreen"
    );

  const container =
    document.getElementById(
      "asciiContainer"
    );

  if(!screen || !container)
    return;


  container.innerHTML="";


  const lines =
    ASCII_ART
      .replace(/\r/g,"")
      .split("\n")
      .filter(
        line =>
          line.length > 0
      );


  lines.forEach(
    (line,index)=>{

      const el =
        document.createElement(
          "div"
        );

      el.className =
        "hack-line";

      el.textContent =
        line;


      const x =
        (
          Math.random()*90-45
        ).toFixed(1);

      const skew =
        (
          Math.random()*16-8
        ).toFixed(1);


      const delay =
        (
          index*.003 +
          Math.random()*.055
        ).toFixed(3);


      el.style.top =
        (
          index /
          Math.max(
            lines.length-1,
            1
          ) *
          100
        ) + "%";


      el.style.setProperty(
        "--hack-x",
        x+"px"
      );

      el.style.setProperty(
        "--hack-skew",
        skew+"deg"
      );

      el.style.setProperty(
        "--hack-delay",
        delay+"s"
      );


      container.appendChild(
        el
      );
    }
  );


  /*
    Очень короткий резкий
    glitch/freeze.
  */

  screen.classList.add(
    "hack"
  );


  setTimeout(
    ()=>{
      screen.classList.add(
        "flash"
      );
    },
    500
  );


  setTimeout(
    ()=>{
      screen.classList.remove(
        "hack"
      );
    },
    720
  );


  /*
    Резкий выход.
  */

  const duration =
    Math.min(
      2100,
      1050 +
      lines.length*4
    );


  setTimeout(
    ()=>{

      screen.classList.add(
        "hack-end"
      );


      setTimeout(
        ()=>{
          screen.remove();
        },
        200
      );

    },
    duration
  );
}

const STORAGE_KEY =
  "nzx-osint-real-v4";

let db = {

  nodes:{},

  links:[],

  profile:{
    name:"NZX User",
    username:"nzx_user",
    avatar:""
  },

  searches:0
};


try{

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if(saved){

    const parsed =
      JSON.parse(saved);

    db = {

      ...db,
      ...parsed,

      nodes:
        parsed.nodes || {},

      links:
        Array.isArray(
          parsed.links
        )
          ? parsed.links
          : [],

      profile:{
        ...db.profile,
        ...(parsed.profile || {})
      }
    };
  }

}catch(error){

  console.warn(
    "Storage error",
    error
  );
}


/* ==========================================================
   PROJECT SYSTEM
========================================================== */

let currentProject =
  localStorage.getItem(
    "nzx-current-project"
  ) ||
  "Default Project";


function getProjects(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "nzx-projects"
      ) || "{}"
    );

  }catch{

    return {};
  }
}


function saveProjects(
  projects
){

  localStorage.setItem(
    "nzx-projects",
    JSON.stringify(
      projects
    )
  );
}


function saveCurrentProject(){

  const projects =
    getProjects();


  projects[currentProject] = {

    nodes:
      db.nodes,

    links:
      db.links,

    createdAt:
      projects[currentProject]?.createdAt ||
      Date.now()

  };


  saveProjects(
    projects
  );
}


function createProject(){

  const name =
    prompt(
      "PROJECT NAME:"
    );

  if(name === null)
    return;


  const clean =
    name.trim();


  if(!clean){

    toast(
      "PROJECT NAME REQUIRED"
    );

    return;
  }


  const projects =
    getProjects();


  if(
    projects[clean]
  ){

    toast(
      "PROJECT ALREADY EXISTS"
    );

    return;
  }


  saveCurrentProject();


  projects[clean] = {

    nodes:{},

    links:[],

    createdAt:
      Date.now()

  };


  saveProjects(
    projects
  );


  currentProject =
    clean;


  localStorage.setItem(
    "nzx-current-project",
    currentProject
  );


  db.nodes={};

  db.links=[];


  saveDB();

  renderNodes();

  renderLines();

  centerGraph();


  toast(
    "PROJECT CREATED"
  );
}


function showProjects(){

  const projects =
    getProjects();


  const names =
    Object.keys(
      projects
    );


  if(!names.length){

    toast(
      "NO PROJECTS"
    );

    return;
  }


  const list =
    names
      .map(
        (name,index)=>
          `${index+1}. ${name}`
      )
      .join("\n");


  const selected =
    prompt(
      "MY PROJECTS:\n\n" +
      list +
      "\n\nENTER PROJECT NAME:"
    );


  if(
    selected === null
  )
    return;


  const name =
    selected.trim();


  if(!projects[name]){

    toast(
      "PROJECT NOT FOUND"
    );

    return;
  }


  saveCurrentProject();


  const project =
    projects[name];


  db.nodes =
    project.nodes || {};

  db.links =
    project.links || [];


  currentProject =
    name;


  localStorage.setItem(
    "nzx-current-project",
    currentProject
  );


  saveDB();

  renderNodes();

  renderLines();

  centerGraph();


  toast(
    "PROJECT LOADED"
  );
}


function deleteProject(){

  const projects =
    getProjects();


  const names =
    Object.keys(
      projects
    );


  if(!names.length){

    toast(
      "NO PROJECTS"
    );

    return;
  }


  const list =
    names
      .map(
        (name,index)=>
          `${index+1}. ${name}`
      )
      .join("\n");


  const selected =
    prompt(
      "DELETE PROJECT:\n\n" +
      list +
      "\n\nENTER PROJECT NAME:"
    );


  if(
    selected === null
  )
    return;


  const name =
    selected.trim();


  if(!projects[name]){

    toast(
      "PROJECT NOT FOUND"
    );

    return;
  }


  if(
    !confirm(
      `DELETE PROJECT "${name}"?`
    )
  )
    return;


  delete projects[name];


  saveProjects(
    projects
  );


  if(
    currentProject ===
    name
  ){

    const remaining =
      Object.keys(
        projects
      );


    if(remaining.length){

      currentProject =
        remaining[0];

      const project =
        projects[
          currentProject
        ];


      db.nodes =
        project.nodes || {};

      db.links =
        project.links || {};

      if(
        !Array.isArray(
          db.links
        )
      ){
        db.links=[];
      }

    }else{

      currentProject =
        "Default Project";

      db.nodes={};

      db.links=[];
    }


    localStorage.setItem(
      "nzx-current-project",
      currentProject
    );


    saveDB();

    renderNodes();

    renderLines();

    centerGraph();
  }


  toast(
    "PROJECT DELETED"
  );
}


function deleteAllNodes(){

  const count =
    Object.keys(
      db.nodes
    ).length;


  if(!count){

    toast(
      "NO NODES"
    );

    return;
  }


  if(
    !confirm(
      `DELETE ALL ${count} NODES?`
    )
  )
    return;


  db.nodes={};

  db.links=[];


  saveDB();

  saveCurrentProject();

  renderNodes();

  renderLines();


  toast(
    "ALL NODES DELETED"
  );
}


setInterval(
  ()=>{
    saveCurrentProject();
  },
  3000
);

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


function objectToText(value){

  if(
    value === null ||
    value === undefined
  ){
    return "UNKNOWN";
  }

  if(
    typeof value === "string" ||
    typeof value === "number" ||
    typeof value === "boolean"
  ){
    return String(value);
  }

  try{

    return JSON.stringify(
      value,
      null,
      2
    );

  }catch{

    return String(value);
  }
}

  return (
    "node_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );
}


let toastTimer=null;


function toast(message){

  const el =
    $("toast");


  el.textContent =
    message;


  el.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove(
          "show"
        );
      },
      2200
    );
}

function showPage(page){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      el=>{
        el.classList.remove(
          "active"
        );
      }
    );


  const target =
    $("page-"+page);


  if(target){

    target.classList.add(
      "active"
    );
  }


  document
    .querySelectorAll(
      ".side-btn"
    )
    .forEach(
      button=>{

        button.classList.toggle(
          "active",
          button.dataset.page ===
            page
        );

      }
    );
}

  showPage(

  updateProfileUI();
}

function updateProfileUI(){

  const avatar =
    db.profile.avatar ||
    avatarFallback();


  $("miniAvatar").src =
    avatar;

  $("profileAvatar").src =
    avatar;


  $("profileName").textContent =
    db.profile.name;


  $("profileUsername").textContent =
    "@" +
    db.profile.username;
}


function chooseAvatar(){

  $("avatarFile").click();
}


$("avatarFile")
.addEventListener(
  "change",
  event=>{

    const file =
      event.target.files?.[0];


    if(!file)
      return;


    const reader =
      new FileReader();


    reader.onload =
      ()=>{

        db.profile.avatar =
          reader.result;


        saveDB();

        updateProfileUI();


        toast(
          "AVATAR UPDATED"
        );
      };


    reader.readAsDataURL(
      file
    );
  }
);


function editProfileName(){

  const name =
    prompt(
      "ENTER PROFILE NAME:",
      db.profile.name
    );


  if(name === null)
    return;


  const clean =
    name.trim();


  if(!clean)
    return;


  db.profile.name =
    clean;


  saveDB();

  updateProfileUI();


  toast(
    "PROFILE UPDATED"
  );
}

    return;


  currentTool =
    type;


  $("toolTitle").textContent =
    config.title;


  $("toolDescription").textContent =
    config.description;


  $("toolInput").placeholder =
    config.placeholder;


  $("toolInput").value =
    "";


  $("toolResults").innerHTML =
    "";


  $("toolModal")
    .classList.add(
      "open"
    );


  setTimeout(
    ()=>{
      $("toolInput").focus();
    },
    50
  );
}


function closeTool(){

  $("toolModal")
    .classList.remove(
      "open"
    );


  currentTool=null;
}


function outsideToolModal(event){

  if(
    event.target ===
    $("toolModal")
  ){
    closeTool();
  }
}


$("toolInput")
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      runTool();
    }
  }
);


async function runTool(){

  if(!currentTool)
    return;


  const value =
    $("toolInput")
      .value
      .trim();


  if(!value){

    toast(
      "ENTER A VALUE"
    );

    return;
  }


  $("toolRun").disabled =
    true;


  $("toolRun").textContent =
    "CHECKING...";


  $("toolResults").innerHTML =
    "";


  try{

    if(
      currentTool ===
      "phone"
    ){

      await checkPhoneReal(
        value
      );

    }else if(
      currentTool ===
      "address"
    ){

      await checkAddressReal(
        value
      );
    }

  }finally{

    $("toolRun").disabled =
      false;

    $("toolRun").textContent =
      "CHECK";
  }
}

function addResult(
  title,
  value,
  status="INFO",
  icon="•"
){

  const box =
    document.createElement(
      "div"
    );


  let cls =
    "result";


  if(status === "OK")
    cls += " good";


  if(status === "WARNING")
    cls += " warn";


  if(status === "ERROR")
    cls += " bad";


  box.className =
    cls;


  box.innerHTML = `

    <div class="result-head">

      <span>
        ${escapeHTML(icon)}
      </span>

      <span>
        ${escapeHTML(title)}
      </span>

    </div>

    <div class="result-value">
      ${escapeHTML(
        objectToText(value)
      )}
    </div>

  `;


  $("toolResults")
    .appendChild(
      box
    );
}

   PHONE API
========================================================== */

async function checkPhoneReal(
  value
){

  addResult(
    "REQUEST",
    "Checking number...",
    "INFO",
    "•"
  );


  try{

    const form =
      new URLSearchParams();


    form.append(
      "phone",
      value
    );


    const response =
      await fetch(
        "/api/osint/phone",
        {
          method:"POST",

          headers:{
            "Accept":
              "application/json"
          },

          body:form
        }
      );


    let data=null;


    try{

      data =
        await response.json();

    }catch{

      data=null;
    }


    $("toolResults")
      .innerHTML =
      "";


    if(!response.ok){

      addResult(
        "BACKEND ERROR",
        data ||
          ("HTTP " +
           response.status),
        "ERROR",
        "!"
      );

      return;
    }


    if(!data){

      addResult(
        "RESPONSE",
        "Backend did not return JSON.",
        "ERROR",
        "!"
      );

      return;
    }


    renderPhoneResult(
      data
    );


    createPhoneGraph(
      data
    );


    db.searches++;


    saveDB();

  }catch(error){

    $("toolResults")
      .innerHTML =
      "";


    addResult(
      "CONNECTION",
      error?.message ||
        "Could not connect to backend.",
      "ERROR",
      "!"
    );
  }
}

function createNode(

  type,
  content,
  x,
  y,
  extra={}
){

  const id =
    uid();


  db.nodes[id] = {

  };

/* ==========================================================
   PHONE GRAPH
========================================================== */

function createPhoneGraph(
  data
){

  const phone =
    data.e164 ||
    data.phone;


  if(!phone)
    return;


  const phoneKey =
    "phone:" +
    String(phone)
      .trim()
      .toLowerCase();


  Object.keys(
    db.nodes
  )
  .forEach(
    id=>{

      const node =
        db.nodes[id];


      if(
        node.group ===
        phoneKey
      ){

        delete db.nodes[id];


        db.links =
          db.links.filter(
            link =>
              link.a !== id &&
              link.b !== id
          );
      }
    }
  );


  const center =
    getGraphCenter();


  const phoneId =
    createNode(
      "Phone Number",
      "PHONE",
      phone,
      center.x,
      center.y,
      {
        group:phoneKey
      }
    );


  const values = [

    [
      "Country",
      "COUNTRY",
      data.country
    ],

    [
      "Country Code",
      "COUNTRY CODE",
      data.country_code
    ],

    [
      "Region",
      "REGION",
      data.region
    ],

    [
      "Carrier",
      "CARRIER",
      data.carrier
    ],

    [
      "Line Type",
      "LINE TYPE",
      data.line_type
    ],

    [
      "Confidence",
      "CONFIDENCE",
      data.confidence
    ],

    [
      "Valid",
      "VALID",
      data.valid === true
        ? "YES"
        : data.valid === false
          ? "NO"
          : data.valid
    ],

    [
      "Possible",
      "POSSIBLE",
      data.possible === true
        ? "YES"
        : data.possible === false
          ? "NO"
          : data.possible
    ],

    [
      "Disposable",
      "DISPOSABLE",
      data.disposable
    ],

    [
      "National",
      "NATIONAL",
      data.national
    ],

    [
      "International",
      "INTERNATIONAL",
      data.international
    ],

    [
      "E.164",
      "E.164",
      data.e164
    ],

    [
      "Score",
      "SCORE",
      data.score
    ]

  ];


  const cleanValues =
    values.filter(
      item=>{

        const value =
          item[2];


        return !(
          value === null ||
          value === undefined ||
          value === "" ||
          value === "UNKNOWN"
        );
      }
    );


  const PER_COLUMN=5;

  const COLUMN_GAP=400;

  const ROW_GAP=125;

  const columns=[];


  for(
    let i=0;
    i<cleanValues.length;
    i+=PER_COLUMN
  ){

    columns.push(
      cleanValues.slice(
        i,
        i+PER_COLUMN
      )
    );
  }


  const createdColumns=[];


  columns.forEach(
    (
      column,
      columnIndex
    )=>{

      const columnNodes=[];


      const total =
        column.length;


      const startY =
        center.y -
        (
          (total-1) *
          ROW_GAP /
          2
        );


      column.forEach(
        (
          item,
          rowIndex
        )=>{

          const x =
            center.x +
            COLUMN_GAP *
            (
              columnIndex+1
            );


          const y =
            startY +
            rowIndex*
            ROW_GAP;


          const id =
            createNode(
              item[0],
              item[1],
              typeof item[2] ===
                "boolean"
                  ? (
                      item[2]
                        ? "YES"
                        : "NO"
                    )
                  : String(item[2]),
              x,
              y,
              {
                group:phoneKey,

                column:
                  columnIndex,

                row:
                  rowIndex
              }
            );


          columnNodes.push(
            db.nodes[id]
          );


          if(
            columnIndex ===
            0
          ){

            db.links.push({
              a:phoneId,
              b:id
            });
          }

        }
      );


      createdColumns.push(
        columnNodes
      );
    }
  );


  for(
    let columnIndex=1;

    columnIndex<
      createdColumns.length;

    columnIndex++
  ){

    const previous =
      createdColumns[
        columnIndex-1
      ];


    const current =
      createdColumns[
        columnIndex
      ];


    current.forEach(
      node=>{

        let nearest =
          previous[0];

        let best =
          Infinity;


        previous.forEach(
          prev=>{

            const distance =
              Math.abs(
                prev.y -
                node.y
              );


            if(
              distance < best
            ){

              best =
                distance;

              nearest =
                prev;
            }
          }
        );


        if(nearest){

          db.links.push({

            a:
              nearest.id,

            b:
              node.id

          });
        }
      }
    );
  }


  saveDB();

  saveCurrentProject();

  renderNodes();

  renderLines();

  animateNewGraph(
    phoneId
  );
}

function createAddressGraph(
  data
){

  if(!data)
    return;


  const center =
    getGraphCenter();


  let addressNode =
    Object.values(
      db.nodes
    ).find(
      node =>
        node.type ===
          "ADDRESS" &&
        node.content ===
          data.display_name
    );


  if(!addressNode){

    const id =
      createNode(
        "Address",
        "ADDRESS",
        data.display_name,
        center.x,
        center.y
      );


    addressNode =
      db.nodes[id];
  }


  const values = [

    [
      "City",
      "CITY",
      data.city
    ],

    [
      "Country",
      "COUNTRY",
      data.country
    ],

    [
      "Coordinates",
      "COORDINATES",
      `${data.lat}, ${data.lon}`
    ],

    [
      "Postcode",
      "POSTCODE",
      data.postcode
    ],

    [
      "State",
      "STATE",
      data.state
    ],

    [
      "Road",
      "ROAD",
      data.road
    ],

    [
      "House",
      "HOUSE",
      data.house_number
    ]

  ].filter(
    item =>
      item[2] &&
      item[2] !==
        "UNKNOWN"
  );


  const ROW_GAP=125;

  const COLUMN_GAP=400;


  values.forEach(
    (
      item,
      index
    )=>{

      const column =
        Math.floor(
          index/5
        );


      const row =
        index%5;


      const total =
        Math.min(
          5,
          values.length -
          column*5
        );


      const startY =
        addressNode.y -
        (
          (total-1)*
          ROW_GAP/
          2
        );


      const id =
        createNode(
          item[0],
          item[1],
          item[2],
          addressNode.x +
            COLUMN_GAP*
            (column+1),
          startY +
            row*
            ROW_GAP
        );


      db.links.push({

        a:
          addressNode.id,

        b:
          id
      });
    }
  );


  saveDB();

  saveCurrentProject();

  renderNodes();

  renderLines();
}

function openNodeModal(
  nodeId=null
){

  editingNode =

  $("nodeModalTitle")

        ? "Edit Node"
        : "New Node";

      node.content || "";

  }else{

    $("nodeTitle").value =
      "";

    $("nodeType").value =
      "";

    $("nodeContent").value =
      "";
  }


  $("nodeModal")
    .classList.add(
      "open"
    );
}


function closeNodeModal(){

  $("nodeModal")
    .classList.remove(
      "open"
    );


  editingNode=null;
}


function saveNode(){

  const title =
    $("nodeTitle")
      .value
      .trim();


  const type =
    $("nodeType")
      .value
      .trim()
      .toUpperCase();


  const content =
    $("nodeContent")
      .value
      .trim();


  if(!title){

    toast(
      "ENTER NAME"
    );

    return;
  }


  if(editingNode){

    const node =
      db.nodes[
        editingNode
      ];


    if(node){

      node.title =
        title;

      node.type =
        type ||
        "UNKNOWN";

      node.content =
        content;
    }

  }else{

    const center =
      getGraphCenter();


    const existing =
      Object.values(
        db.nodes
      );


    const newId =
      createNode(
        title,
        type ||
          "UNKNOWN",
        content,
        center.x +
          (
            Math.random()-.5
          )*260,
        center.y +
          (
            Math.random()-.5
          )*180
      );


    const candidates =
      existing.filter(
        node =>
          node.id !==
          newId
      );


    if(candidates.length){

      const newNode =
        db.nodes[
          newId
        ];


      let nearest =
        candidates[0];


      let best =
        Infinity;


      candidates.forEach(
        node=>{

          const dx =
            node.x -
            newNode.x;


          const dy =
            node.y -
            newNode.y;


          const distance =
            Math.sqrt(
              dx*dx +
              dy*dy
            );


          if(
            distance < best
          ){

            best =
              distance;

            nearest =
              node;
          }
        }
      );


      db.links.push({

        a:
          nearest.id,

        b:
          newId
      });
    }
  }


  saveDB();

  saveCurrentProject();

  renderNodes();

  renderLines();

  closeNodeModal();


  toast(
    "NODE SAVED"
  );
}

const graph =

const world =
  $("world");


let zoom=1;

let panX=0;

let panY=0;

let draggingNode=null;

let dragOffsetX=0;

let dragOffsetY=0;

let panning=false;

let panStartX=0;

let panStartY=0;

let linkSource=null;


function applyWorld(){

  world.style.transform =
    `
      translate(
        calc(-50% + ${panX}px),
        calc(-50% + ${panY}px)
      )
      scale(${zoom})
    `;

function getGraphCenter(){

  return {

    x:
      -panX/zoom,

    y:
      -panY/zoom

  };
}

        </button>

        </div>

        );

          event.stopPropagation();

            )

/* ==========================================================
   DRAG
========================================================== */

function startNodeDrag(
  event,
  node
){

  event.preventDefault();


  draggingNode =
    node;


  node._dragging =
    true;


  const rect =
    graph.getBoundingClientRect();


  const graphX =
    (
      event.clientX -
      rect.left -
      rect.width/2 -
      panX
    )/zoom;


  const graphY =
    (
      event.clientY -
      rect.top -
      rect.height/2 -
      panY
    )/zoom;


  dragOffsetX =
    node.x -
    graphX;


  dragOffsetY =
    node.y -
    graphY;


  const el =
    world.querySelector(
      `[data-id="${node.id}"]`
    );


  if(el){

    el.classList.add(
      "dragging"
    );
  }


  window.addEventListener(
    "pointermove",
    moveNode
  );


  window.addEventListener(
    "pointerup",
    stopNodeDrag,
    {
      once:true
    }
  );
}


function moveNode(event){

  if(!draggingNode)
    return;


  const rect =
    graph.getBoundingClientRect();


  const graphX =
    (
      event.clientX -
      rect.left -
      rect.width/2 -
      panX
    )/zoom;


  const graphY =
    (
      event.clientY -
      rect.top -
      rect.height/2 -
      panY
    )/zoom;


  draggingNode.x =
    graphX +
    dragOffsetX;


  draggingNode.y =
    graphY +
    dragOffsetY;


  const el =
    world.querySelector(
      `[data-id="${draggingNode.id}"]`
    );


  if(el){

    el.style.left =
      (
        draggingNode.x+
        5000
      )+"px";


    el.style.top =
      (
        draggingNode.y+
        5000
      )+"px";
  }


  renderLines();
}


function stopNodeDrag(){

  if(!draggingNode)
    return;


  const el =
    world.querySelector(
      `[data-id="${draggingNode.id}"]`
    );


  if(el){

    el.classList.remove(
      "dragging"
    );
  }


  draggingNode._dragging =
    false;


  draggingNode=null;


  window.removeEventListener(
    "pointermove",
    moveNode
  );


  saveDB();

  saveCurrentProject();

  renderLines();
}


/* ==========================================================
   DELETE NODE
========================================================== */

function deleteNode(id){

  const node =
    db.nodes[id];


  if(!node)
    return;


  if(
    !confirm(
      `DELETE NODE "${node.title}"?`
    )
  )
    return;


  delete db.nodes[id];


  db.links =
    db.links.filter(
      link =>
        link.a !== id &&
        link.b !== id
    );


  saveDB();

  saveCurrentProject();

  renderNodes();

  renderLines();


  toast(
    "NODE DELETED"
  );
}


/* ==========================================================
   LINK
========================================================== */

function handleLinkDot(id){

  if(!linkSource){

    linkSource =
      id;


    highlightNode(
      id
    );


    toast(
      "SELECT ANOTHER NODE"
    );


    return;
  }


  if(
    linkSource ===
    id
  ){

    linkSource=null;

    clearHighlights();

    return;
  }


  const exists =
    db.links.some(
      link =>
        (
          link.a ===
            linkSource &&
          link.b ===
            id
        ) ||
        (
          link.a ===
            id &&
          link.b ===
            linkSource
        )
    );


  if(!exists){

    db.links.push({

      a:
        linkSource,

      b:
        id

    });


    saveDB();

    saveCurrentProject();

    renderLines();


    toast(
      "NODES LINKED"
    );
  }


  linkSource=null;

  clearHighlights();
}


function highlightNode(id){

  clearHighlights();


  const el =
    world.querySelector(
      `[data-id="${id}"]`
    );


  if(el){

    el.classList.add(
      "highlight"
    );
  }
}


function clearHighlights(){

  world
    .querySelectorAll(
      ".node.highlight"
    )
    .forEach(
      el =>
        el.classList.remove(
          "highlight"
        )
    );
}


/* ==========================================================
   LINES
========================================================== */

function renderLines(){

  const svg =
    $("lines");


  if(!svg)
    return;


  svg.innerHTML =
    "";


  db.links.forEach(
    (
      link,
      index
    )=>{

      const a =
        db.nodes[
          link.a
        ];


      const b =
        db.nodes[
          link.b
        ];


      if(!a || !b)
        return;


      const ax =
        a.x+5000;


      const ay =
        a.y+5000;


      const bx =
        b.x+5000;


      const by =
        b.y+5000;


      const dx =
        bx-ax;


      const dy =
        by-ay;


      const length =
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(!length)
        return;


      const nx =
        -dy/length;


      const ny =
        dx/length;


      const bend =
        Math.min(
          55,
          Math.max(
            20,
            length*.1
          )
        );


      const mx =
        (ax+bx)/2;


      const my =
        (ay+by)/2;


      const cx =
        mx+
        nx*bend;


      const cy =
        my+
        ny*bend;


      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );


      path.setAttribute(
        "d",
        `
          M ${ax} ${ay}
          Q ${cx} ${cy}
            ${bx} ${by}
        `
      );


      path.setAttribute(
        "fill",
        "none"
      );


      path.setAttribute(
        "stroke",
        "rgba(255,255,255,.30)"
      );


      path.setAttribute(
        "stroke-width",
        "1.5"
      );


      path.setAttribute(
        "stroke-dasharray",
        "5 7"
      );


      path.classList.add(
        "graph-line",
        "graph-line-flow"
      );


      path.style.animationDelay =
        (
          index*.035
        )+"s";


      svg.appendChild(
        path
      );
    }
  );
}


/* ==========================================================
   GRAPH ANIMATION
========================================================== */

function animateNewGraph(
  rootId
){

  const nodes =
    Array.from(
      world.querySelectorAll(
        ".node"
      )
    );


  nodes.forEach(
    (
      el,
      index
    )=>{

      el.style.opacity =
        "0";


      el.style.transform =
        "translate(-50%,-50%) scale(.82)";


      el.style.transition =
        `
          opacity .45s ease,
          transform .55s cubic-bezier(.2,.8,.2,1)
        `;


      setTimeout(
        ()=>{

          el.style.opacity =
            "1";


          el.style.transform =
            "translate(-50%,-50%) scale(1)";

        },
        80+
        index*45
      );
    }
  );


  setTimeout(
    renderLines,
    300
  );
}


/* ==========================================================
   PAN / ZOOM
========================================================== */

graph.addEventListener(
  "pointerdown",
  event=>{

    if(
      event.target.closest(
        ".node"
      )
    )
      return;


    panning=true;


    panStartX =
      event.clientX-
      panX;


    panStartY =
      event.clientY-
      panY;


    graph.setPointerCapture(
      event.pointerId
    );
  }
);


graph.addEventListener(
  "pointermove",
  event=>{

    if(!panning)
      return;


    panX =
      event.clientX-
      panStartX;


    panY =
      event.clientY-
      panStartY;


    applyWorld();

    renderLines();
  }
);


graph.addEventListener(
  "pointerup",
  ()=>{
    panning=false;

    saveDB();

    saveCurrentProject();
  }
);


graph.addEventListener(
  "wheel",
  event=>{

    event.preventDefault();


    const oldZoom =
      zoom;


    zoom +=
      event.deltaY < 0
        ? .08
        : -.08;


    zoom =
      Math.max(
        .35,
        Math.min(
          2.5,
          zoom
        )
      );


    if(
      oldZoom !==
      zoom
    ){

      applyWorld();

      renderLines();
    }

  },
  {
    passive:false
  }
);


function centerGraph(){

  zoom=1;

  panX=0;

  panY=0;


  applyWorld();

  renderLines();
}


/* ==========================================================
   SEARCH
========================================================== */

$("chainSearch")
.addEventListener(
  "input",
  event=>{

    const query =
      event.target.value
        .trim()
        .toLowerCase();


    world
      .querySelectorAll(
        ".node"
      )
      .forEach(
        el=>{

          const id =
            el.dataset.id;


          const node =
            db.nodes[id];


          if(!query){

            el.classList.remove(
              "highlight"
            );

            return;
          }


          const text =
            (
              node.title+
              " "+
              node.type+
              " "+
              node.content
            )
            .toLowerCase();


          el.classList.toggle(
            "highlight",
            text.includes(
              query
            )
          );
        }
      );
  }
);


/* ==========================================================
   SATURN
========================================================== */

const canvas =
  $("saturn");


const ctx =
  canvas.getContext(
    "2d"
  );


let particles=[];

let rotation=0;


function resizeSaturn(){

  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    rect.width*dpr;


  canvas.height =
    rect.height*dpr;


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  createParticles(
    rect.width,
    rect.height
  );
}


function createParticles(
  width,
  height
){

  particles=[];


  const count=1100;


  const radius =
    Math.min(
      width,
      height
    )*.28;


  for(
    let i=0;
    i<count;
    i++
  ){

    const u =
      Math.random()*2-1;


    const angle =
      Math.random()*
      Math.PI*2;


    const r =
      Math.sqrt(
        1-u*u
      );


    const x =
      r*
      Math.cos(angle);


    const y=u;


    const z =
      r*
      Math.sin(angle);


    particles.push({

      x,
      y,
      z,

      size:
        .45+
        Math.random()*1.15,

      alpha:
        .15+
        Math.random()*.65
    });
  }
}


function drawSaturn(){

  const width =
    canvas.clientWidth;


  const height =
    canvas.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const cx =
    width/2;


  const cy =
    height/2;


  const radius =
    Math.min(
      width,
      height
    )*.28;


  rotation +=
    .00065;


  for(
    const p of particles
  ){

    const c =
      Math.cos(
        rotation
      );


    const s =
      Math.sin(
        rotation
      );


    const x =
      p.x*c-
      p.z*s;


    const z =
      p.x*s+
      p.z*c;


    const scale =
      .55+
      (z+1)*.23;


    const px =
      cx+
      x*
      radius*
      scale;


    const py =
      cy+
      p.y*
      radius*
      scale;


    const alpha =
      Math.max(
        .04,
        p.alpha*
        (
          .45+
          (z+1)*.28
        )
      );


    ctx.beginPath();


    ctx.arc(
      px,
      py,
      p.size*
      scale,
      0,
      Math.PI*2
    );


    ctx.fillStyle =
      `rgba(255,255,255,${alpha})`;


    ctx.fill();
  }


  requestAnimationFrame(
    drawSaturn
  );
}


window.addEventListener(
  "resize",
  resizeSaturn
);


/* ==========================================================
   SATURN RING
========================================================== */

let ringTime=0;


function animateRing(){

  ringTime +=
    .016;


  const degrees =
    (
      ringTime*.75
    )%360;


  $("saturnRing")
    .style.transform =
      `
        translate(-50%,-50%)
        rotateX(67deg)
        rotateZ(
          ${-15+degrees}deg
        )
      `;


  requestAnimationFrame(
    animateRing
  );
}

   INIT
========================================================== */

function init(){

  updateProfileUI();

  applyWorld();

  renderNodes();

  renderLines();

  resizeSaturn();

  drawSaturn();

  animateRing();

  initBoot();
}


init();
