<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>NZX OSINT TOOL</title>

<style>
:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.94);
  --card:#111;
  --text:#f5f5f5;
  --muted:#777;
  --dim:#444;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Inter,Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
  font:inherit;
  outline:none;
}

button{
  color:#fff;
}

/* =========================================================
   INTRO
========================================================= */

#bootScreen{
  position:fixed;
  inset:0;
  z-index:999999;

  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.intro-wrap{
  width:min(950px,92vw);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:38px;
}

.intro-image{
  width:330px;
  max-width:42vw;

  height:auto;

  display:block;

  opacity:0;
  visibility:hidden;

  animation:introAppear .01s steps(1,end) forwards;
  animation-delay:.15s;
}

@keyframes introAppear{
  from{
    opacity:0;
    visibility:hidden;
  }
  to{
    opacity:1;
    visibility:visible;
  }
}

.intro-text{
  min-width:330px;

  display:flex;
  flex-direction:column;

  gap:10px;
}

.intro-line{
  color:#fff;

  font-family:
    "Courier New",
    monospace;

  font-size:11px;
  font-weight:700;

  letter-spacing:.16em;

  white-space:nowrap;

  opacity:0;
  visibility:hidden;
}

.intro-line:nth-child(1){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:.55s;
}

.intro-line:nth-child(2){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:.85s;
}

.intro-line:nth-child(3){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:1.15s;
}

.intro-line:nth-child(4){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:1.45s;
}

.intro-line:nth-child(5){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:1.75s;
}

.intro-line:nth-child(6){
  animation:introLine .01s steps(1,end) forwards;
  animation-delay:2.05s;
}

@keyframes introLine{
  from{
    opacity:0;
    visibility:hidden;
  }
  to{
    opacity:1;
    visibility:visible;
  }
}

/* =========================================================
   APP INTRO ENTER ANIMATION
========================================================= */

#app{
  width:100%;
  height:100%;

  position:relative;

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,.025),
      transparent 35%
    ),
    #050505;

  opacity:0;
  visibility:hidden;
}

#app.app-ready{
  visibility:visible;
  animation:appAppear .8s ease-out forwards;
}

@keyframes appAppear{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  position:absolute;

  left:0;
  right:0;
  top:0;

  height:68px;

  z-index:100;

  display:flex;
  align-items:center;

  padding:0 18px;

  background:rgba(5,5,5,.84);

  backdrop-filter:blur(14px);

  border-bottom:1px solid var(--line);
}

.logo{
  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.3);

  background:#0b0b0b;

  font-weight:900;
  font-size:19px;

  margin-right:11px;
}

.brand{
  display:flex;
  flex-direction:column;

  gap:2px;
}

.brand b{
  font-size:12px;
  letter-spacing:.12em;
}

.brand small{
  color:#555;
  font-size:8px;
  letter-spacing:.2em;
}

.top-tools{
  margin-left:auto;

  display:flex;
  align-items:center;

  gap:8px;
}

.top-btn,
.btn{
  height:34px;

  padding:0 13px;

  background:#090909;

  border:1px solid var(--line2);

  color:#ddd;

  cursor:pointer;

  font-size:9px;

  letter-spacing:.12em;

  transition:.15s;
}

.top-btn:hover,
.btn:hover{
  background:#171717;
  border-color:#555;
  color:#fff;
}

.profile-mini{
  width:34px;
  height:34px;

  margin-left:8px;

  padding:0;

  overflow:hidden;

  cursor:pointer;

  background:#0b0b0b;

  border:1px solid var(--line2);
}

.profile-mini img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:absolute;

  z-index:90;

  left:0;
  top:68px;
  bottom:0;

  width:58px;

  border-right:1px solid var(--line);

  background:rgba(6,6,6,.9);

  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top:14px;

  gap:8px;
}

.side-btn{
  width:38px;
  height:38px;

  background:#090909;

  border:1px solid var(--line);

  color:#777;

  cursor:pointer;

  font-size:18px;
}

.side-btn:hover,
.side-btn.active{
  color:#fff;
  border-color:#555;
  background:#151515;
}

/* =========================================================
   PAGES
========================================================= */

.page{
  position:absolute;

  left:58px;
  right:0;
  top:68px;
  bottom:0;

  display:none;
}

.page.active{
  display:block;
}

/* =========================================================
   GRAPH PAGE
========================================================= */

.chain-page{
  background:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    #050505;

  background-size:50px 50px;
}

.chain-toolbar{
  position:absolute;

  z-index:80;

  top:15px;
  left:15px;
  right:15px;

  display:flex;
  align-items:center;

  gap:7px;

  pointer-events:none;
}

.chain-toolbar>*{
  pointer-events:auto;
}

.chain-search{
  width:230px;
  height:34px;

  padding:0 11px;

  background:rgba(7,7,7,.92);

  border:1px solid var(--line2);

  color:#fff;

  font-size:10px;
}

.chain-search::placeholder{
  color:#555;
}

/* =========================================================
   GRAPH
========================================================= */

.graph{
  position:absolute;

  inset:0;

  overflow:hidden;

  cursor:grab;

  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.025),
      transparent 28%
    );
}

.graph.dragging{
  cursor:grabbing;
}

.world{
  position:absolute;

  left:50%;
  top:50%;

  width:10000px;
  height:10000px;

  transform:
    translate(-50%,-50%)
    scale(1);

  transform-origin:center;
}

.lines{
  position:absolute;

  left:0;
  top:0;

  width:10000px;
  height:10000px;

  overflow:visible;

  pointer-events:none;

  z-index:1;
}

.node{
  position:absolute;

  z-index:5;

  width:190px;
  min-height:74px;

  transform:translate(-50%,-50%);

  background:rgba(9,9,9,.96);

  border:1px solid rgba(255,255,255,.18);

  padding:11px 12px;

  cursor:pointer;

  user-select:none;

  box-shadow:
    0 10px 35px rgba(0,0,0,.45);

  transition:
    border-color .15s,
    background .15s,
    box-shadow .15s;
}

.node:hover{
  border-color:rgba(255,255,255,.5);

  background:#111;
}

.node.selected{
  border-color:#fff;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.15),
    0 0 35px rgba(255,255,255,.08);
}

.node-title{
  font-size:10px;
  font-weight:800;

  letter-spacing:.1em;

  margin-bottom:7px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.node-value{
  color:#999;

  font-size:10px;

  line-height:1.45;

  word-break:break-word;
}

.node-type{
  color:#555;

  font-size:7px;

  margin-top:7px;

  text-transform:uppercase;

  letter-spacing:.15em;
}

/* =========================================================
   FIXED SVG CONNECTIONS
========================================================= */

.edge{
  fill:none;

  stroke:rgba(255,255,255,.48);

  stroke-width:2;

  stroke-linecap:round;

  stroke-dasharray:8 8;

  vector-effect:non-scaling-stroke;

  animation:
    edgeMove 1.4s linear infinite;
}

.edge.active{
  stroke:#fff;

  stroke-width:2.5;
}

@keyframes edgeMove{
  from{
    stroke-dashoffset:0;
  }

  to{
    stroke-dashoffset:-32;
  }
}

/* =========================================================
   SATURN
========================================================= */

.saturn{
  position:absolute;

  z-index:0;

  left:50%;
  top:50%;

  width:470px;
  height:470px;

  transform:
    translate(-50%,-50%);

  opacity:.62;

  pointer-events:none;

  filter:
    drop-shadow(
      0 0 35px
      rgba(255,255,255,.08)
    );
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;

  left:50%;
  top:50%;

  width:360px;
  height:105px;

  border-radius:50%;

  border:
    1px solid
    rgba(255,255,255,.14);

  box-shadow:
    0 0 20px
    rgba(255,255,255,.05);

  transform:
    translate(-50%,-50%)
    rotateX(67deg);

  transform-style:preserve-3d;

  opacity:.65;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-page{
  padding:25px;

  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(255,255,255,.04),
      transparent 35%
    ),
    #050505;
}

.profile-card{
  max-width:650px;

  background:#090909;

  border:1px solid var(--line);

  padding:25px;
}

.profile-avatar{
  width:80px;
  height:80px;

  border:1px solid var(--line2);

  object-fit:cover;

  background:#111;

  margin-bottom:17px;
}

.profile-name{
  font-size:20px;
  font-weight:800;

  letter-spacing:.05em;
}

.profile-sub{
  color:#666;

  font-size:9px;

  letter-spacing:.15em;

  margin-top:5px;
}

.profile-info{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:25px;
}

.info-box{
  padding:13px;

  background:#0d0d0d;

  border:1px solid var(--line);
}

.info-box small{
  display:block;

  color:#555;

  font-size:7px;

  letter-spacing:.15em;

  margin-bottom:6px;
}

.info-box b{
  font-size:10px;

  word-break:break-word;
}

/* =========================================================
   MODALS
========================================================= */

.modal-backdrop{
  position:fixed;

  z-index:500;

  inset:0;

  background:rgba(0,0,0,.72);

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(560px,95vw);

  max-height:90vh;

  overflow:auto;

  background:#090909;

  border:1px solid var(--line2);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.7);
}

.modal-head{
  min-height:55px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 17px;

  border-bottom:1px solid var(--line);
}

.modal-head b{
  font-size:11px;

  letter-spacing:.13em;
}

.close-btn{
  width:30px;
  height:30px;

  background:#111;

  border:1px solid var(--line);

  color:#888;

  cursor:pointer;
}

.close-btn:hover{
  color:#fff;

  border-color:#555;
}

.modal-body{
  padding:17px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;

  margin-bottom:6px;

  color:#777;

  font-size:8px;

  letter-spacing:.15em;

  text-transform:uppercase;
}

.form-input,
.form-textarea{
  width:100%;

  background:#050505;

  border:1px solid var(--line2);

  color:#fff;

  padding:10px;

  font-size:10px;
}

.form-textarea{
  min-height:100px;

  resize:vertical;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:7px;

  margin-top:15px;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:fixed;

  z-index:1000;

  right:18px;
  bottom:18px;

  max-width:330px;

  background:#101010;

  border:1px solid var(--line2);

  color:#fff;

  padding:12px 15px;

  font-size:9px;

  letter-spacing:.05em;

  display:none;
}

#toast.show{
  display:block;
}

@media(max-width:900px){

  .top-tools .top-btn{
    display:none;
  }

  .brand small{
    display:none;
  }

  .chain-toolbar{
    flex-wrap:wrap;
  }

  .chain-search{
    width:170px;
  }

  .saturn{
    width:390px;
    height:390px;
  }

  .saturn-ring{
    width:300px;
  }
}

@media(max-width:700px){

  .topbar{
    height:58px;

    padding:0 10px;
  }

  .logo{
    width:32px;
    height:32px;
  }

  .brand b{
    font-size:10px;
  }

  .sidebar{
    top:58px;

    width:48px;
  }

  .page{
    left:48px;
    top:58px;
  }

  .chain-toolbar{
    top:10px;
    left:10px;
    right:10px;
  }

  .chain-search{
    width:150px;
  }

  .btn{
    height:31px;

    padding:0 8px;

    font-size:8px;
  }

  .node{
    width:165px;
  }

  .profile-info{
    grid-template-columns:1fr;
  }

  .intro-wrap{
    gap:18px;
    width:94vw;
  }

  .intro-image{
    width:220px;
    max-width:45vw;
  }

  .intro-text{
    min-width:0;
    gap:7px;
  }

  .intro-line{
    font-size:7px;
    letter-spacing:.09em;
  }
}

@media(max-width:480px){

  .intro-wrap{
    gap:12px;
  }

  .intro-image{
    width:170px;
  }

  .intro-line{
    font-size:6px;
    letter-spacing:.07em;
  }

  .intro-text{
    gap:6px;
  }

  .chain-search{
    width:125px;
  }
}
</style>
</head>

<body>

<!-- =========================================================
     INTRO
========================================================= -->

<div id="bootScreen">

  <div class="intro-wrap">

    <img
      class="intro-image"
      src="https://i.ibb.co/mCnvdM5C/16450-removebg-preview-1.png"
      alt=""
    >

    <div class="intro-text">

      <div class="intro-line">
        CONNECTION ESTABLISHED
      </div>

      <div class="intro-line">
        SYSTEM INITIALIZED
      </div>

      <div class="intro-line">
        SCANNING NETWORK
      </div>

      <div class="intro-line">
        ANALYZING DATA
      </div>

      <div class="intro-line">
        ACCESSING NZX OSINT
      </div>

      <div class="intro-line">
        YOU HAVE BEEN NOTICED
      </div>

    </div>

  </div>

</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="app">

<header class="topbar">

  <div class="logo">N</div>

  <div class="brand">
    <b>NZX OSINT TOOL</b>
    <small>INTELLIGENCE WORKSPACE</small>
  </div>

  <div class="top-tools">

    <button
      class="top-btn"
      onclick="openTool('phone')"
    >
      CHECK NUMBER
    </button>

    <button
      class="top-btn"
      onclick="openTool('address')"
    >
      CHECK ADDRESS
    </button>

  </div>

  <button
    class="profile-mini"
    onclick="openProfile()"
  >
    <img
      id="miniAvatar"
      alt=""
    >
  </button>

</header>


<aside class="sidebar">

  <button
    class="side-btn active"
    data-page="chain"
    onclick="showPage('chain')"
  >
    ⌘
  </button>

  <button
    class="side-btn"
    data-page="profile"
    onclick="openProfile()"
  >
    ◎
  </button>

</aside>


<section
  class="page chain-page active"
  id="chainPage"
>

  <div class="chain-toolbar">

    <input
      class="chain-search"
      id="chainSearch"
      placeholder="Search chain or node..."
      autocomplete="off"
    >

    <button
      class="btn"
      onclick="openNodeModal()"
    >
      ＋ NODE
    </button>

    <button
      class="btn"
      onclick="centerGraph()"
    >
      ⌂
    </button>

    <button
      class="btn"
      onclick="createProject()"
    >
      CREATE PROJECT
    </button>

    <button
      class="btn"
      onclick="showProjects()"
    >
      MY PROJECTS
    </button>

    <button
      class="btn"
      onclick="deleteProject()"
    >
      DELETE PROJECT
    </button>

    <button
      class="btn"
      onclick="deleteAllNodes()"
    >
      DELETE ALL NODES
    </button>

  </div>


  <div
    class="graph"
    id="graph"
  >

    <div class="saturn">

      <canvas
        id="saturn"
      ></canvas>

      <div
        class="saturn-ring"
        id="saturnRing"
      ></div>

    </div>


    <div
      class="world"
      id="world"
    >

      <svg
        class="lines"
        id="lines"
        width="10000"
        height="10000"
        viewBox="0 0 10000 10000"
        preserveAspectRatio="none"
      ></svg>

    </div>

  </div>

</section>


<section
  class="page profile-page"
  id="profilePage"
>

  <div class="profile-card">

    <img
      id="profileAvatar"
      class="profile-avatar"
      alt=""
    >

    <div
      class="profile-name"
      id="profileName"
    >
      NZX USER
    </div>

    <div class="profile-sub">
      OSINT WORKSPACE PROFILE
    </div>


    <div class="profile-info">

      <div class="info-box">

        <small>
          USER ID
        </small>

        <b id="profileId">
          —
        </b>

      </div>


      <div class="info-box">

        <small>
          PROJECT
        </small>

        <b id="profileProject">
          Default Project
        </b>

      </div>


      <div class="info-box">

        <small>
          NODES
        </small>

        <b id="profileNodes">
          0
        </b>

      </div>


      <div class="info-box">

        <small>
          STATUS
        </small>

        <b>
          ONLINE
        </b>

      </div>

    </div>

  </div>

</section>

</div>


<div
  class="modal-backdrop"
  id="nodeModal"
>

  <div class="modal">

    <div class="modal-head">

      <b>
        CREATE NODE
      </b>

      <button
        class="close-btn"
        onclick="closeModal('nodeModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-group">

        <label>
          NODE TYPE
        </label>

        <input
          class="form-input"
          id="nodeType"
          placeholder="PERSON / PHONE / EMAIL / ADDRESS"
        >

      </div>


      <div class="form-group">

        <label>
          VALUE
        </label>

        <input
          class="form-input"
          id="nodeValue"
          placeholder="Enter value..."
        >

      </div>


      <div class="form-group">

        <label>
          NOTE
        </label>

        <textarea
          class="form-textarea"
          id="nodeNote"
          placeholder="Optional note..."
        ></textarea>

      </div>


      <div class="modal-actions">

        <button
          class="btn"
          onclick="closeModal('nodeModal')"
        >
          CANCEL
        </button>

        <button
          class="btn"
          onclick="createNode()"
        >
          CREATE
        </button>

      </div>

    </div>

  </div>

</div>


<div
  class="modal-backdrop"
  id="toolModal"
>

  <div class="modal">

    <div class="modal-head">

      <b id="toolTitle">
        OSINT TOOL
      </b>

      <button
        class="close-btn"
        onclick="closeModal('toolModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-group">

        <label id="toolLabel">
          VALUE
        </label>

        <input
          class="form-input"
          id="toolInput"
          autocomplete="off"
        >

      </div>


      <div
        id="toolResult"
        style="
          display:none;
          border:1px solid rgba(255,255,255,.1);
          background:#050505;
          padding:13px;
          font-size:10px;
          line-height:1.6;
          color:#aaa;
          white-space:pre-wrap;
          word-break:break-word;
        "
      ></div>


      <div class="modal-actions">

        <button
          class="btn"
          onclick="closeModal('toolModal')"
        >
          CLOSE
        </button>

        <button
          class="btn"
          onclick="runTool()"
        >
          RUN CHECK
        </button>

/* =========================================================
   NODE
========================================================= */

function makeId(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function createNode(){

  const type =
    $("nodeType")
      .value
      .trim() ||
    "CUSTOM";

  const value =
    $("nodeValue")
      .value
      .trim();

  const note =
    $("nodeNote")
      .value
      .trim();

  if(!value){

    toast(
      "Enter node value."
    );

    return;

  }

  let x = 0;
  let y = 0;

  if(nodes.length){

    const last =
      nodes[
        nodes.length - 1
      ];

    x =
      Number(last.x || 0) +
      330;

    y =
      Number(last.y || 0);

  }

  const node = {

    id:makeId(),

    type,
    value,
    note,

    x,
    y,

    createdAt:Date.now()

  };

  nodes.push(
    node
  );

  if(nodes.length > 1){

    const candidates =
      nodes.filter(
        n =>
          n.id !== node.id
      );

    const nearest =
      findNearestNode(
        node,
        candidates
      );

    if(nearest){

      addLink(
        nearest.id,
        node.id
      );

    }

  }

  closeModal(
    "nodeModal"
  );

  saveCurrentProject();

  renderNodes();
  renderLines();

  toast(
    "Node created."
  );

}


function findNearestNode(
  node,
  candidates
){

  let nearest = null;

  let shortest =
    Infinity;

  candidates.forEach(
    other=>{

      const dx =
        Number(node.x) -
        Number(other.x);

      const dy =
        Number(node.y) -
        Number(other.y);

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      if(
        distance < shortest
      ){

        shortest =
          distance;

        nearest =
          other;

      }

    }
  );

  return nearest;

}


function getNode(id){

  return nodes.find(
    n =>
      n.id === id
  );

}


function addLink(
  source,
  target
){

  if(
    source === target
  ){
    return;
  }

  const exists =
    links.some(
      link =>
        (
          link.source === source &&
          link.target === target
        ) ||
        (
          link.source === target &&
          link.target === source
        )
    );

  if(exists){
    return;
  }

  links.push({

    id:makeId(),

    source,
    target

  });

}


function removeNode(id){

  nodes =
    nodes.filter(
      node =>
        node.id !== id
    );

  links =
    links.filter(
      link =>
        link.source !== id &&
        link.target !== id
    );

  if(
    selectedNode === id
  ){
    selectedNode = null;
  }

  saveCurrentProject();

  renderNodes();
  renderLines();

}


function editNode(node){

/* =========================================================
   LINE ENGINE
========================================================= */

function getCenterPoint(node){

  return {

    x:
      Number(node.x) +
      5000,

    y:
      Number(node.y) +
      5000

  };

}


function buildCurvePath(
  a,
  b
){

  const p1 =
    getCenterPoint(a);

  const p2 =
    getCenterPoint(b);

  const dx =
    p2.x - p1.x;

  const dy =
    p2.y - p1.y;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  const curve =
    Math.max(
      70,
      Math.min(
        260,
        distance * .35
      )
    );

  let c1x;
  let c1y;
  let c2x;
  let c2y;

  if(
    Math.abs(dx) >=
    Math.abs(dy)
  ){

    const direction =
      dx >= 0
        ? 1
        : -1;

    c1x =
      p1.x +
      curve *
      direction;

    c1y =
      p1.y;

    c2x =
      p2.x -
      curve *
      direction;

    c2y =
      p2.y;

  }else{

    const direction =
      dy >= 0
        ? 1
        : -1;

    c1x =
      p1.x;

    c1y =
      p1.y +
      curve *
      direction;

    c2x =
      p2.x;

    c2y =
      p2.y -
      curve *
      direction;

  }

  return `
    M ${p1.x} ${p1.y}
    C
      ${c1x} ${c1y},
      ${c2x} ${c2y},
      ${p2.x} ${p2.y}
  `;

}


function renderLines(){

  const svg =
    $("lines");

  if(!svg){
    return;
  }

  svg.innerHTML = "";

  svg.setAttribute(
    "viewBox",
    "0 0 10000 10000"
  );

  svg.setAttribute(
    "width",
    "10000"
  );

  svg.setAttribute(
    "height",
    "10000"
  );

  links.forEach(
    link=>{

      const source =
        getNode(
          link.source
        );

      const target =
        getNode(
          link.target
        );

      if(
        !source ||
        !target
      ){
        return;
      }

      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      path.setAttribute(
        "d",
        buildCurvePath(
          source,
          target
        )
      );

      path.setAttribute(
        "fill",
        "none"
      );

      path.setAttribute(
        "class",
        "edge" +
        (
          selectedNode &&
          (
            source.id === selectedNode ||
            target.id === selectedNode
          )
            ? " active"
            : ""
        )
      );

      svg.appendChild(
        path
      );

    }
  );

}


/* =========================================================
   PHONE LAYOUT
========================================================= */

function layoutPhoneData(
  root,
  metadata
){

  const valid =
    metadata.filter(
      item =>
        item &&
        item.value !== undefined &&
        item.value !== null &&
        String(
          item.value
        ).trim() !== ""
    );

  const perColumn = 5;

  const columnGap = 420;

  const rowGap = 125;

  root.x = 0;
  root.y = 0;

  valid.forEach(
    (item,index)=>{

      const column =
        Math.floor(
          index /
          perColumn
        );

      const row =
        index %
        perColumn;

      const columnItems =
        Math.min(
          perColumn,
          valid.length -
          column *
          perColumn
        );

      const y =
        (
          row -
          (columnItems - 1) / 2
        ) *
        rowGap;

      let existing =
        nodes.find(
          n =>
            n.type === item.type &&
            n.value ===
              String(item.value)
        );

      if(!existing){

        existing = {

          id:makeId(),

          type:
            item.type ||
            "DATA",

          value:
            String(
              item.value
            ),

          note:
            item.note ||
            "",

          x:
            (column + 1) *
            columnGap,

          y,

          createdAt:
            Date.now()

        };

        nodes.push(
          existing
        );

      }else{

        existing.x =
          (column + 1) *
          columnGap;

        existing.y =
          y;

      }

      const previousCandidates =
        nodes.filter(
          n =>
            n.id !== existing.id &&
            Number(n.x) <
              Number(existing.x)
        );

      if(
        previousCandidates.length
      ){

        const nearest =
          findNearestNode(
            existing,
            previousCandidates
          );

        if(nearest){

          addLink(
            nearest.id,
            existing.id
          );

        }

      }

    }
  );

}

/* =========================================================
   RUN TOOL
========================================================= */

async function runTool(){

  const value =
    $("toolInput")
      .value
      .trim();

  if(!value){

    toast(
      "Enter a value."
    );

    return;

  }

  const result =
    $("toolResult");

  result.style.display =
    "block";

  result.textContent =
    "PROCESSING...";

  if(
    activeTool === "phone"
  ){

    try{

      const body =
        new URLSearchParams();

      body.append(
        "phone",
        value
      );

      const response =
        await fetch(
          "/api/osint/phone",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },

            body
          }
        );

      const data =
        await response.json();

      if(!response.ok){

        result.textContent =
          data.detail ||
          "Phone lookup failed.";

        return;

      }

      result.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

      addPhoneResultToGraph(
        value,
        data
      );

    }catch(error){

      console.error(error);

      result.textContent =
        "REQUEST ERROR\n\n" +
        error.message;

    }

    return;

  }


  if(
    activeTool === "address"
  ){

    try{

      const response =
        await fetch(
          "/api/map/search?q=" +
          encodeURIComponent(
            value
          )
        );

      const data =
        await response.json();

      if(!response.ok){

        result.textContent =
          data.detail ||
          "Address lookup failed.";

        return;

      }

      result.textContent =
        JSON.stringify(
          data,
          null,
          2
        );

      addAddressResultToGraph(
        value,
        data
      );

    }catch(error){

      console.error(error);

      result.textContent =
        "REQUEST ERROR\n\n" +
        error.message;

    }

  }

}


/* =========================================================
   PHONE -> GRAPH
========================================================= */

function addPhoneResultToGraph(
  phone,
  data
){

  let root =
    nodes.find(
      node =>
        node.type === "PHONE" &&
        node.value === phone
    );

  if(!root){

    root = {

      id:makeId(),

      type:"PHONE",

      value:phone,

      note:"Phone lookup",

      x:0,
      y:0,

      createdAt:
        Date.now()

    };

    nodes.push(
      root
    );

  }

  const metadata = [];

  function collect(
    object,
    prefix=""
  ){

    if(
      object === null ||
      object === undefined
    ){
      return;
    }

    if(
      typeof object !== "object"
    ){

      metadata.push({

        type:
          prefix
            .replaceAll(
              "_",
              " "
            )
            .toUpperCase(),

        value:
          String(
            object
          )

      });

      return;

    }

    if(
      Array.isArray(object)
    ){

      object.forEach(
        (item,index)=>{
          collect(
            item,
            `${prefix}_${index}`
          );
        }
      );

      return;

    }

    Object.entries(
      object
    ).forEach(
      ([key,value])=>{

        collect(
          value,
          key
        );

      }
    );

  }

  collect(
    data
  );

  const unique = [];
  const seen = new Set();

  metadata.forEach(
    item=>{

      const key =
        item.type +
        "|" +
        item.value;

      if(
        seen.has(key)
      ){
        return;
      }

      seen.add(key);

      unique.push(
        item
      );

    }
  );

  layoutPhoneData(
    root,
    unique.slice(
      0,
      30
    )
  );

  saveCurrentProject();

  renderNodes();
  renderLines();

  toast(
    "Phone data added."
  );

}


/* =========================================================
   ADDRESS -> GRAPH
========================================================= */

function addAddressResultToGraph(
  address,
  data
){

  let root =
    nodes.find(
      node =>
        node.type === "ADDRESS" &&
        node.value === address
    );

  if(!root){

    root = {

      id:makeId(),

      type:"ADDRESS",

      value:address,

      note:"Address lookup",

      x:0,
      y:0,

      createdAt:
        Date.now()

    };

    nodes.push(
      root
    );

  }

  const values = [];

  function add(
    type,
    value
  ){

    if(
      value === undefined ||
      value === null
    ){
      return;
    }

    const clean =
      String(
        value
      ).trim();

    if(!clean){
      return;
    }

    values.push({

      type,
      value:clean

    });

  }

  if(
    Array.isArray(data)
  ){

    data.forEach(
      item=>{

        if(!item){
          return;
        }

        add(
          "RESULT",
          item.display_name ||
          item.name ||
          item.address ||
          JSON.stringify(item)
        );

      }
    );

  }else if(
    data &&
    typeof data === "object"
  ){

    Object.entries(
      data
    ).forEach(
      ([key,value])=>{

        if(
          typeof value !==
          "object"
        ){

          add(
            key.toUpperCase(),
            value
          );

        }

      }
    );

  }

  values
    .slice(0,30)
    .forEach(
      (item,index)=>{

        const node = {

          id:makeId(),

          type:item.type,

          value:item.value,

          note:
            "Address lookup result",

          x:420,

          y:
            (
              index -
              (
                Math.min(
                  values.length,
                  30
                ) - 1
              ) / 2
            ) *
            125,

          createdAt:
            Date.now()

        };

        nodes.push(
          node
        );

        addLink(
          root.id,
          node.id
        );

      }
    );

  saveCurrentProject();

  renderNodes();
  renderLines();

  toast(
    "Address data added."
  );

}


/* =========================================================
   GRAPH ZOOM / PAN
========================================================= */

function applyWorld(){

  $("world").style.transform =
    `
      translate(
        calc(-50% + ${graphX}px),
        calc(-50% + ${graphY}px)
      )
      scale(${graphScale})
    `;

}


function centerGraph(){

  graphScale = 1;

  graphX = 0;
  graphY = 0;

  applyWorld();

}


function zoomGraph(
  delta,
  centerX,
  centerY
){

  const oldScale =
    graphScale;

  graphScale =
    Math.max(
      .35,
      Math.min(
        2.5,
        graphScale +
        delta
      )
    );

  if(
    centerX !== undefined &&
    centerY !== undefined
  ){

    const factor =
      graphScale /
      oldScale;

    graphX =
      centerX -
      (
        centerX -
        graphX
      ) *
      factor;

    graphY =
      centerY -
      (
        centerY -
        graphY
      ) *
      factor;

  }

  applyWorld();

}


/* =========================================================
   MOUSE GRAPH
========================================================= */

$("graph")
  .addEventListener(
    "mousedown",
    event=>{

      if(
        event.target.closest(
          ".node"
        )
      ){
        return;
      }

      draggingGraph =
        true;

      $("graph")
        .classList
        .add("dragging");

      dragStartX =
        event.clientX;

      dragStartY =
        event.clientY;

      dragOriginX =
        graphX;

      dragOriginY =
        graphY;

    }
  );


window.addEventListener(
  "mousemove",
  event=>{

    if(
      !draggingGraph
    ){
      return;
    }

    graphX =
      dragOriginX +
      (
        event.clientX -
        dragStartX
      );

    graphY =
      dragOriginY +
      (
        event.clientY -
        dragStartY
      );

    applyWorld();

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    draggingGraph =
      false;

    $("graph")
      .classList
      .remove("dragging");

  }
);


$("graph")
  .addEventListener(
    "wheel",
    event=>{

      event.preventDefault();

      const rect =
        $("graph")
          .getBoundingClientRect();

      const cx =
        event.clientX -
        rect.left -
        rect.width / 2;

      const cy =
        event.clientY -
        rect.top -
        rect.height / 2;

      zoomGraph(
        event.deltaY > 0
          ? -.08
          : .08,
        cx,
        cy
      );

    },
    {
      passive:false
    }
  );


/* =========================================================
   SEARCH
========================================================= */

$("chainSearch")
  .addEventListener(
    "input",
    event=>{

      const query =
        event.target.value
          .trim()
          .toLowerCase();

      if(!query){

        selectedNode =
          null;

        renderNodes();
        renderLines();

        return;

      }

      const found =
        nodes.find(
          node =>
            String(
              node.value
            )
            .toLowerCase()
            .includes(query) ||

            String(
              node.type
            )
            .toLowerCase()
            .includes(query) ||

            String(
              node.note || ""
            )
            .toLowerCase()
            .includes(query)
        );

      if(found){

        selectedNode =
          found.id;

        graphX =
          -Number(found.x) *
          graphScale;

        graphY =
          -Number(found.y) *
          graphScale;

        applyWorld();

      }

      renderNodes();
      renderLines();

    }
  );


/* =========================================================
   SATURN
========================================================= */

function resizeSaturn(){

  saturnCanvas =
    $("saturn");

  saturnCtx =
    saturnCanvas.getContext(
      "2d"
    );

  const rect =
    saturnCanvas
      .getBoundingClientRect();

  const dpr =
    window.devicePixelRatio ||
    1;

  saturnCanvas.width =
    rect.width *
    dpr;

  saturnCanvas.height =
    rect.height *
    dpr;

  saturnCtx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  createSaturnParticles();

}


function createSaturnParticles(){

  saturnParticles = [];

  const count = 1100;

  for(
    let i=0;
    i<count;
    i++
  ){

    const theta =
      Math.random() *
      Math.PI *
      2;

    const phi =
      Math.acos(
        2 *
        Math.random() -
        1
      );

    const radius =
      150 +
      (
        Math.random() -
        .5
      ) *
      14;

    saturnParticles.push({

      theta,
      phi,
      radius,

      size:
        Math.random() *
        1.4 +
        .25,

      alpha:
        Math.random() *
        .55 +
        .18

    });

  }

}


function drawSaturn(){

  if(
    !saturnCtx ||
    !saturnCanvas
  ){
    return;
  }

  const rect =
    saturnCanvas
      .getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;

  saturnCtx.clearRect(
    0,
    0,
    width,
    height
  );

  const cx =
    width / 2;

  const cy =
    height / 2;

  saturnParticles.forEach(
    particle=>{

      const x =
        particle.radius *
        Math.sin(
          particle.phi
        ) *
        Math.cos(
          particle.theta +
          saturnRotation
        );

      const y =
        particle.radius *
        Math.sin(
          particle.phi
        ) *
        Math.sin(
          particle.theta +
          saturnRotation
        );

      const z =
        particle.radius *
        Math.cos(
          particle.phi
        );

      const perspective =
        1 +
        z / 700;

      const px =
        cx +
        x *
        perspective;

      const py =
        cy +
        y *
        perspective;

      const size =
        particle.size *
        perspective;

      const alpha =
        Math.max(
          .03,
          particle.alpha *
          (
            .65 +
            z / 400
          )
        );

      saturnCtx.beginPath();

      saturnCtx.arc(
        px,
        py,
        size,
        0,
        Math.PI * 2
      );

      saturnCtx.fillStyle =
        `rgba(255,255,255,${alpha})`;

      saturnCtx.fill();

    }
  );

}


function animateSaturn(){

  saturnRotation +=
    .00065;

  drawSaturn();

  requestAnimationFrame(
    animateSaturn
  );

}


function animateRing(){

  const ring =
    $("saturnRing");

  if(!ring){
    return;
  }

  ringRotation +=
    .055;

  ring.style.transform =
    `
      translate(-50%,-50%)
      rotateX(67deg)
      rotateZ(${ringRotation}deg)
    `;

  requestAnimationFrame(
    animateRing
  );

}

/* =========================================================
   INTRO -> APP
========================================================= */

function startIntro(){

  const boot =
    $("bootScreen");

  const app =
    $("app");

  /*
    Intro lasts 3 seconds.
    At exactly 3 seconds it disappears
    instantly. No fade / no glitch.
  */
  setTimeout(
    ()=>{

      if(boot){

        boot.style.display =
          "none";

        boot.style.visibility =
          "hidden";

      }

      /*
        Start the main site animation.
        Exactly 0.8 seconds.
      */
      if(app){

        app.classList.add(
          "app-ready"
        );

      }

    },
    3000
  );

}


/* =========================================================
   INIT
========================================================= */

function init(){

  loadDB();

  const projects =
    getProjects();

  if(
    !projects[currentProject]
  ){

    projects[currentProject] = {

      nodes:
        JSON.parse(
          JSON.stringify(nodes)
        ),

      links:
        JSON.parse(
          JSON.stringify(links)
        ),

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    };

    saveProjects(
      projects
    );

  }

  updateProfileUI();

  applyWorld();

  renderNodes();

  renderLines();

  resizeSaturn();

  drawSaturn();

  animateSaturn();

  animateRing();

  /*
    Start intro AFTER the whole app
    has been initialized.
  */
  requestAnimationFrame(
    ()=>{
      startIntro();
    }
  );

}


window.addEventListener(
  "resize",
  ()=>{
    resizeSaturn();
    renderLines();
  }
);


init();
