<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>NZX OSINT TOOL</title>

<style>
:root{
    --bg:#050505;
    --panel:#0b0b0b;
    --panel2:#101010;
    --border:#252525;
    --text:#f5f5f5;
    --muted:#777;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

#saturn{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
}

.topbar{
    height:76px;
    border-bottom:1px solid #202020;
    background:rgba(4,4,4,.82);
    backdrop-filter:blur(18px);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 22px;
}

.logo{
    width:42px;
    height:42px;
    border:1px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:21px;
    border-radius:11px;
}

.brand b{
    display:block;
    letter-spacing:2px;
    font-size:14px;
}

.brand small{
    display:block;
    margin-top:3px;
    color:#555;
    letter-spacing:2px;
    font-size:9px;
}

.global-search{
    margin-left:25px;
    width:min(430px,40vw);
    height:40px;
    border:1px solid #242424;
    background:#0a0a0a;
    border-radius:10px;
    display:flex;
    align-items:center;
    padding:0 12px;
}

.global-search span{
    color:#555;
    margin-right:8px;
}

.global-search input{
    width:100%;
    border:0;
    outline:0;
    color:#fff;
    background:transparent;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.btn{
    background:#0d0d0d;
    color:#ddd;
    border:1px solid #292929;
    border-radius:9px;
    padding:10px 13px;
    transition:.2s;
}

.btn:hover{
    border-color:#666;
    transform:translateY(-1px);
}

.btn.primary{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.profile-mini{
    width:40px;
    height:40px;
    padding:0;
    margin-left:8px;
    border:1px solid #444;
    border-radius:50%;
    overflow:hidden;
    background:#111;
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.toolbar{
    position:absolute;
    left:50%;
    top:90px;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    gap:8px;
    padding:8px;
    border:1px solid #242424;
    background:rgba(8,8,8,.85);
    backdrop-filter:blur(15px);
    border-radius:13px;
}

.tool-btn{
    border:1px solid #2a2a2a;
    background:#0d0d0d;
    color:#ddd;
    padding:9px 14px;
    border-radius:8px;
    transition:.2s;
}

.tool-btn:hover{
    background:#fff;
    color:#000;
}

.sidebar{
    position:absolute;
    top:76px;
    left:0;
    bottom:0;
    width:215px;
    border-right:1px solid #1d1d1d;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(15px);
    padding:18px 12px;
}

.side-title{
    color:#444;
    font-size:10px;
    letter-spacing:2px;
    margin:8px 10px 12px;
}

.side-btn{
    width:100%;
    text-align:left;
    border:1px solid transparent;
    background:transparent;
    color:#888;
    padding:11px 12px;
    border-radius:9px;
    margin-bottom:4px;
}

.side-btn:hover,
.side-btn.active{
    color:#fff;
    background:#101010;
    border-color:#252525;
}

.content{
    position:absolute;
    top:76px;
    left:215px;
    right:0;
    bottom:0;
}

.page{
    display:none;
    width:100%;
    height:100%;
}

.page.active{
    display:block;
}

.graph{
    position:absolute;
    inset:0;
    overflow:hidden;
}

#edges{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.edge{
    fill:none;
    stroke:#555;
    stroke-width:1.4;
    opacity:.7;
    stroke-dasharray:5 8;
    animation:edgeMove 2.8s linear infinite;
}

@keyframes edgeMove{
    to{
        stroke-dashoffset:-50;
    }
}

.node{
    position:absolute;
    width:190px;
    min-height:75px;
    padding:13px;
    border:1px solid #2b2b2b;
    background:rgba(9,9,9,.93);
    border-radius:12px;
    cursor:grab;
    box-shadow:0 15px 45px rgba(0,0,0,.4);
    transition:border-color .2s,box-shadow .2s;
    user-select:none;
}

.node:hover{
    border-color:#777;
    box-shadow:0 0 30px rgba(255,255,255,.07);
}

.node.selected{
    border-color:#fff;
}

.node-title{
    font-size:9px;
    letter-spacing:2px;
    color:#777;
    margin-bottom:7px;
}

.node-value{
    font-size:14px;
    color:#fff;
    word-break:break-word;
}

.node-status{
    margin-top:7px;
    font-size:10px;
    color:#999;
}

.node-dot{
    position:absolute;
    right:-5px;
    top:50%;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#fff;
    transform:translateY(-50%);
    box-shadow:0 0 12px rgba(255,255,255,.5);
}

.panel{
    position:absolute;
    left:25px;
    top:25px;
    width:350px;
    max-width:calc(100% - 50px);
    border:1px solid #242424;
    background:rgba(8,8,8,.9);
    backdrop-filter:blur(18px);
    border-radius:14px;
    padding:18px;
    z-index:10;
}

.panel h2{
    margin:0 0 7px;
    font-size:17px;
}

.panel p{
    margin:0 0 15px;
    color:#666;
    font-size:12px;
}

.field{
    width:100%;
    background:#050505;
    color:#fff;
    border:1px solid #272727;
    border-radius:9px;
    outline:none;
    padding:12px;
    margin-bottom:8px;
}

.field:focus{
    border-color:#777;
}

.result{
    margin-top:12px;
    border:1px solid #242424;
    border-radius:10px;
    padding:12px;
    background:#090909;
    display:none;
}

.result.show{
    display:block;
}

.result-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:7px 0;
    border-bottom:1px solid #171717;
    font-size:12px;
}

.result-row:last-child{
    border-bottom:0;
}

.result-label{
    color:#666;
}

.result-value{
    text-align:right;
    color:#fff;
    word-break:break-word;
}

.unknown{
    color:#666;
}

.valid{
    color:#fff;
}

.invalid{
    color:#777;
}

.profile-page{
    padding:35px;
}

.profile-card{
    max-width:550px;
    border:1px solid #242424;
    background:rgba(8,8,8,.88);
    border-radius:16px;
    padding:25px;
}

.profile-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    border:1px solid #444;
    object-fit:cover;
    display:block;
    margin-bottom:15px;
}

.hidden{
    display:none;
}

.map-page{
    padding:30px;
}

.map-box{
    height:100%;
    border:1px solid #222;
    border-radius:15px;
    background:
        linear-gradient(#111 1px,transparent 1px),
        linear-gradient(90deg,#111 1px,transparent 1px);
    background-size:40px 40px;
    position:relative;
    overflow:hidden;
}

.map-search{
    position:absolute;
    left:20px;
    top:20px;
    z-index:5;
    width:350px;
    max-width:calc(100% - 40px);
}

.map-result{
    margin-top:8px;
    max-height:300px;
    overflow:auto;
    background:#080808;
    border:1px solid #222;
    border-radius:10px;
}

.map-item{
    padding:11px;
    border-bottom:1px solid #1b1b1b;
    cursor:pointer;
    font-size:12px;
}

.map-item:hover{
    background:#111;
}

.marker{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 25px #fff;
    transform:translate(-50%,-50%);
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    z-index:100;
    background:#fff;
    color:#000;
    padding:11px 16px;
    border-radius:9px;
    transition:.25s;
    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

@media(max-width:900px){

    .sidebar{
        display:none;
    }

    .content{
        left:0;
    }

    .brand small{
        display:none;
    }

    .global-search{
        display:none;
    }

    .top-actions{
        display:none;
    }

    .toolbar{
        top:85px;
        max-width:95vw;
        overflow:auto;
    }

    .tool-btn{
        white-space:nowrap;
    }

    .panel{
        top:135px;
        left:15px;
    }
}
</style>
</head>

<body>

<canvas id="saturn"></canvas>

<div class="app">

<header class="topbar">

    <div class="logo">N</div>

    <div class="brand">
        <b>NZX OSINT TOOL</b>
        <small>INTELLIGENCE WORKSPACE</small>
    </div>

    <div class="global-search">
        <span>⌕</span>
        <input
            id="globalSearch"
            placeholder="Search nodes..."
            oninput="searchNodes(this.value)"
        >
    </div>

    <div class="top-actions">
        <button class="btn" onclick="newChainNode()">
            ＋ Node
        </button>

        <button class="btn primary"
                onclick="openPhoneTool()">
            Phone
        </button>
    </div>

    <button class="profile-mini"
            onclick="showPage('profile')">

        <img id="miniAvatar">

    </button>

</header>


<!-- ========================================================
     QUICK TOOLS
========================================================= -->

<div class="toolbar">

    <button class="tool-btn"
            onclick="openPhoneTool()">
        Check Number
    </button>

    <button class="tool-btn"
            onclick="openEmailTool()">
        Check Gmail
    </button>

    <button class="tool-btn"
            onclick="openAddressTool()">
        Check Address
    </button>

</div>


<!-- ========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="side-title">
        WORKSPACE
    </div>

    <button class="side-btn active"
            onclick="showPage('chain',this)">
        ◈ OSINT Chain
    </button>

    <button class="side-btn"
            onclick="showPage('map',this)">
        ◎ Map Search
    </button>

    <button class="side-btn"
            onclick="showPage('email',this)">
        @ Email Intelligence
    </button>

    <button class="side-btn"
            onclick="showPage('phone',this)">
        # Phone Validator
    </button>

    <button class="side-btn"
            onclick="showPage('profile',this)">
        ◉ Profile
    </button>

</aside>


<main class="content">

<!-- ========================================================
     CHAIN
========================================================= -->

<section id="page-chain"
         class="page active">

    <div class="graph"
         id="graph">

        <svg id="edges"></svg>

    </div>

</section>


<!-- ========================================================
     PHONE
========================================================= -->

<section id="page-phone"
         class="page">

    <div class="panel">

        <h2>Phone Validator</h2>

        <p>
            Проверка номера через доступный API.
            Неизвестные данные не подменяются.
        </p>

        <input
            id="phoneInput"
            class="field"
            placeholder="+374XXXXXXXX"
        >

        <button
            class="btn primary"
            style="width:100%"
            onclick="checkPhone()">

            Check Number

        </button>

        <div id="phoneResult"
             class="result">
        </div>

    </div>

</section>


<!-- ========================================================
     EMAIL
========================================================= -->

<section id="page-email"
         class="page">

    <div class="panel">

        <h2>Email Intelligence</h2>

        <p>
            Проверка формата, домена и MX.
        </p>

        <input
            id="emailInput"
            class="field"
            placeholder="example@gmail.com"
        >

        <button
            class="btn primary"
            style="width:100%"
            onclick="checkEmail()">

            Check Gmail

        </button>

        <div id="emailResult"
             class="result">
        </div>

    </div>

</section>


<!-- ========================================================
     MAP
========================================================= -->

<section id="page-map"
         class="page map-page">

    <div class="map-box">

        <div class="map-search">

            <input
                id="addressInput"
                class="field"
                placeholder="Address / city / coordinates"
            >

            <button
                class="btn primary"
                style="width:100%"
                onclick="checkAddress()">

                Search Address

            </button>

            <div
                id="mapResults"
                class="map-result">
            </div>

        </div>

        <div id="marker"
             class="marker"
             style="display:none">
        </div>

    </div>

</section>


<!-- ========================================================
     PROFILE
========================================================= -->

<section id="page-profile"
         class="page profile-page">

    <div class="profile-card">

        <h2>Profile</h2>

        <img
            id="profileAvatar"
            class="profile-avatar"
        >

        <input
            id="avatarFile"
            class="hidden"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
            onchange="changeAvatar(event)"
        >

        <button
            class="btn"
            onclick="document.getElementById('avatarFile').click()">

            Choose Avatar

        </button>

        <br><br>

        <input
            id="profileName"
            class="field"
            placeholder="Username"
        >

        <button
            class="btn primary"
            onclick="saveProfile()">

            Save Profile

        </button>

    </div>

</section>

</main>

</div>

<div id="toast"
     class="toast">
</div>


<script>

/* =========================================================
   DATABASE
========================================================= */

const DB_KEY = "nzx_osint_db_v2";

let db = JSON.parse(
    localStorage.getItem(DB_KEY) ||
    "null"
);

if(!db){

    db = {

        nodes: [],

        links: [],

        profile: {
            username:"NZX_USER",
            avatar:""
        }

    };

    saveDB();
}

function saveDB(){

    localStorage.setItem(
        DB_KEY,
        JSON.stringify(db)
    );

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}

function toast(text){

    const el = $("toast");

    el.textContent = text;
    el.classList.add("show");

    setTimeout(
        ()=>el.classList.remove("show"),
        2500
    );
}

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   PAGE
========================================================= */

function showPage(name, button){

    document
        .querySelectorAll(".page")
        .forEach(
            x=>x.classList.remove("active")
        );

    const page = $("page-"+name);

    if(page){
        page.classList.add("active");
    }

    document
        .querySelectorAll(".side-btn")
        .forEach(
            x=>x.classList.remove("active")
        );

    if(button){
        button.classList.add("active");
    }

    if(name==="chain"){
        setTimeout(
            renderGraph,
            50
        );
    }

}


/* =========================================================
   QUICK BUTTONS
========================================================= */

function openPhoneTool(){

    showPage("phone");

    setTimeout(
        ()=>$("phoneInput").focus(),
        100
    );

}

function openEmailTool(){

    showPage("email");

    setTimeout(
        ()=>$("emailInput").focus(),
        100
    );

}

function openAddressTool(){

    showPage("map");

    setTimeout(
        ()=>$("addressInput").focus(),
        100
    );

}


/* =========================================================
   PHONE CHECK
========================================================= */

async function checkPhone(){

    const input = $("phoneInput");

    const phone = input.value.trim();

    if(!phone){

        toast("Введите номер");

        input.focus();

        return;
    }

    const resultBox = $("phoneResult");

    resultBox.classList.add("show");

    resultBox.innerHTML =
        `<div class="result-row">
            <span class="result-label">
                STATUS
            </span>
            <span class="result-value">
                CHECKING...
            </span>
        </div>`;

    try{

        const form = new FormData();

        form.append(
            "phone",
            phone
        );

        const response = await fetch(
            "/api/osint/phone",
            {
                method:"POST",
                body:form
            }
        );

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.detail ||
                "Request failed"
            );

        }

        renderPhoneResult(data);

        /*
         * THIS IS THE IMPORTANT PART.
         *
         * Every successful phone lookup
         * creates nodes in the OSINT graph.
         */

        addPhoneNodesToGraph(data);

        toast(
            "Phone information added to graph"
        );

    }catch(error){

        resultBox.innerHTML =
            `<div class="result-row">
                <span class="result-label">
                    ERROR
                </span>
                <span class="result-value">
                    ${esc(error.message)}
                </span>
            </div>`;

        toast(
            "Phone request failed"
        );

    }

}


/* =========================================================
   PHONE RESULT
========================================================= */

function renderPhoneResult(data){

    const validText =
        data.valid === true
            ? "VALID"
            : data.valid === false
                ? "INVALID"
                : "UNKNOWN";

    $("phoneResult").innerHTML = `

        <div class="result-row">
            <span class="result-label">
                PHONE
            </span>
            <span class="result-value">
                ${esc(data.phone)}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                REGION
            </span>
            <span class="result-value">
                ${esc(data.region || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                COUNTRY
            </span>
            <span class="result-value">
                ${esc(data.country || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                APPROX. CITY
            </span>
            <span class="result-value">
                ${esc(data.city || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                CARRIER
            </span>
            <span class="result-value">
                ${esc(data.carrier || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                LINE TYPE
            </span>
            <span class="result-value">
                ${esc(data.line_type || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                VALIDITY
            </span>
            <span class="result-value">
                ${esc(validText)}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                SOURCE
            </span>
            <span class="result-value">
                ${esc(data.source || "UNKNOWN")}
            </span>
        </div>

        <div class="result-row">
            <span class="result-label">
                PROVIDER
            </span>
            <span class="result-value">
                ${esc(data.provider_status || "UNKNOWN")}
            </span>
        </div>
    `;

}


/* =========================================================
   ADD PHONE NODES
========================================================= */

function addPhoneNodesToGraph(data){

    const phone =
        data.phone ||
        "UNKNOWN";

    const region =
        data.region ||
        "UNKNOWN";

    const city =
        data.city ||
        "UNKNOWN";

    const valid =
        data.valid === true
            ? "VALID"
            : data.valid === false
                ? "INVALID"
                : "UNKNOWN";

    /*
     * Main phone node
     */

    const mainId =
        "phone_main_" +
        Date.now();

    const centerX =
        window.innerWidth / 2;

    const centerY =
        window.innerHeight / 2;

    const mainNode = {

        id:mainId,

        title:"PHONE",

        value:phone,

        type:"phone",

        x:centerX - 90,

        y:centerY - 40

    };

    db.nodes.push(mainNode);


    /*
     * Result nodes
     */

    const resultNodes = [

        {
            title:"REGION",
            value:region,
            type:"location",
            angle:0
        },

        {
            title:"APPROX. CITY",
            value:city,
            type:"location",
            angle:Math.PI / 2
        },

        {
            title:"VALIDITY",
            value:valid,
            type:"status",
            angle:Math.PI
        }

    ];


    resultNodes.forEach(
        (item,index)=>{

            const radius = 300;

            const node = {

                id:
                    mainId +
                    "_" +
                    index,

                title:item.title,

                value:item.value,

                type:item.type,

                x:
                    centerX -
                    95 +
                    Math.cos(item.angle) *
                    radius,

                y:
                    centerY -
                    38 +
                    Math.sin(item.angle) *
                    radius

            };

            db.nodes.push(node);

            db.links.push({

                source:mainId,

                target:node.id

            });

        }
    );


    saveDB();

    renderGraph();

}


/* =========================================================
   GRAPH
========================================================= */

function renderGraph(){

    renderNodes();

    renderLines();

}


function renderNodes(){

    const graph =
        $("graph");

    graph
        .querySelectorAll(".node")
        .forEach(
            x=>x.remove()
        );

    db.nodes.forEach(
        node=>{

            const el =
                document.createElement("div");

            el.className =
                "node";

            el.dataset.id =
                node.id;

            el.style.left =
                node.x+"px";

            el.style.top =
                node.y+"px";

            el.innerHTML = `

                <div class="node-title">
                    ${esc(node.title)}
                </div>

                <div class="node-value">
                    ${esc(node.value)}
                </div>

                <div class="node-status">
                    ${esc(node.type || "node")}
                </div>

                <div class="node-dot"></div>

            `;

            graph.appendChild(el);

            enableDrag(
                el,
                node
            );

        }
    );

}


function renderLines(){

    const svg =
        $("edges");

    svg.innerHTML = "";

    db.links.forEach(
        link=>{

            const a =
                db.nodes.find(
                    n=>n.id===link.source
                );

            const b =
                db.nodes.find(
                    n=>n.id===link.target
                );

            if(!a || !b)
                return;

            const line =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );

            line.classList.add("edge");

            line.setAttribute(
                "x1",
                a.x+95
            );

            line.setAttribute(
                "y1",
                a.y+40
            );

            line.setAttribute(
                "x2",
                b.x+95
            );

            line.setAttribute(
                "y2",
                b.y+40
            );

            svg.appendChild(line);

        }
    );

}


/* =========================================================
   DRAG
========================================================= */

function enableDrag(el,node){

    let dragging=false;

    let offsetX=0;
    let offsetY=0;

    el.addEventListener(
        "pointerdown",
        event=>{

            dragging=true;

            el.setPointerCapture(
                event.pointerId
            );

            offsetX =
                event.clientX -
                node.x;

            offsetY =
                event.clientY -
                node.y;

        }
    );

    el.addEventListener(
        "pointermove",
        event=>{

            if(!dragging)
                return;

            node.x =
                event.clientX -
                offsetX;

            node.y =
                event.clientY -
                offsetY;

            el.style.left =
                node.x+"px";

            el.style.top =
                node.y+"px";

            renderLines();

        }
    );

    el.addEventListener(
        "pointerup",
        ()=>{

            dragging=false;

            saveDB();

            autoConnect(node);

        }
    );

}


function autoConnect(node){

    const distanceLimit = 250;

    db.nodes.forEach(
        other=>{

            if(other.id===node.id)
                return;

            const dx =
                node.x -
                other.x;

            const dy =
                node.y -
                other.y;

            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );

            if(distance < distanceLimit){

                const exists =
                    db.links.some(
                        l =>
                            (
                                l.source===node.id &&
                                l.target===other.id
                            )
                            ||
                            (
                                l.source===other.id &&
                                l.target===node.id
                            )
                    );

                if(!exists){

                    db.links.push({
                        source:node.id,
                        target:other.id
                    });

                }

            }

        }
    );

    saveDB();

    renderLines();

}

function newChainNode(){

/* =========================================================
   SEARCH
========================================================= */

function searchNodes(query){

    query =
        query.toLowerCase().trim();

    document
        .querySelectorAll(".node")
        .forEach(
            el=>{

                const node =
                    db.nodes.find(
                        n =>
                            n.id===
                            el.dataset.id
                    );

                if(!node)
                    return;

                const text =
                    (
                        node.title+
                        " "+
                        node.value
                    ).toLowerCase();

                if(
                    !query ||
                    text.includes(query)
                ){

                    el.style.opacity="1";

                }else{

                    el.style.opacity=".18";

                }

            }
        );

}

/* =========================================================
   MAP
========================================================= */

async function checkAddress(){

    const q =
        $("addressInput")
        .value
        .trim();

    if(!q){

        toast("Введите адрес");

        return;

    }

    const container =
        $("mapResults");

    container.innerHTML =
        `<div class="map-item">
            Searching...
        </div>`;

    try{

        const response =
            await fetch(
                "/api/map/search?q="+
                encodeURIComponent(q)
            );

        const data =
            await response.json();

        if(!data.results?.length){

            container.innerHTML =
                `<div class="map-item">
                    Nothing found
                </div>`;

            return;
        }

        container.innerHTML =
            data.results
                .map(
                    item=>`

                        <div
                            class="map-item"
                            onclick='selectMapResult(
                                ${JSON.stringify(item)}
                            )'
                        >

                            ${esc(
                                item.display_name
                            )}

                        </div>

                    `
                )
                .join("");

    }catch(error){

        container.innerHTML =
            `<div class="map-item">
                ${esc(error.message)}
            </div>`;

    }

}


function selectMapResult(item){

    const marker =
        $("marker");

    /*
     * Visual position only.
     * Actual latitude/longitude remains in result.
     */

    const lat =
        parseFloat(item.lat);

    const lon =
        parseFloat(item.lon);

    const x =
        50 +
        (
            (
                lon -
                Math.floor(lon)
            ) * 50
        );

    const y =
        50 -
        (
            (
                lat -
                Math.floor(lat)
            ) * 50
        );

    marker.style.left =
        Math.max(
            5,
            Math.min(95,x)
        )+"%";

    marker.style.top =
        Math.max(
            5,
            Math.min(95,y)
        )+"%";

    marker.style.display =
        "block";

}

   PROFILE
========================================================= */

function loadProfile(){

    const avatar =
        db.profile.avatar ||
        makeDefaultAvatar(
            db.profile.username
        );

    $("profileAvatar").src =
        avatar;

    $("miniAvatar").src =
        avatar;

    $("profileName").value =
        db.profile.username;

}


function makeDefaultAvatar(name){

    const letter =
        (name || "N")
            .charAt(0)
            .toUpperCase();

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200">

            <rect width="200"
                  height="200"
                  fill="#111"/>

            <text
                x="100"
                y="125"
                text-anchor="middle"
                font-family="Arial"
                font-size="90"
                fill="white">

                ${letter}

            </text>

        </svg>
    `;

    return "data:image/svg+xml;base64,"+
        btoa(svg);

}


function changeAvatar(event){

    const file =
        event.target.files[0];

    if(!file)
        return;

    if(
        !file.type.startsWith("image/")
    ){

        toast(
            "Выберите изображение"
        );

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(){

            db.profile.avatar =
                reader.result;

            saveDB();

            loadProfile();

            toast(
                "Avatar updated"
            );

        };

    reader.readAsDataURL(file);

}


function saveProfile(){

    const username =
        $("profileName")
        .value
        .trim();

    if(username){

        db.profile.username =
            username;

        saveDB();

        loadProfile();

        toast(
            "Profile saved"
        );

    }

}


/* =========================================================
   SATURN
========================================================= */

const canvas =
    $("saturn");

const ctx =
    canvas.getContext("2d");

let saturnAngle = 0;

function resizeSaturn(){

    canvas.width =
        window.innerWidth *
        devicePixelRatio;

    canvas.height =
        window.innerHeight *
        devicePixelRatio;

    canvas.style.width =
        window.innerWidth+"px";

    canvas.style.height =
        window.innerHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeSaturn
);

resizeSaturn();


function drawSaturn(){

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    const cx =
        window.innerWidth * .72;

    const cy =
        window.innerHeight * .58;

    const radius =
        Math.min(
            window.innerWidth,
            window.innerHeight
        ) * .18;

    /*
     * stars
     */

    for(let i=0;i<160;i++){

        const a =
            i * 12.9898;

        const x =
            (
                Math.sin(a) * 43758.5453
            ) % 1 *
            window.innerWidth;

        const y =
            (
                Math.cos(a) * 96321.421
            ) % 1 *
            window.innerHeight;

        const xx =
            Math.abs(x);

        const yy =
            Math.abs(y);

        ctx.fillStyle =
            "rgba(255,255,255,.15)";

        ctx.fillRect(
            xx,
            yy,
            1,
            1
        );

    }


    /*
     * planet
     */

    const gradient =
        ctx.createRadialGradient(
            cx-radius*.35,
            cy-radius*.45,
            radius*.1,
            cx,
            cy,
            radius
        );

    gradient.addColorStop(
        0,
        "#777"
    );

    gradient.addColorStop(
        .35,
        "#333"
    );

    gradient.addColorStop(
        1,
        "#050505"
    );

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        gradient;

    ctx.fill();


    /*
     * rings
     */

    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        saturnAngle
    );

    ctx.scale(
        1,
        .32
    );

    for(
        let r=radius*1.15;
        r<radius*2.0;
        r+=10
    ){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.08)";

        ctx.lineWidth=3;

        ctx.stroke();

    }

    ctx.restore();

    saturnAngle += .0007;

    requestAnimationFrame(
        drawSaturn
    );

}

drawSaturn();
