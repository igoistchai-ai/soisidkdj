<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NZX OSINT TOOL</title>

<style>
:root{
    --bg:#050505;
    --panel:rgba(10,10,10,.94);
    --panel2:rgba(15,15,15,.96);
    --card:#111;
    --card2:#161616;
    --text:#f5f5f5;
    --muted:#777;
    --dim:#444;
    --line:rgba(255,255,255,.12);
    --line2:rgba(255,255,255,.28);
    --good:#baffc2;
    --warn:#ffe4a3;
    --bad:#ff9696;
    --accent:#fff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%,rgba(255,255,255,.025),transparent 32%),
        #050505;
}

/* ================= TOP ================= */

.topbar{
    position:absolute;
    z-index:100;
    top:0;
    left:0;
    right:0;
    height:74px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,5,5,.76);
    backdrop-filter:blur(20px);
}

.logo{
    width:43px;
    height:43px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:13px;
    display:grid;
    place-items:center;
    font-size:22px;
    font-weight:900;
    background:#090909;
    box-shadow:0 0 30px rgba(255,255,255,.04);
}

.brand{
    display:flex;
    flex-direction:column;
    line-height:1.05;
    min-width:190px;
}

.brand b{
    font-size:14px;
    letter-spacing:.12em;
}

.brand small{
    color:#555;
    margin-top:5px;
    font-size:8px;
    letter-spacing:.18em;
}

.top-tools{
    display:flex;
    gap:8px;
    margin-left:auto;
}

.top-btn,
.btn,
.side-btn,
.profile-mini{
    border:1px solid rgba(255,255,255,.13);
    color:#ddd;
    background:rgba(255,255,255,.035);
    transition:
        .2s ease,
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;
}

.top-btn{
    padding:10px 13px;
    border-radius:10px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
}

.top-btn:hover,
.btn:hover,
.side-btn:hover{
    border-color:rgba(255,255,255,.38);
    background:rgba(255,255,255,.08);
    color:#fff;
    transform:translateY(-1px);
}

.profile-mini{
    margin-left:4px;
    width:42px;
    height:42px;
    padding:0;
    overflow:hidden;
    border-radius:13px;
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:absolute;
    z-index:100;
    top:90px;
    left:16px;
    width:48px;
    padding:7px;
    display:flex;
    flex-direction:column;
    gap:7px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:rgba(8,8,8,.78);
    backdrop-filter:blur(18px);
}

.side-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    color:#666;
    font-size:17px;
}

.side-btn.active{
    color:#fff;
    background:rgba(255,255,255,.11);
    border-color:rgba(255,255,255,.25);
}

/* ================= PAGES ================= */

.page{
    position:absolute;
    inset:74px 0 0 0;
    display:none;
}

.page.active{
    display:block;
}

/* ================= GRAPH ================= */

.graph{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 40%),
        #030303;
}

.graph::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    opacity:.28;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px;
}

.graph::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
        radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.48) 100%);
}

/* ================= GRAPH WORLD ================= */

/*
   ВАЖНО:
   SVG и nodes находятся В ОДНОЙ системе координат.
   Поэтому линии больше не "пропадают".
*/

.world{
    position:absolute;
    left:50%;
    top:50%;
    width:10000px;
    height:10000px;
    transform:
        translate(-50%,-50%)
        scale(1);
    transform-origin:center center;
    z-index:10;
    will-change:transform;
}

.lines{
    position:absolute;
    left:0;
    top:0;
    width:10000px;
    height:10000px;
    overflow:visible;
    pointer-events:none;
    z-index:1;
}

.graph-line{
    fill:none;
    stroke:rgba(255,255,255,.45);
    stroke-width:2;
    vector-effect:non-scaling-stroke;
    stroke-linecap:round;
    filter:
        drop-shadow(0 0 4px rgba(255,255,255,.12));
    animation:
        lineAppear .45s ease forwards;
}

.graph-line-bg{
    fill:none;
    stroke:rgba(255,255,255,.055);
    stroke-width:7;
    vector-effect:non-scaling-stroke;
    stroke-linecap:round;
}

.graph-line-dot{
    fill:#fff;
    opacity:.65;
    filter:drop-shadow(0 0 5px #fff);
}

@keyframes lineAppear{
    from{
        opacity:0;
        stroke-dasharray:8 10;
        stroke-dashoffset:40;
    }
    to{
        opacity:1;
        stroke-dasharray:8 10;
        stroke-dashoffset:0;
    }
}

/* ================= NODES ================= */

.node{
    position:absolute;
    z-index:5;
    width:220px;
    min-height:86px;
    padding:14px 15px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.13);
    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,.96),
            rgba(7,7,7,.96)
        );
    box-shadow:
        0 18px 50px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.035);
    user-select:none;
    cursor:grab;
    transform:translateZ(0);
    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.node:hover{
    border-color:rgba(255,255,255,.32);
    box-shadow:
        0 20px 60px rgba(0,0,0,.6),
        0 0 30px rgba(255,255,255,.035);
}

.node:active{
    cursor:grabbing;
}

.node.selected{
    border-color:#fff;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.2),
        0 25px 70px rgba(0,0,0,.7),
        0 0 30px rgba(255,255,255,.07);
}

.node-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
}

.node-dot{
    width:8px;
    height:8px;
    flex:0 0 auto;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.7);
}

.node-type{
    color:#666;
    font-size:8px;
    font-weight:900;
    letter-spacing:.14em;
    text-transform:uppercase;
}

.node-value{
    color:#eee;
    font-size:13px;
    line-height:1.4;
    font-weight:700;
    word-break:break-word;
}

.node-meta{
    color:#555;
    margin-top:7px;
    font-size:9px;
}

.node-tools{
    position:absolute;
    right:8px;
    top:8px;
    display:flex;
    gap:4px;
    opacity:0;
    transition:.2s ease;
}

.node:hover .node-tools{
    opacity:1;
}

.node-tools button{
    width:24px;
    height:24px;
    padding:0;
    border-radius:7px;
    color:#aaa;
    background:#090909;
    border:1px solid rgba(255,255,255,.1);
}

.node-tools button:hover{
    color:#fff;
    border-color:rgba(255,255,255,.3);
}

/* ================= SATURN ================= */

.saturn{
    position:absolute;
    z-index:0;
    left:50%;
    top:50%;
    width:360px;
    height:360px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:.72;
}

#saturn{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

.saturn-core{
    position:absolute;
    left:50%;
    top:50%;
    width:130px;
    height:130px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 28%,
            #aaa 0%,
            #555 22%,
            #191919 56%,
            #050505 100%
        );
    box-shadow:
        0 0 70px rgba(255,255,255,.06),
        inset -22px -15px 30px rgba(0,0,0,.8),
        inset 10px 8px 22px rgba(255,255,255,.08);
}

.saturn-ring{
    position:absolute;
    left:50%;
    top:50%;
    width:310px;
    height:105px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.16);
    transform:
        translate(-50%,-50%)
        rotateX(67deg)
        rotateZ(0deg);
    box-shadow:
        0 0 25px rgba(255,255,255,.03),
        inset 0 0 20px rgba(255,255,255,.04);
    animation:saturnRing 16s linear infinite;
}

.saturn-ring::before,
.saturn-ring::after{
    content:"";
    position:absolute;
    inset:11px 26px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.08);
}

.saturn-ring::after{
    inset:22px 50px;
    border-color:rgba(255,255,255,.06);
}

@keyframes saturnRing{
    from{
        transform:
            translate(-50%,-50%)
            rotateX(67deg)
            rotateZ(0deg);
    }
    to{
        transform:
            translate(-50%,-50%)
            rotateX(67deg)
            rotateZ(360deg);
    }
}

/* ================= TOOLBAR ================= */

.chain-toolbar{
    position:absolute;
    z-index:80;
    top:18px;
    left:82px;
    right:18px;
    display:flex;
    gap:8px;
    align-items:center;
}

.chain-search{
    width:min(340px,40vw);
    height:38px;
    padding:0 13px;
    outline:none;
    color:#eee;
    border:1px solid rgba(255,255,255,.1);
    border-radius:10px;
    background:rgba(10,10,10,.72);
    backdrop-filter:blur(15px);
}

.chain-search:focus{
    border-color:rgba(255,255,255,.28);
}

.chain-search::placeholder{
    color:#555;
}

.btn{
    height:38px;
    padding:0 13px;
    border-radius:10px;
    font-size:10px;
    font-weight:800;
    letter-spacing:.06em;
}

/* ================= STATUS ================= */

.status{
    position:absolute;
    z-index:90;
    bottom:18px;
    left:82px;
    padding:9px 12px;
    color:#666;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    background:rgba(5,5,5,.72);
    backdrop-filter:blur(12px);
    font-size:9px;
}

/* ================= PROFILE ================= */

.profile-page{
    padding:35px;
    overflow:auto;
    background:
        radial-gradient(circle at 70% 20%,rgba(255,255,255,.035),transparent 30%),
        #050505;
}

.profile-card{
    width:min(700px,100%);
    margin:30px auto;
    padding:30px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    background:rgba(12,12,12,.9);
    box-shadow:0 30px 100px rgba(0,0,0,.4);
}

.profile-top{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:30px;
}

.profile-avatar{
    width:90px;
    height:90px;
    border-radius:22px;
    object-fit:cover;
    border:1px solid rgba(255,255,255,.15);
}

.profile-name{
    font-size:23px;
    font-weight:900;
}

.profile-username{
    color:#666;
    margin-top:5px;
    font-size:12px;
}

.profile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.profile-field{
    padding:15px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;
    background:#0b0b0b;
}

.profile-field span{
    display:block;
    color:#555;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.1em;
    margin-bottom:7px;
}

.profile-field b{
    font-size:13px;
}

/* ================= MODALS ================= */

.modal-wrap{
    position:fixed;
    z-index:500;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(15px);
}

.modal-wrap.open{
    display:flex;
    animation:fadeIn .2s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.modal{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    padding:24px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:20px;
    background:#0b0b0b;
    box-shadow:0 40px 120px rgba(0,0,0,.75);
    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(12px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-title{
    font-size:18px;
    font-weight:900;
    letter-spacing:.05em;
}

.modal-desc{
    color:#666;
    margin-top:7px;
    font-size:11px;
    line-height:1.5;
}

.modal-input{
    width:100%;
    height:46px;
    margin-top:20px;
    padding:0 14px;
    outline:none;
    color:#eee;
    background:#050505;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
}

.modal-input:focus{
    border-color:rgba(255,255,255,.4);
}

.modal-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:18px;
}

.modal-result{
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    background:#070707;
    border:1px solid rgba(255,255,255,.08);
    font-size:11px;
    line-height:1.6;
    white-space:pre-wrap;
}

.close-btn{
    float:right;
    width:30px;
    height:30px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.1);
    color:#888;
    background:#090909;
}

.close-btn:hover{
    color:#fff;
}

/* ================= ADDRESS RESULTS ================= */

.address-results{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.address-item{
    padding:11px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    background:#080808;
    cursor:pointer;
    transition:.2s;
}

.address-item:hover{
    border-color:rgba(255,255,255,.3);
    background:#101010;
}

.address-item b{
    display:block;
    font-size:11px;
}

.address-item small{
    color:#555;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    z-index:900;
    right:20px;
    bottom:20px;
    max-width:330px;
    padding:12px 15px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;
    background:#0a0a0a;
    color:#ddd;
    box-shadow:0 20px 70px rgba(0,0,0,.55);
    font-size:11px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:none;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .topbar{
        height:64px;
        padding:9px 11px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .brand{
        min-width:0;
    }

    .brand b{
        font-size:11px;
    }

    .brand small{
        display:none;
    }

    .top-tools{
        gap:5px;
    }

    .top-btn{
        padding:8px 7px;
        font-size:8px;
    }

    .profile-mini{
        width:38px;
        height:38px;
    }

    .page{
        inset:64px 0 0 0;
    }

    .sidebar{
        top:78px;
        left:9px;
        width:43px;
    }

    .chain-toolbar{
        left:61px;
        top:13px;
        right:10px;
    }

    .chain-search{
        width:100%;
    }

    .chain-toolbar .btn{
        display:none;
    }

    .node{
        width:190px;
        min-height:78px;
        padding:12px;
    }

    .status{
        left:61px;
    }

    .profile-page{
        padding:15px;
    }

    .profile-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="logo">N</div>

    <div class="brand">
        <b>NZX OSINT TOOL</b>
        <small>INTELLIGENCE WORKSPACE</small>
    </div>

    <div class="top-tools">
        <button class="top-btn" onclick="openTool('phone')">
            CHECK NUMBER
        </button>

        <button class="top-btn" onclick="openTool('address')">
            CHECK ADDRESS
        </button>
    </div>

    <button class="profile-mini" onclick="openProfile()">
        <img id="miniAvatar" alt="">
    </button>

</header>


<aside class="sidebar">

    <button
        class="side-btn active"
        data-page="chain"
        onclick="showPage('chain')"
        title="Chain"
    >⌘</button>

    <button
        class="side-btn"
        data-page="profile"
        onclick="openProfile()"
        title="Profile"
    >◎</button>

</aside>


<!-- ================= CHAIN ================= -->

<section class="page active" id="chainPage">

    <div class="graph" id="graph">

        <div class="saturn">

            <canvas id="saturn"></canvas>

            <div class="saturn-core"></div>

            <div
                class="saturn-ring"
                id="saturnRing"
            ></div>

        </div>

        <div class="world" id="world">

            <!-- ЛИНИИ НАХОДЯТСЯ В ТОЙ ЖЕ СИСТЕМЕ КООРДИНАТ -->
            <svg
                id="lines"
                class="lines"
                viewBox="0 0 10000 10000"
                preserveAspectRatio="none"
            ></svg>

        </div>

    </div>


    <div class="chain-toolbar">

        <input
            class="chain-search"
            id="chainSearch"
            placeholder="Search chain or node..."
            autocomplete="off"
        >

        <button
            class="btn"
            onclick="openNodeModal()"
        >
            ＋ NODE
        </button>

        <button
            class="btn"
            onclick="centerGraph()"
        >
            ⌂
        </button>

    </div>


    <div class="status" id="graphStatus">
        0 NODES · 0 LINKS
    </div>

</section>


<!-- ================= PROFILE ================= -->

<section class="page profile-page" id="profilePage">

    <div class="profile-card">

        <div class="profile-top">

            <img
                id="profileAvatar"
                class="profile-avatar"
                alt=""
            >

            <div>
                <div
                    class="profile-name"
                    id="profileName"
                >
                    NZX User
                </div>

                <div
                    class="profile-username"
                    id="profileUsername"
                >
                    @nzx_user
                </div>
            </div>

        </div>

        <div class="profile-grid">

            <div class="profile-field">
                <span>Nodes</span>
                <b id="profileNodes">0</b>
            </div>

            <div class="profile-field">
                <span>Connections</span>
                <b id="profileLinks">0</b>
            </div>

            <div class="profile-field">
                <span>Searches</span>
                <b id="profileSearches">0</b>
            </div>

            <div class="profile-field">
                <span>Workspace</span>
                <b>NZX OSINT</b>
            </div>

        </div>

    </div>

</section>


<!-- ================= TOOL MODAL ================= -->

<div
    class="modal-wrap"
    id="toolModal"
    onclick="modalOutside(event,'toolModal')"
>

    <div class="modal">

        <button
            class="close-btn"
            onclick="closeModal('toolModal')"
        >×</button>

        <div
            class="modal-title"
            id="toolTitle"
        >
            CHECK
        </div>

        <div
            class="modal-desc"
            id="toolDescription"
        ></div>

        <input
            class="modal-input"
            id="toolInput"
            autocomplete="off"
        >

        <div
            class="modal-actions"
            id="toolActions"
        ></div>

        <div
            class="modal-result"
            id="toolResult"
            style="display:none"
        ></div>

        <div
            class="address-results"
            id="addressResults"
        ></div>

    </div>

</div>


<!-- ================= NODE MODAL ================= -->

<div
    class="modal-wrap"
    id="nodeModal"
    onclick="modalOutside(event,'nodeModal')"
>

    <div class="modal">

        <button
            class="close-btn"
            onclick="closeModal('nodeModal')"
        >×</button>

        <div class="modal-title">
            CREATE NODE
        </div>

        <div class="modal-desc">
            Добавьте собственный узел в граф.
        </div>

function uid(prefix="node"){

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")

        .replaceAll(">","&gt;")

function normalizeValue(value){

        .replace(/\s+/g," ");

function nodeCenter(node){

/* =========================================================
   PHONE GRAPH
========================================================= */

/*
   Структура:

       PHONE
          |
       ┌──┼──┐
       A  B  C
       |  |  |
       D  E  F
       |  |  |
       G  H  I

   То есть граф не превращается в кашу.
   Всё строится колонками слева направо.
*/

function createPhoneGraph(data){

    const phone =
        data.phone ||
        data.e164 ||
        data.international ||
        "UNKNOWN";

    const group =
        "phone:" +
        String(phone)
            .replace(/[^\d+]/g,"");

    /* Удаляем старую проверку того же номера */

    removeGraphGroup(group);

    const rootId = uid("phone");

    const root = {
        id:rootId,
        type:"PHONE NUMBER",
        value:phone,
        x:-900,
        y:0,
        group,
        level:0
    };

    db.nodes[rootId] = root;

    /*
       Собираем только существующие значения.
       UNKNOWN и пустые значения не рисуем.
    */

    const fields = [

        ["COUNTRY","country"],
        ["COUNTRY CODE","country_code"],
        ["REGION","region"],
        ["CARRIER","carrier"],
        ["LINE TYPE","line_type"],
        ["VALID","valid"],
        ["POSSIBLE","possible"],
        ["CONFIDENCE","confidence"],
        ["SCORE","score"],
        ["DISPOSABLE","disposable"],
        ["NATIONAL","national"],
        ["INTERNATIONAL","international"],
        ["E.164","e164"],
        ["REASON","reason"],
        ["PROVIDER STATUS","provider_status"],
        ["CREDITS","credits_remaining"]

    ];

    const usable = [];

    for(const [type,key] of fields){

        if(!(key in data)){
            continue;
        }

        let value = data[key];

        if(
            value === null ||
            value === undefined ||
            value === "" ||
            String(value).toUpperCase() === "UNKNOWN" ||
            String(value).toUpperCase() === "N/A"
        ){
            continue;
        }

        if(typeof value === "object"){
            value = JSON.stringify(value);
        }

        usable.push({
            type,
            value:String(value)
        });
    }


    /*
       Максимум 5 элементов на колонку.
       Поэтому получается аккуратная сетка.
    */

    const PER_COLUMN = 5;
    const COLUMN_GAP = 410;
    const ROW_GAP = 135;

    const levels = [];

    for(let i=0;i<usable.length;i+=PER_COLUMN){

        levels.push(
            usable.slice(i,i+PER_COLUMN)
        );
    }


    /* root */

    const allLevelIds = [
        [rootId]
    ];


    /* создаём колонки */

    levels.forEach((levelItems,levelIndex)=>{

        const ids = [];

        const x =
            -900 +
            COLUMN_GAP * (levelIndex + 1);

        const totalHeight =
            (levelItems.length - 1) * ROW_GAP;

        levelItems.forEach((item,index)=>{

            const id = uid("phone_meta");

            const y =
                -totalHeight / 2 +
                index * ROW_GAP;

            db.nodes[id] = {
                id,
                type:item.type,
                value:item.value,
                x,
                y,
                group,
                level:levelIndex + 1
            };

            ids.push(id);
        });

        allLevelIds.push(ids);
    });


    /*
       АВТОМАТИЧЕСКИЕ ЛИНИИ.
    */

    for(let level=1;level<allLevelIds.length;level++){

        const current = allLevelIds[level];
        const previous = allLevelIds[level-1];

        current.forEach((childId,index)=>{

            let parentId;

            if(level === 1){

                parentId = rootId;

            }else{

                const child = db.nodes[childId];

                /*
                   Подключаем к ближайшему узлу предыдущей колонки.
                */

                let best = previous[0];
                let bestDistance = Infinity;

                for(const candidateId of previous){

                    const candidate = db.nodes[candidateId];

                    const distance =
                        Math.abs(candidate.y - child.y);

                    if(distance < bestDistance){

                        bestDistance = distance;
                        best = candidateId;
                    }
                }

                parentId = best;
            }

            addLink(parentId,childId);
        });
    }


    renderAll();

    /*
       После построения немного центрируем граф.
    */

    setTimeout(()=>{
        centerGraphToNode(rootId);
    },50);
}


/* =========================================================
   GROUP DELETE
========================================================= */

function removeGraphGroup(group){

    const ids = Object
        .values(db.nodes)
        .filter(node=>node.group === group)
        .map(node=>node.id);

    if(!ids.length){
        return;
    }

    const set = new Set(ids);

    ids.forEach(id=>{
        delete db.nodes[id];
    });

    db.links = db.links.filter(link=>{
        return !set.has(link.from) &&
               !set.has(link.to);
    });
}


/* =========================================================
   NODE CREATION
========================================================= */

function addGraphNode({
    type="NODE",
    value="",
    x=0,
    y=0,
    group="manual",
    level=0,
    autoLink=true
}){

    const id = uid("node");

    db.nodes[id] = {
        id,
        type,
        value,
        x,
        y,
        group,
        level
    };


    /*
       Если появляется второй узел —
       автоматически соединяем его с ближайшим.
    */

    if(autoLink){

        const existing =
            Object.values(db.nodes)
                .filter(n=>n.id !== id);

        if(existing.length === 1){

            addLink(existing[0].id,id);

        }else if(existing.length > 1){

            let closest = null;
            let distance = Infinity;

            for(const node of existing){

                const dx = node.x - x;
                const dy = node.y - y;

                const d = Math.sqrt(
                    dx*dx + dy*dy
                );

                if(d < distance){

                    distance = d;
                    closest = node;
                }
            }

            if(closest){
                addLink(closest.id,id);
            }
        }
    }

    renderAll();

    return id;
}


/* =========================================================
   LINKS
========================================================= */

function addLink(from,to){

    if(!from || !to || from === to){
        return;
    }

    const exists = db.links.some(link=>{
        return (
            (link.from === from && link.to === to) ||
            (link.from === to && link.to === from)
        );
    });

    if(exists){
        return;
    }

    db.links.push({
        id:uid("link"),
        from,
        to
    });
}


/* =========================================================
   RENDER
========================================================= */

function renderAll(){

    renderNodes();
    renderLines();

    updateStatus();
    updateProfileStats();
}


/* =========================================================
   RENDER NODES
========================================================= */

function renderNodes(){

    world
        .querySelectorAll(".node")
        .forEach(el=>el.remove());

    Object
        .values(db.nodes)
        .forEach(node=>{

            const el =
                document.createElement("div");

            el.className = "node";

            if(node.id === selectedNodeId){
                el.classList.add("selected");
            }

            /*
               x/y — это центрированная координата.
               +5000 переводит её в SVG/world plane.
            */

            const left =
                node.x + 5000;

            const top =
                node.y + 5000;

            el.style.left = left + "px";
            el.style.top = top + "px";

            el.dataset.id = node.id;

            el.innerHTML = `
                <div class="node-tools">

                    <button
                        title="Edit"
                        data-action="edit"
                    >✎</button>

                    <button
                        title="Delete"
                        data-action="delete"
                    >×</button>

                </div>

                <div class="node-head">

                    <span class="node-dot"></span>

                    <span class="node-type">
                        ${escapeHTML(node.type)}
                    </span>

                </div>

                <div class="node-value">
                    ${escapeHTML(node.value)}
                </div>

                <div class="node-meta">
                    ${escapeHTML(node.group || "manual")}
                </div>
            `;


            el.addEventListener("pointerdown",event=>{
                handleNodePointerDown(event,node.id);
            });


            el.addEventListener("click",event=>{

                if(
                    event.target.closest(".node-tools")
                ){
                    return;
                }

                selectNode(node.id);
            });


            el
                .querySelector('[data-action="delete"]')
                ?.addEventListener("click",event=>{

                    event.stopPropagation();

                    deleteNode(node.id);
                });


            el
                .querySelector('[data-action="edit"]')
                ?.addEventListener("click",event=>{

                    event.stopPropagation();

                    editNode(node.id);
                });


            world.appendChild(el);
        });
}


/* =========================================================
   RENDER LINES — FIXED
========================================================= */

function renderLines(){

    /*
       Полностью очищаем SVG.
       Старые линии никогда не остаются.
    */

    lines.innerHTML = "";


    for(const link of db.links){

        const from =
            db.nodes[link.from];

        const to =
            db.nodes[link.to];

        if(!from || !to){
            continue;
        }


        const a = nodeCenter(from);
        const b = nodeCenter(to);


        /*
           Делаем красивую горизонтальную кривую.
           Она автоматически подстраивается под позицию узлов.
        */

        const dx = Math.abs(b.x - a.x);

        const curve =
            Math.max(
                70,
                Math.min(260,dx * .45)
            );


        const direction =
            b.x >= a.x ? 1 : -1;


        const c1x =
            a.x + curve * direction;

        const c1y =
            a.y;

        const c2x =
            b.x - curve * direction;

        const c2y =
            b.y;


        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );


        path.setAttribute(
            "d",
            `M ${a.x} ${a.y}
             C ${c1x} ${c1y},
               ${c2x} ${c2y},
               ${b.x} ${b.y}`
        );

        path.setAttribute(
            "class",
            "graph-line-bg"
        );

        lines.appendChild(path);


        const visiblePath =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );

        visiblePath.setAttribute(
            "d",
            `M ${a.x} ${a.y}
             C ${c1x} ${c1y},
               ${c2x} ${c2y},
               ${b.x} ${b.y}`
        );

        visiblePath.setAttribute(
            "class",
            "graph-line"
        );

        lines.appendChild(visiblePath);


        /*
           Маленькие точки на концах.
        */

        const startDot =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        startDot.setAttribute("cx",a.x);
        startDot.setAttribute("cy",a.y);
        startDot.setAttribute("r","2.8");
        startDot.setAttribute(
            "class",
            "graph-line-dot"
        );

        lines.appendChild(startDot);


        const endDot =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );

        endDot.setAttribute("cx",b.x);
        endDot.setAttribute("cy",b.y);
        endDot.setAttribute("r","2.8");
        endDot.setAttribute(
            "class",
            "graph-line-dot"
        );

        lines.appendChild(endDot);
    }
}


/* =========================================================
   NODE DRAG
========================================================= */

function handleNodePointerDown(event,id){

    if(
        event.target.closest(".node-tools")
    ){
        return;
    }

    event.preventDefault();
    event.stopPropagation();

    const node = db.nodes[id];

    if(!node){
        return;
    }

    selectedNodeId = id;

    draggingNode = {
        id,
        startX:event.clientX,
        startY:event.clientY,
        nodeX:node.x,
        nodeY:node.y
    };

    renderNodes();

    document.addEventListener(
        "pointermove",
        handleNodePointerMove
    );

    document.addEventListener(
        "pointerup",
        handleNodePointerUp,
        {once:true}
    );
}


function handleNodePointerMove(event){

    if(!draggingNode){
        return;
    }

    const node =
        db.nodes[draggingNode.id];

    if(!node){
        return;
    }

    /*
       Учитываем zoom.
    */

    const dx =
        (event.clientX - draggingNode.startX)
        / view.scale;

    const dy =
        (event.clientY - draggingNode.startY)
        / view.scale;

    node.x =
        draggingNode.nodeX + dx;

    node.y =
        draggingNode.nodeY + dy;


    /*
       Двигаем DOM node напрямую,
       не пересоздавая всё дерево.
    */

    const el =
        world.querySelector(
            `.node[data-id="${CSS.escape(node.id)}"]`
        );

    if(el){

        el.style.left =
            (node.x + 5000) + "px";

        el.style.top =
            (node.y + 5000) + "px";
    }


    /*
       И СРАЗУ обновляем линии.
    */

    renderLines();
}


function handleNodePointerUp(){

    if(!draggingNode){
        return;
    }

    draggingNode = null;

    document.removeEventListener(
        "pointermove",
        handleNodePointerMove
    );

    saveDB();
}


/* =========================================================
   DELETE NODE
========================================================= */

function deleteNode(id){

    if(!db.nodes[id]){
        return;
    }

    delete db.nodes[id];

    db.links =
        db.links.filter(link=>{
            return (
                link.from !== id &&
                link.to !== id
            );
        });

    if(selectedNodeId === id){
        selectedNodeId = null;
    }

    renderAll();
    saveDB();

    showToast("Узел удалён");
}


/* =========================================================
   EDIT NODE
========================================================= */

function editNode(id){

    const node = db.nodes[id];

    if(!node){

    const value =
        prompt("Новое значение узла:",node.value);

    if(value === null){

    }

    renderAll();

}

function selectNode(id){

document

/* =========================================================
   ADDRESS
========================================================= */

async function checkAddressReal(value){

    toolResult.style.display = "block";
    toolResult.textContent = "Поиск адреса...";

    addressResults.innerHTML = "";

    try{

        const response =
            await fetch(
                "/api/map/search?q=" +
                encodeURIComponent(value),
                {
                    headers:{
                        "Accept":"application/json"
                    }
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                data?.detail ||
                "Ошибка поиска"
            );
        }


        if(!Array.isArray(data) || !data.length){

            toolResult.textContent =
                "Адрес не найден.";

            return;
        }


        toolResult.textContent =
            "Найдено: " +
            data.length;


        data.forEach(item=>{

            const div =
                document.createElement("div");

            div.className = "address-item";

            div.innerHTML = `
                <b>${escapeHTML(item.display_name)}</b>
                <small>
                    ${escapeHTML(item.type || "")}
                    ·
                    ${escapeHTML(item.country || "")}
                </small>
            `;


            div.addEventListener("click",()=>{

                createAddressGraph(item);

                closeModal("toolModal");

                db.searches++;

                saveDB();
            });


            addressResults.appendChild(div);
        });


    }catch(error){

        console.error(error);

        toolResult.textContent =
            "Ошибка: " +
            (error.message || "неизвестная ошибка");
    }
}


/* =========================================================
   ADDRESS GRAPH
========================================================= */

function createAddressGraph(item){

    const group =
        "address:" +
        String(item.display_name || "")
            .slice(0,80);


    removeGraphGroup(group);


    const rootId = uid("address");

    db.nodes[rootId] = {

        id:rootId,

        type:"ADDRESS",

        value:
            item.display_name ||
            "Unknown address",

        x:-900,

        y:0,

        group,

        level:0
    };


    const fields = [

        ["COUNTRY",item.country],

        ["COUNTRY CODE",item.country_code],

        ["STATE",item.state],

        ["CITY",item.city],

        ["ROAD",item.road],

        ["HOUSE",item.house_number],

        ["POSTCODE",item.postcode],

        ["TYPE",item.type],

        ["LATITUDE",item.lat],

        ["LONGITUDE",item.lon]

    ].filter(
        ([,value]) =>
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
    );


    const PER_COLUMN = 5;

    const COLUMN_GAP = 410;

    const ROW_GAP = 135;

    const columns = [];

    for(
        let i=0;
        i<fields.length;
        i+=PER_COLUMN
    ){

        columns.push(
            fields.slice(i,i+PER_COLUMN)
        );
    }


    let previousIds = [rootId];


    columns.forEach((column,columnIndex)=>{

        const ids = [];

        const totalHeight =
            (column.length - 1) * ROW_GAP;

        column.forEach((field,index)=>{

            const id =
                uid("address_meta");

            const node = {

                id,

                type:field[0],

                value:String(field[1]),

                x:
                    -900 +
                    COLUMN_GAP * (columnIndex + 1),

                y:
                    -totalHeight / 2 +
                    index * ROW_GAP,

                group,

                level:columnIndex + 1
            };

            db.nodes[id] = node;

            ids.push(id);


            /*
               Автоматически подключаем
               к ближайшему узлу предыдущей колонки.
            */

            let closest = previousIds[0];

            let distance = Infinity;

            for(const previousId of previousIds){

                const previous =
                    db.nodes[previousId];

                const d =
                    Math.abs(
                        previous.y - node.y
                    );

                if(d < distance){

                    distance = d;
                    closest = previousId;
                }
            }

            addLink(closest,id);
        });


        previousIds = ids;
    });


    renderAll();

    centerGraphToNode(rootId);
}


/* =========================================================
   GRAPH PAN / ZOOM
========================================================= */

function applyView(){

    world.style.transform =
        `translate(calc(-50% + ${view.x}px), calc(-50% + ${view.y}px)) scale(${view.scale})`;
}


graph.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();

        const oldScale = view.scale;

        const factor =
            event.deltaY > 0
                ? .9
                : 1.1;

        view.scale =
            Math.max(
                .25,
                Math.min(2.2,view.scale * factor)
            );

        /*
           Масштабируем относительно центра.
        */

        if(oldScale !== view.scale){
            applyView();
        }

    },
    {passive:false}
);


/*
   Pan — только если не тянем node.
*/

graph.addEventListener(
    "pointerdown",
    event=>{

        if(
            event.target.closest(".node") ||
            event.target.closest(".chain-toolbar") ||
            event.target.closest(".sidebar")
        ){
            return;
        }

        panState.active = true;

        panState.startX = event.clientX;
        panState.startY = event.clientY;

        panState.originX = view.x;
        panState.originY = view.y;

        graph.setPointerCapture?.(event.pointerId);
    }
);


graph.addEventListener(
    "pointermove",
    event=>{

        if(!panState.active){
            return;
        }

        view.x =
            panState.originX +
            (event.clientX - panState.startX);

        view.y =
            panState.originY +
            (event.clientY - panState.startY);

        applyView();
    }
);


graph.addEventListener(
    "pointerup",
    ()=>{
        panState.active = false;
    }
);

graph.addEventListener(
    "pointercancel",
    ()=>{
        panState.active = false;
    }
);


/* =========================================================
   CENTER
========================================================= */

function centerGraph(){

    view.scale = 1;
    view.x = 0;
    view.y = 0;

    applyView();
}


function centerGraphToNode(id){

    const node = db.nodes[id];

    if(!node){
        return;
    }

    /*
       Node координата относительно центра world.
       Поэтому просто двигаем view в обратную сторону.
    */

    view.x = -node.x * view.scale;
    view.y = -node.y * view.scale;

    applyView();
}

function makeAvatar(name){

    const letter =
        String(name || "N")
            .trim()
            .charAt(0)
            .toUpperCase() || "N";


    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
             width="200"
             height="200"
             viewBox="0 0 200 200">

            <rect
                width="200"
                height="200"
                rx="45"
                fill="#111"
            />

            <text
                x="100"
                y="125"
                text-anchor="middle"
                font-size="100"
                font-family="Arial"
                font-weight="900"
                fill="white"
            >
                ${letter}
            </text>

        </svg>
    `;

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}


/* =========================================================
   SATURN PARTICLE SYSTEM
========================================================= */

const saturnCanvas =
    document.getElementById("saturn");

const saturnCtx =
    saturnCanvas.getContext("2d");

let particles = [];

let saturnRotation = 0;


function resizeSaturn(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    const rect =
        saturnCanvas.getBoundingClientRect();

    saturnCanvas.width =
        rect.width * dpr;

    saturnCanvas.height =
        rect.height * dpr;

    saturnCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    createParticles();
}


function createParticles(){

    particles = [];

    const rect =
        saturnCanvas.getBoundingClientRect();

    const cx =
        rect.width / 2;

    const cy =
        rect.height / 2;

    const radius =
        Math.min(
            rect.width,
            rect.height
        ) * .38;


    for(let i=0;i<1050;i++){

        const theta =
            Math.random() * Math.PI * 2;

        const phi =
            Math.acos(
                2 * Math.random() - 1
            );

        const r =
            radius *
            Math.cbrt(Math.random());

        particles.push({

            theta,

            phi,

            r,

            cx,

            cy,

            size:
                .35 +
                Math.random() * 1.2,

            alpha:
                .08 +
                Math.random() * .5

        });
    }
}


function animateSaturn(){

    const rect =
        saturnCanvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    saturnCtx.clearRect(
        0,
        0,
        width,
        height
    );


    saturnRotation += .00065;


    for(const p of particles){

        const sinPhi =
            Math.sin(p.phi);

        const x3 =
            p.r *
            sinPhi *
            Math.cos(
                p.theta + saturnRotation
            );

        const z3 =
            p.r *
            sinPhi *
            Math.sin(
                p.theta + saturnRotation
            );

        const y3 =
            p.r *
            Math.cos(p.phi);


        const perspective =
            1 /
            (
                1 +
                z3 /
                (p.r * 5 + 1)
            );


        const x =
            p.cx +
            x3 *
            perspective;

        const y =
            p.cy +
            y3 *
            perspective;


        const alpha =
            p.alpha *
            (.55 + perspective * .45);


        saturnCtx.beginPath();

        saturnCtx.arc(
            x,
            y,
            p.size * perspective,
            0,
            Math.PI * 2
        );

        saturnCtx.fillStyle =
            `rgba(255,255,255,${alpha})`;

        saturnCtx.fill();
    }


    requestAnimationFrame(
        animateSaturn
    );
}
