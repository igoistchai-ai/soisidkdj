<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NZX OSINT TOOL</title>

<style>
:root{
  --bg:#050505;
  --panel:rgba(10,10,10,.92);
  --card:#111;
  --text:#f5f5f5;
  --muted:#777;
  --dim:#444;
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.22);
  --good:#d9ffd9;
  --warn:#ffe7a3;
  --bad:#ff9b9b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,textarea{
  font:inherit;
}

button{
  color:inherit;
  border:0;
}

.app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

/* TOP */

.topbar{
  height:70px;
  flex:none;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  border-bottom:1px solid var(--line);
  background:rgba(5,5,5,.88);
  backdrop-filter:blur(25px);
  z-index:100;
}

.logo{
  width:43px;
  height:43px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#050505;
  font-weight:1000;
  font-size:20px;
  box-shadow:0 0 35px rgba(255,255,255,.08);
}

.brand b{
  display:block;
  font-size:14px;
  letter-spacing:1px;
}

.brand small{
  display:block;
  margin-top:2px;
  color:#555;
  font-size:8px;
  letter-spacing:2px;
}

.profile-mini{
  width:40px;
  height:40px;
  margin-left:8px;
  flex:none;
  padding:0;
  border:1px solid var(--line2);
  border-radius:50%;
  overflow:hidden;
  background:#111;
  cursor:pointer;
}

.profile-mini img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-mini img:not([src]),
.profile-mini img[src=""]{
  display:none;
}

.top-tools{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.top-btn{
  height:38px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0e0e0e;
  color:#aaa;
  cursor:pointer;
  font-size:10px;
  font-weight:800;
  letter-spacing:.8px;
  transition:.2s;
}

.top-btn:hover{
  color:#fff;
  border-color:var(--line2);
  background:#151515;
}

.top-btn.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
}

/* BODY */

.body{
  flex:1;
  min-height:0;
  display:flex;
}

.sidebar{
  width:70px;
  flex:none;
  border-right:1px solid var(--line);
  background:#070707;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:13px 8px;
  z-index:80;
}

.side-btn{
  width:48px;
  height:48px;
  margin-bottom:7px;
  border-radius:12px;
  border:1px solid transparent;
  background:transparent;
  color:#555;
  cursor:pointer;
  font-size:17px;
  transition:.2s;
}

.side-btn:hover{
  color:#fff;
  background:#111;
}

.side-btn.active{
  color:#fff;
  border-color:var(--line);
  background:#111;
}

.main{
  position:relative;
  flex:1;
  min-width:0;
  min-height:0;
  overflow:hidden;
}

/* PAGES */

.page{
  position:absolute;
  inset:0;
  display:none;
}

.page.active{
  display:block;
  animation:pageIn .25s ease;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* SATURN */

.saturn{
  position:absolute;
  width:720px;
  height:720px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.48;
}

#saturn{
  width:100%;
  height:100%;
}

.saturn-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:74%;
  height:24%;
  transform:
    translate(-50%,-50%)
    rotateX(67deg)
    rotateZ(-15deg);
  border:1px solid rgba(220,220,220,.15);
  border-radius:50%;
  box-shadow:
    0 0 0 8px rgba(255,255,255,.012),
    0 0 35px rgba(255,255,255,.04);
}

/* CHAIN */

.chain-page{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.chain-toolbar{
  position:absolute;
  left:16px;
  right:16px;
  top:15px;
  height:52px;
  z-index:30;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(8,8,8,.82);
  backdrop-filter:blur(20px);
}

.chain-search{
  flex:1;
  height:38px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:0 10px;
}

.chain-search::placeholder{
  color:#555;
}

.graph{
  position:absolute;
  inset:0;
  overflow:hidden;
  cursor:grab;
  background-image:
    linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,30px 30px;
}

.graph.dragging{
  cursor:grabbing;
}

.world{
  position:absolute;
  width:1px;
  height:1px;
  left:0;
  top:0;
  transform-origin:0 0;
}

.lines{
  position:absolute;
  left:-5000px;
  top:-5000px;
  width:10000px;
  height:10000px;
  overflow:visible;
  pointer-events:none;
}

.edge{
  fill:none;
  stroke:rgba(220,220,220,.32);
  stroke-width:2;
  vector-effect:non-scaling-stroke;
  stroke-linecap:round;
}

.edge-glow{
  fill:none;
  stroke:rgba(255,255,255,.035);
  stroke-width:9;
  vector-effect:non-scaling-stroke;
}

.node{
  position:absolute;
  width:225px;
  min-height:106px;
  transform:translate(-50%,-50%);
  user-select:none;
  animation:nodeIn .4s cubic-bezier(.16,1,.3,1);
}

@keyframes nodeIn{
  from{
    opacity:0;
    transform:translate(-50%,-50%) scale(.7);
    filter:blur(4px);
  }
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:none;
  }
}

.node-card{
  position:relative;
  min-height:106px;
  padding:16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  background:
    linear-gradient(145deg,rgba(24,24,24,.98),rgba(9,9,9,.98));
  box-shadow:
    0 22px 60px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.04);
  cursor:grab;
  transition:.2s;
}

.node-card:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.28);
}

.node.moving .node-card{
  transform:scale(1.04);
  border-color:#fff;
}

.node-title{
  font-weight:850;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.node-type{
  display:inline-flex;
  margin-top:7px;
  padding:3px 7px;
  border-radius:6px;
  background:#1b1b1b;
  color:#888;
  font-size:8px;
  letter-spacing:1px;
}

.node-content{
  margin-top:8px;
  color:#777;
  font-size:12px;
  line-height:1.45;
  max-height:40px;
  overflow:hidden;
  white-space:pre-line;
}

.node-dot{
  position:absolute;
  right:-7px;
  top:50%;
  width:13px;
  height:13px;
  transform:translateY(-50%);
  border-radius:50%;
  background:#111;
  border:2px solid #888;
  box-shadow:0 0 0 5px #070707;
  z-index:5;
}

.node.near .node-dot{
  background:#fff;
  border-color:#fff;
  box-shadow:
    0 0 0 5px #070707,
    0 0 22px rgba(255,255,255,.7);
}

.node-found .node-card{
  animation:foundPulse 1s ease 3;
  border-color:#fff;
}

@keyframes foundPulse{
  50%{
    box-shadow:
      0 0 0 3px rgba(255,255,255,.12),
      0 0 50px rgba(255,255,255,.12);
  }
}

.node-delete{
  position:absolute;
  right:8px;
  top:8px;
  width:23px;
  height:23px;
  border-radius:7px;
  background:#000;
  color:#777;
  cursor:pointer;
  opacity:0;
}

.node-card:hover .node-delete{
  opacity:1;
}

/* TOOL MODAL */

.tool-modal{
  position:fixed;
  inset:0;
  z-index:450;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(14px);
  padding:20px;
}

.tool-modal.show{
  display:grid;
}

.modal-box{
  width:min(510px,100%);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;
  background:
    linear-gradient(145deg,#151515,#090909);
  box-shadow:0 35px 120px rgba(0,0,0,.75);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-top h2{
  margin:0;
  font-size:19px;
}

.close{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#111;
  color:#777;
  cursor:pointer;
}

.close:hover{
  color:#fff;
}

.modal-description{
  color:#666;
  font-size:11px;
  line-height:1.5;
  margin-bottom:15px;
}

.modal-input{
  width:100%;
  height:50px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:#070707;
  color:#fff;
}

.modal-input:focus{
  border-color:var(--line2);
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  height:43px;
  flex:1;
  border-radius:10px;
  cursor:pointer;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
}

.modal-actions button.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
  font-weight:850;
}

.results{
  margin-top:17px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.result{
  min-height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0d0d0d;
  animation:resultIn .25s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.result-icon{
  width:34px;
  height:34px;
  flex:none;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#181818;
  color:#aaa;
  font-size:11px;
  font-weight:900;
}

.result-main{
  flex:1;
  min-width:0;
}

.result-main b{
  display:block;
  font-size:12px;
}

.result-main small{
  display:block;
  margin-top:3px;
  color:#666;
  font-size:10px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result-status{
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
}

.status-found{color:var(--good)}
.status-unknown{color:var(--warn)}
.status-error{color:var(--bad)}
.status-info{color:#aaa}

/* PROFILE */

.profile{
  position:absolute;
  inset:0;
  overflow:auto;
  padding:40px;
}

.profile-card{
  width:min(720px,100%);
  margin:auto;
  padding:25px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#0c0c0c;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:18px;
}

.profile-avatar{
  width:88px;
  height:88px;
  flex:none;
  object-fit:cover;
  border-radius:50%;
  border:1px solid var(--line2);
  background:#151515;
}

.profile-info h1{
  margin:0;
  font-size:23px;
}

.profile-info p{
  margin:5px 0 0;
  color:#666;
}

.profile-actions{
  margin-top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.profile-button{
  height:40px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
  cursor:pointer;
}

.profile-button:hover{
  color:#fff;
}

.profile-button.primary{
  background:#fff;
  color:#000;
}

/* NODE MODAL */

#nodeModal{
  position:fixed;
  inset:0;
  z-index:400;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(10px);
  padding:20px;
}

.node-modal-box{
  width:min(450px,100%);
  padding:23px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(145deg,#151515,#0b0b0b);
  box-shadow:0 35px 100px #000;
}

.field{
  margin-top:13px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#666;
  font-size:9px;
  letter-spacing:1px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#080808;
  color:#fff;
  border-radius:11px;
  padding:12px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.btn{
  height:39px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#111;
  color:#aaa;
  cursor:pointer;
  transition:.18s;
}

.btn:hover{
  color:#fff;
  border-color:var(--line2);
}

.btn.primary{
  background:#fff;
  color:#050505;
  border-color:#fff;
  font-weight:850;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:700;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:10px 16px;
  border-radius:999px;
  background:#fff;
  color:#050505;
  font-size:10px;
  font-weight:850;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:760px){

  .topbar{
    height:62px;
  }

  .brand small{
    display:none;
  }

  .brand b{
    font-size:11px;
  }

  .top-tools{
    display:none;
  }

  .sidebar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:57px;
    flex-direction:row;
    justify-content:space-around;
    padding:4px;
    border-right:0;
    border-top:1px solid var(--line);
    z-index:300;
  }

  .side-btn{
    margin:0;
    height:48px;
  }

  .main{
    padding-bottom:57px;
  }

  .saturn{
    width:520px;
    height:520px;
  }

  .chain-toolbar{
    left:9px;
    right:9px;
    top:9px;
  }

  .chain-search{
    min-width:0;
  }

  .profile{
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

  <div class="logo">N</div>

  <div class="brand">
    <b>NZX OSINT TOOL</b>
    <small>INTELLIGENCE WORKSPACE</small>
  </div>

  <div class="top-tools">

    <button class="top-btn" onclick="openTool('phone')">
      CHECK NUMBER
    </button>

    <button class="top-btn" onclick="openTool('email')">
      CHECK GMAIL
    </button>

    <button class="top-btn" onclick="openTool('address')">
      CHECK ADDRESS
    </button>

  </div>

  <button class="profile-mini" onclick="openProfile()">
    <img id="miniAvatar" alt="">
  </button>

</header>

<div class="body">

<aside class="sidebar">

  <button class="side-btn active"
          data-page="chain"
          onclick="showPage('chain')"
          title="Chain">
    ⌘
  </button>

  <button class="side-btn"
          data-page="profile"
          onclick="openProfile()"
          title="Profile">
    ◎
  </button>

</aside>

<main class="main">

<!-- GRAPH -->

<section class="page active" id="page-chain">

  <div class="chain-page">

    <div class="chain-toolbar">

      <input
        class="chain-search"
        id="chainSearch"
        placeholder="Search chain or node..."
      >

      <button class="btn" onclick="openNodeModal()">
        ＋ Node
      </button>

      <button class="btn" onclick="centerGraph()">
        ⌂
      </button>

    </div>

    <div class="graph" id="graph">

      <div class="saturn">

        <canvas id="saturn"></canvas>

        <div
          class="saturn-ring"
          id="saturnRing">
        </div>

      </div>

      <div class="world" id="world">

        <svg
          class="lines"
          id="lines"
          viewBox="-5000 -5000 10000 10000">
        </svg>

      </div>

    </div>

  </div>

</section>

<!-- PROFILE -->

<section class="page" id="page-profile">

  <div class="profile">

    <div class="profile-card">

      <div class="profile-head">

        <img
          class="profile-avatar"
          id="profileAvatar"
          alt=""
        >

        <div class="profile-info">

          <h1 id="profileName">
            NZX User
          </h1>

          <p id="profileUsername">
            @nzx_user
          </p>

        </div>

      </div>

      <div class="profile-actions">

        <button
          class="profile-button primary"
          onclick="chooseAvatar()">
          Choose avatar
        </button>

        <button
          class="profile-button"
          onclick="editProfileName()">
          Edit name
        </button>

        <button
          class="profile-button"
          onclick="showPage('chain')">
          Back to Chain
        </button>

      </div>

      <input
        id="avatarFile"
        type="file"
        accept="image/*"
        style="display:none"
      >

    </div>

  </div>

</section>

</main>
</div>
</div>

<!-- TOOL MODAL -->

<div
  class="tool-modal"
  id="toolModal"
  onclick="outsideToolModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()">

    <div class="modal-top">

      <h2 id="toolTitle">
        Check
      </h2>

      <button
        class="close"
        onclick="closeTool()">
        ×
      </button>

    </div>

    <div
      class="modal-description"
      id="toolDescription">
    </div>

    <input
      class="modal-input"
      id="toolInput"
      autocomplete="off"
    >

    <div class="modal-actions">

      <button onclick="closeTool()">
        CLOSE
      </button>

      <button
        class="primary"
        id="toolRun"
        onclick="runTool()">
        CHECK
      </button>

    </div>

    <div
      class="results"
      id="toolResults">
    </div>

  </div>

</div>

<!-- NODE MODAL -->

<div id="nodeModal">

  <div class="node-modal-box">

    <h2
      id="nodeModalTitle"
      style="margin:0 0 18px">
      New Node
    </h2>

    <div class="field">

      <label>NAME</label>

      <input
        id="nodeTitle"
        placeholder="Username">
    </div>

    <div class="field">

      <label>TYPE</label>

      <input
        id="nodeType"
        placeholder="EMAIL / USERNAME / LOCATION">
    </div>

    <div class="field">

      <label>CONTENT</label>

      <textarea
        id="nodeContent"
        placeholder="Information...">
      </textarea>

    </div>

    <div
      style="
      display:flex;
      gap:8px;
      margin-top:17px">

      <button
        class="btn"
        style="margin-left:auto"
        onclick="closeNodeModal()">
        Cancel
      </button>

      <button
        class="btn primary"
        onclick="saveNode()">
        Save
      </button>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   LOCAL DATABASE
========================================================= */

const STORAGE_KEY="nzx-osint-real-v1";

let db={
  nodes:{},
  links:[],
  profile:{
    name:"NZX User",
    username:"nzx_user",
    avatar:""
  },
  searches:0
};

try{
  const saved=localStorage.getItem(STORAGE_KEY);

  if(saved){
    const parsed=JSON.parse(saved);

    if(parsed){
      db=Object.assign(db,parsed);

      if(!db.nodes)db.nodes={};
      if(!db.links)db.links=[];
      if(!db.profile)db.profile={};
    }
  }
}catch(e){}

function saveDB(){
  try{
    localStorage.setItem(

async function checkPhoneReal(value){

  addResult(
    "REQUEST",
    "Проверка номера...",
    "INFO",
    "•"
  );

  try{

    const response=
      await fetch(
        "/api/osint/phone",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            phone:value
          })
        }
      );

    let data=null;

    try{
      data=await response.json();
    }catch(e){}

    $("toolResults").innerHTML="";

    if(response.status===401){

      addResult(
        "API AUTHENTICATION",
        "Backend API вернул 401 Unauthorized. Проверь API key в Render Environment Variables.",
        "ERROR",
        "!"
      );

      return;
    }

    if(!response.ok){

      addResult(
        "BACKEND ERROR",
        data?.detail||
        `HTTP ${response.status}`,
        "ERROR",
        "!"
      );

      return;
    }

    if(!data){

      addResult(
        "RESPONSE",
        "Backend не вернул JSON.",
        "ERROR",
        "!"
      );

      return;
    }

    /*
      НИКАКИХ ПРИДУМАННЫХ РЕЗУЛЬТАТОВ.
      Выводим только то, что реально пришло
      от backend.
    */

    renderBackendObject(data);

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      "Не удалось связаться с backend.",
      "ERROR",
      "!"
    );
  }
}

/* =========================================================
   ADDRESS
========================================================= */

async function checkAddressReal(value){

  addResult(
    "REQUEST",
    "Поиск координат...",
    "INFO",
    "•"
  );

  try{

    let query=value;

    /*
      Если пользователь ввёл:
      40.1772, 44.5035
      отправляем координаты как reverse lookup.
    */

    const coordinateMatch=
      value.match(
        /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/
      );

    let url;

    if(coordinateMatch){

      const lat=
        parseFloat(coordinateMatch[1]);

      const lon=
        parseFloat(coordinateMatch[2]);

      if(
        lat<-90||
        lat>90||
        lon<-180||
        lon>180
      ){

        $("toolResults").innerHTML="";

        addResult(
          "COORDINATES",
          "Координаты вне допустимого диапазона.",
          "ERROR",
          "!"
        );

        return;
      }

      url=
        "https://nominatim.openstreetmap.org/reverse"+
        "?format=jsonv2"+
        "&lat="+
        encodeURIComponent(lat)+
        "&lon="+
        encodeURIComponent(lon)+
        "&addressdetails=1";

    }else{

      url=
        "https://nominatim.openstreetmap.org/search"+
        "?format=jsonv2"+
        "&limit=1"+
        "&addressdetails=1"+
        "&q="+
        encodeURIComponent(query);
    }

    const response=
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json",
            "User-Agent":
              "NZX-OSINT-TOOL/1.0"
          }
        }
      );

    if(!response.ok){

      $("toolResults").innerHTML="";

      addResult(
        "GEOCODING ERROR",
        `HTTP ${response.status}`,
        "ERROR",
        "!"
      );

      return;
    }

    const data=
      await response.json();

    $("toolResults").innerHTML="";

    if(
      Array.isArray(data)&&
      data.length===0
    ){

      addResult(
        "LOCATION",
        "Адрес не найден.",
        "UNKNOWN",
        "?"
      );

      return;
    }

    const place=
      Array.isArray(data)
      ?data[0]
      :data;

    if(!place){

      addResult(
        "LOCATION",
        "Нет результата.",
        "UNKNOWN",
        "?"
      );

      return;
    }

    addResult(
      "DISPLAY NAME",
      place.display_name||
      place.name||
      "UNKNOWN",
      "FOUND",
      "⌖"
    );

    if(place.lat!=null){

      addResult(
        "LATITUDE",
        String(place.lat),
        "FOUND",
        "N"
      );
    }

    if(place.lon!=null){

      addResult(
        "LONGITUDE",
        String(place.lon),
        "FOUND",
        "E"
      );
    }

    if(place.type){

      addResult(
        "TYPE",
        String(place.type),
        "FOUND",
        "T"
      );
    }

    if(place.address){

      const addressParts=
        Object.entries(place.address)
          .map(([key,val])=>
            `${key}: ${val}`
          )
          .join(" · ");

      if(addressParts){

        addResult(
          "ADDRESS DETAILS",
          addressParts,
          "FOUND",
          "A"
        );
      }
    }

  }catch(error){

    $("toolResults").innerHTML="";

    addResult(
      "CONNECTION",
      "Не удалось выполнить геопоиск.",
      "ERROR",
      "!"
    );
  }
}

/* =========================================================
   BACKEND RESULT RENDERER
========================================================= */

function renderBackendObject(data){

  /*
    Backend может вернуть разные поля.
    Здесь НИЧЕГО не вычисляется и не придумывается.
    Мы показываем фактический JSON backend.
  */

  if(
    data &&
    typeof data==="object"
  ){

    let rendered=false;

    Object.entries(data).forEach(
      ([key,value])=>{

        if(
          key==="services" &&
          Array.isArray(value)
        ){

          value.forEach(service=>{

            if(
              service &&
              typeof service==="object"
            ){

              const name=
                service.service||
                service.name||
                "SERVICE";

              const status=
                String(
                  service.status||
                  "UNKNOWN"
                ).toUpperCase();

              const detail=
                service.detail||
                service.message||
                service.url||
                "No additional data";

              let finalStatus=
                "UNKNOWN";

              if(status==="FOUND"){
                finalStatus="FOUND";
              }else if(
                status==="ERROR"
              ){
                finalStatus="ERROR";
              }

              addResult(
                name,
                String(detail),
                finalStatus,
                name[0]||"?"
              );

              rendered=true;
            }

          });

          return;
        }

        if(
          value===null||
          value===undefined||
          typeof value==="object"
        ){
          return;
        }

        let status="INFO";

        if(
          String(value)
            .toUpperCase()==="FOUND"
        ){
          status="FOUND";
        }

        if(
          String(value)
            .toUpperCase()==="UNKNOWN"
        ){
          status="UNKNOWN";
        }

        addResult(
          key.replace(/_/g," ").toUpperCase(),
          String(value),
          status,
          key[0]||"?"
        );

        rendered=true;
      }
    );

    if(rendered)return;
  }

  addResult(
    "BACKEND RESPONSE",
    JSON.stringify(data),
    "INFO",
    "{"
  );
}

/* =========================================================
   GRAPH
========================================================= */

const graph=$("graph");
const world=$("world");
const lines=$("lines");

let scale=1;
let panX=innerWidth/2;
let panY=innerHeight/2;

let draggingNode=null;
let draggingCanvas=null;
let linking=null;
let nearest=null;

function uid(){

  return "node_"+
    Date.now().toString(36)+
    "_"+
    Math.random()
      .toString(36)
      .slice(2,8);
}

function screenToWorld(x,y){

  const r=
    graph.getBoundingClientRect();

  return {
    x:(x-r.left-panX)/scale,
    y:(y-r.top-panY)/scale
  };
}

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function linked(a,b){

  return db.links.some(l=>
    (l.a===a&&l.b===b)||
    (l.a===b&&l.b===a)
  );
}

function connect(a,b){

  if(!a||!b||a===b)return;

  if(linked(a,b))return;

  db.links.push({
    a,
    b
  });

  saveDB();
}

function closestNode(x,y,ignore){

  let result=null;
  let min=Infinity;

  Object.values(db.nodes)
    .forEach(n=>{

      if(n.id===ignore)return;

      const d=
        distance({x,y},n);

      if(d<min){
        min=d;
        result=n;
      }

    });

  return result?
    {
      node:result,
      dist:min
    }:
    null;
}

function renderNodes(){

  document.querySelectorAll(".node")
    .forEach(el=>el.remove());

  Object.values(db.nodes)
    .forEach(n=>{

      const el=
        document.createElement("div");

      el.className="node";
      el.dataset.id=n.id;

      el.style.left=n.x+"px";
      el.style.top=n.y+"px";

      el.innerHTML=`

        <div class="node-card">

          <button class="node-delete">×</button>

          <div class="node-title">
            ${escapeHTML(n.title)}
          </div>

          <div class="node-type">
            ${escapeHTML(n.type||"NODE")}
          </div>

          <div class="node-content">
            ${escapeHTML(n.content||"No data")}
          </div>

        </div>

        <div class="node-dot"></div>
      `;

      world.appendChild(el);

      const card=
        el.querySelector(".node-card");

      const dot=
        el.querySelector(".node-dot");

      const del=
        el.querySelector(".node-delete");

      card.addEventListener(
        "pointerdown",
        e=>startNodeDrag(e,n.id)
      );

      card.addEventListener(
        "dblclick",
        e=>{
          if(
            !e.target.closest(".node-delete")
          ){
            editNode(n.id);
          }
        }
      );

      dot.addEventListener(
        "pointerdown",
        e=>startLink(e,n.id)
      );

      del.addEventListener(
        "pointerdown",
        e=>e.stopPropagation()
      );

      del.addEventListener(
        "click",
        e=>{

          e.stopPropagation();

          if(confirm("Удалить узел?")){

            delete db.nodes[n.id];

            db.links=
              db.links.filter(
                l=>
                  l.a!==n.id&&
                  l.b!==n.id
              );

            saveDB();
            renderAll();
          }
        }
      );

    });

  renderLines();
}

function edgePath(a,b){

  const dx=b.x-a.x;
  const dy=b.y-a.y;

  const len=
    Math.max(
      1,
      Math.hypot(dx,dy)
    );

  const nx=dx/len;
  const ny=dy/len;

  const x1=a.x+nx*105;
  const y1=a.y+ny*40;

  const x2=b.x-nx*105;
  const y2=b.y-ny*40;

  const bend=
    Math.min(
      180,
      Math.max(50,len*.3)
    );

  return `
    M ${x1} ${y1}
    C
    ${x1+nx*bend} ${y1+ny*bend},
    ${x2-nx*bend} ${y2-ny*bend},
    ${x2} ${y2}
  `;
}

function renderLines(){

  lines.innerHTML="";

  db.links.forEach(link=>{

    const a=db.nodes[link.a];
    const b=db.nodes[link.b];

    if(!a||!b)return;

    const path=edgePath(a,b);

    const glow=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    glow.setAttribute("d",path);
    glow.classList.add("edge-glow");

    lines.appendChild(glow);

    const edge=
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );

    edge.setAttribute("d",path);
    edge.classList.add("edge");

    lines.appendChild(edge);
  });

  if(linking){

    const a=db.nodes[linking.id];

    if(a){

      const p=
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );

      p.classList.add("edge");

      p.setAttribute(
        "stroke-dasharray",
        "7 8"
      );

      p.setAttribute(
        "d",
        `M${a.x+105} ${a.y}
         C${(a.x+105+linking.x)/2} ${a.y},
         ${(a.x+105+linking.x)/2} ${linking.y},
         ${linking.x} ${linking.y}`
      );

      lines.appendChild(p);
    }
  }
}

function renderAll(){

  renderNodes();
}

function applyGraph(){

  world.style.transform=
    `translate(${panX}px,${panY}px) scale(${scale})`;

  renderLines();
}

function saveNode(){

  const title=
    $("nodeTitle")
      .value
      .trim();

  if(!title){

    toast("Введите название");

    return;
  }

  if(editingNode){

    const n=
      db.nodes[editingNode];

    n.title=title;

    n.type=
      $("nodeType")
        .value
        .trim()||
      "NODE";

    n.content=
      $("nodeContent")
        .value
        .trim();

  }else{

    const center=
      screenToWorld(
        innerWidth/2,
        innerHeight/2
      );

    const count=
      Object.keys(db.nodes).length;

    const angle=count*.8;

    const radius=
      Math.min(
        70+count*22,
        250
      );

    const id=uid();

    db.nodes[id]={
      id,
      title,
      type:
        $("nodeType")
          .value
          .trim()||
        "NODE",
      content:
        $("nodeContent")
          .value
          .trim(),
      x:
        center.x+
        Math.cos(angle)*radius,
      y:
        center.y+
        Math.sin(angle)*radius
    };

    const near=
      closestNode(
        db.nodes[id].x,
        db.nodes[id].y,
        id
      );

    if(
      near&&
      near.dist<450
    ){
      connect(
        id,
        near.node.id
      );
    }
  }

  saveDB();

  closeNodeModal();

  renderAll();

  toast("Node saved");
}

window.saveNode=saveNode;

  openNodeModal(id);
}

/* =========================================================
   DRAG
========================================================= */

function startNodeDrag(e,id){

  if(
    e.button!==undefined&&
    e.button!==0
  )return;

  e.preventDefault();
  e.stopPropagation();

  const n=db.nodes[id];

  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  draggingNode={
    id,
    dx:n.x-p.x,
    dy:n.y-p.y
  };

  const el=
    document.querySelector(
      `.node[data-id="${id}"]`
    );

  if(el){
    el.classList.add("moving");
  }
}

function startLink(e,id){

  e.preventDefault();
  e.stopPropagation();

  const p=
    screenToWorld(
      e.clientX,
      e.clientY
    );

  linking={
    id,
    x:p.x,
    y:p.y
  };

  renderLines();
}

window.addEventListener(
  "pointermove",
  e=>{

    if(draggingNode){

      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      const n=
        db.nodes[
          draggingNode.id
        ];

      n.x=
        p.x+
        draggingNode.dx;

      n.y=
        p.y+
        draggingNode.dy;

      const el=
        document.querySelector(
          `.node[data-id="${n.id}"]`
        );

      if(el){

        el.style.left=
          n.x+"px";

        el.style.top=
          n.y+"px";
      }

      const near=
        closestNode(
          n.x,
          n.y,
          n.id
        );

      document.querySelectorAll(
        ".node.near"
      ).forEach(
        x=>x.classList.remove("near")
      );

      nearest=null;

      if(
        near&&
        near.dist<160
      ){

        nearest=
          near.node.id;

        const target=
          document.querySelector(
            `.node[data-id="${nearest}"]`
          );

        if(target){
          target.classList.add("near");
        }
      }

      renderLines();
    }

    if(linking){

      const p=
        screenToWorld(
          e.clientX,
          e.clientY
        );

      linking.x=p.x;
      linking.y=p.y;

      const near=
        closestNode(
          p.x,
          p.y,
          linking.id
        );

      document.querySelectorAll(
        ".node.near"
      ).forEach(
        x=>x.classList.remove("near")
      );

      nearest=null;

      if(
        near&&
        near.dist<150
      ){

        nearest=
          near.node.id;

        const target=
          document.querySelector(
            `.node[data-id="${nearest}"]`
          );

        if(target){
          target.classList.add("near");
        }
      }

      renderLines();
    }

    if(draggingCanvas){

      panX=
        draggingCanvas.ox+
        e.clientX-
        draggingCanvas.sx;

      panY=
        draggingCanvas.oy+
        e.clientY-
        draggingCanvas.sy;

      applyGraph();
    }
  }
);

window.addEventListener(
  "pointerup",
  ()=>{

    if(draggingNode){

      const n=
        db.nodes[
          draggingNode.id
        ];

      const near=
        closestNode(
          n.x,
          n.y,
          n.id
        );

      if(
        near&&
        near.dist<160&&
        !linked(
          n.id,
          near.node.id
        )
      ){

        connect(
          n.id,
          near.node.id
        );

        toast(
          "Automatic connection created"
        );
      }

      document.querySelectorAll(
        ".node.moving"
      ).forEach(
        x=>x.classList.remove("moving")
      );

      document.querySelectorAll(
        ".node.near"
      ).forEach(
        x=>x.classList.remove("near")
      );

      draggingNode=null;
      nearest=null;

      saveDB();
      renderAll();
    }

    if(linking){

      if(
        nearest&&
        !linked(
          linking.id,
          nearest
        )
      ){

        connect(
          linking.id,
          nearest
        );

        toast("Connection created");
      }

      linking=null;
      nearest=null;

      document.querySelectorAll(
        ".node.near"
      ).forEach(
        x=>x.classList.remove("near")
      );

      renderLines();
    }

    if(draggingCanvas){

      draggingCanvas=null;

      graph.classList.remove(
        "dragging"
      );
    }
  }
);

graph.addEventListener(
  "pointerdown",
  e=>{

    if(e.target.closest(".node"))return;

    if(
      e.button!==undefined&&
      e.button!==0
    )return;

    draggingCanvas={
      sx:e.clientX,
      sy:e.clientY,
      ox:panX,
      oy:panY
    };

    graph.classList.add("dragging");
  }
);

graph.addEventListener(
  "wheel",
  e=>{

    e.preventDefault();

    const before=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    scale*=
      e.deltaY<0
      ?1.1
      :.9;

    scale=
      Math.max(
        .35,
        Math.min(2.5,scale)
      );

    const after=
      screenToWorld(
        e.clientX,
        e.clientY
      );

    panX+=
      (after.x-before.x)*scale;

    panY+=
      (after.y-before.y)*scale;

    applyGraph();

  },
  {passive:false}
);

/* =========================================================
   CENTER
========================================================= */

function centerGraph(){

  scale=1;

  panX=
    graph.clientWidth/2;

  panY=
    graph.clientHeight/2;

  applyGraph();
}

window.centerGraph=centerGraph;

/* =========================================================
   SEARCH GRAPH
========================================================= */

$("chainSearch").addEventListener(
  "input",
  function(){

    const q=
      this.value
        .trim()
        .toLowerCase();

    document.querySelectorAll(".node")
      .forEach(el=>{

        el.classList.remove(
          "node-found"
        );

        if(!q){

          el.style.opacity="1";

          return;
        }

        const n=
          db.nodes[
            el.dataset.id
          ];

        const text=
          (
            n.title+" "+
            n.type+" "+
            n.content
          ).toLowerCase();

        if(text.includes(q)){

          el.style.opacity="1";

          el.classList.add(
            "node-found"
          );

        }else{

          el.style.opacity=".13";
        }
      });
  }
);

/* =========================================================
   PROFILE
========================================================= */

function updateProfile(){

  $("profileName").textContent=
    db.profile.name||
    "NZX User";

  $("profileUsername").textContent=
    "@"+
    (
      db.profile.username||
      "nzx_user"
    );

  if(db.profile.avatar){

    $("profileAvatar").src=
      db.profile.avatar;

    $("miniAvatar").src=
      db.profile.avatar;

  }else{

    $("profileAvatar").removeAttribute(
      "src"
    );

    $("miniAvatar").removeAttribute(
      "src"
    );
  }
}

function chooseAvatar(){

  $("avatarFile").click();
}

window.chooseAvatar=chooseAvatar;

$("avatarFile").addEventListener(
  "change",
  e=>{

    const file=
      e.target.files[0];

    if(!file)return;

    if(!file.type.startsWith("image/")){

      toast("Выберите изображение");

      return;
    }

    const reader=
      new FileReader();

    reader.onload=()=>{

      db.profile.avatar=
        reader.result;

      saveDB();

      updateProfile();

      toast("Avatar updated");
    };

    reader.readAsDataURL(file);
  }
);

function editProfileName(){

  const name=
    prompt(
      "Имя:",
      db.profile.name||
      "NZX User"
    );

  if(name===null)return;

  const username=
    prompt(
      "Username:",
      db.profile.username||
      "nzx_user"
    );

  if(username===null)return;

  db.profile.name=
    name.trim()||
    "NZX User";

  db.profile.username=
    username
      .trim()
      .replace(/\s+/g,"")
      .replace(/^@/,"")||
    "nzx_user";

  saveDB();

  updateProfile();

  toast("Profile updated");
}

/* =========================================================
   SATURN
========================================================= */

(function(){

  const canvas=$("saturn");

  const ctx=
    canvas.getContext("2d");

  let W=0;
  let H=0;
  let dpr=1;

  const points=[];

  const count=1100;

  let rotation=0;

  function resize(){

    const r=
      canvas.getBoundingClientRect();

    dpr=
      Math.min(
        window.devicePixelRatio||1,
        2
      );

    W=r.width;
    H=r.height;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    ctx.setTransform(
      dpr,0,0,dpr,0,0
    );
  }

  function seed(){

    points.length=0;

    const golden=
      Math.PI*
      (3-Math.sqrt(5));

    for(
      let i=0;
      i<count;
      i++
    ){

      const y=
        1-
        (i/(count-1))*2;

      const radius=
        Math.sqrt(
          Math.max(
            0,
            1-y*y
          )
        );

      const a=i*golden;

      points.push({

        x:Math.cos(a)*radius,

        y,

        z:Math.sin(a)*radius,

        size:
          .35+
          Math.random()*1.1
      });
    }
  }

  function draw(time){

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    rotation+=.00065;

    const cx=W/2;
    const cy=H/2;

    const R=
      Math.min(W,H)*.235;

    const projected=[];

    for(const p of points){

      const c=Math.cos(rotation);
      const s=Math.sin(rotation);

      const x=
        p.x*c-
        p.z*s;

      const z=
        p.x*s+
        p.z*c;

      if(z<-.62)continue;

      const perspective=
        2.2/
        (2.2-z*.55);

      projected.push({

        x:
          cx+
          x*
          R*
          perspective,

        y:
          cy+
          p.y*
          R*
          perspective,

        z,

        size:
          p.size*
          perspective,

        alpha:
          .13+
          ((z+1)/2)*
          .57
      });
    }

    projected.sort(
      (a,b)=>a.z-b.z
    );

    for(const p of projected){

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        Math.max(
          .35,
          p.size
        ),
        0,
        Math.PI*2
      );

      ctx.fillStyle=
        `rgba(220,220,220,${p.alpha})`;

      ctx.fill();
    }

    const ring=
      $("saturnRing");

    const degrees=
      (time*.012)%360;

    ring.style.transform=
      `translate(-50%,-50%)
       rotateX(67deg)
       rotateZ(${-15+degrees}deg)`;

    requestAnimationFrame(draw);
  }

  resize();
  seed();

  requestAnimationFrame(draw);

  addEventListener(
    "resize",
    resize
  );

})();
